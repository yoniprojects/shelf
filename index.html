<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shelf & Spine — Reading Tracker</title>
<link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3mBiNx3NoAoJiRfsX4M5gVBVgbO82ha4SLtbwyYs-yw&s" />
<link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3mBiNx3NoAoJiRfsX4M5gVBVgbO82ha4SLtbwyYs-yw&s" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Shelf & Spine" />
<script>
  // Resume where I left off: if the last page visited wasn't the dashboard,
  // jump straight there before anything renders.
  // Exception: if we got here via an explicit "back to shelf" link (?home=1),
  // the user is deliberately choosing the dashboard, so skip the auto-resume.
  (function(){
    if (new URLSearchParams(location.search).has('home')) return;
    var last = localStorage.getItem('shelf:lastPage');
    if (last && last !== 'index.html') {
      location.replace(last);
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#26301F; --oxblood:#3F6B41; --oxblood-dark:#20331F; --oxblood-mid:#2C4A2A;
    --blush:#E6ECD9; --rose:#C08A4E; --cream:#F8F3E6; --gold:#C29A2E; --sage:#7C9473; --line:#DEE3D0; --muted:#748067;
    --wood:#6B4A32; --wood-dark:#3D2A1B; --shadow-tint:47,63,42;
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    margin:0;font-family:'Inter',sans-serif;color:var(--ink);
    overflow-wrap:anywhere;
    background-color:var(--cream);
    background-image:
      linear-gradient(rgba(248,243,230,.88), rgba(248,243,230,.88)),
      url("https://i.imgur.com/u5igRkn.jpeg");
    background-attachment:fixed;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7D2B8;border-radius:4px;}
  h1,h2,h3{margin:0;}
  .display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.2px;color:var(--oxblood-dark);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:210px;flex-shrink:0;background:var(--oxblood-dark);color:#fff;display:flex;flex-direction:column;padding:22px 14px;gap:4px;}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:23px;padding:2px 8px 14px;margin-bottom:12px;line-height:1.2;border-bottom:1px solid rgba(255,255,255,.16);}
  .nav-btn{text-align:left;border:none;background:transparent;color:#fff;padding:10px 34px 10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;width:100%;box-sizing:border-box;}
  .nav-btn.active{background:rgba(255,255,255,.14);}
  .nav-separator{border:none;border-top:1px dotted rgba(255,255,255,.62);margin:6px 10px;height:0;}
  .nav-item{position:relative;}
  .nav-fav-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:14px;line-height:1;padding:4px;margin:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s;}
  .nav-item:hover .nav-fav-btn{opacity:.7;pointer-events:auto;}
  .nav-item.show-fav .nav-fav-btn{opacity:.7;pointer-events:auto;}
  .nav-fav-btn.is-fav{opacity:1;pointer-events:auto;}
  .mobile-nav{display:none;}
  .main{flex:1;padding:28px 32px;min-width:0;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:2px solid var(--blush);position:relative;}
  .page-head::after{content:'';position:absolute;left:0;bottom:-2px;width:56px;height:2px;background:var(--gold);}
  .page-subtitle{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;}
  .user-chip{display:none;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.2px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--oxblood);color:#fff;}
  .btn-ghost{background:transparent;color:var(--oxblood);border:1.5px solid var(--oxblood);}
  .btn-subtle{background:var(--blush);color:var(--oxblood-dark);}
  .btn-danger{background:transparent;color:#A2572B;text-decoration:underline;padding:0;font-size:12.5px;}
  .btn-text{border:none;background:none;font-weight:700;font-size:11.5px;cursor:pointer;padding:0;font-family:inherit;}
  .pill{background:var(--blush);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;display:inline-block;}
  .pill.oxblood{background:var(--oxblood);color:#fff;}
  .pill.dnf{background:#8A7C5E;color:#fff;}
  .tracker-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .tracker-group{margin-bottom:20px;}
  .tracker-group-head{display:flex;align-items:baseline;gap:8px;padding:12px 16px 10px;}
  table.tracker td.chk, table.tracker th.chk{width:34px;padding-left:14px;}
  table.tracker tr.selected-row{outline:2px solid var(--gold);outline-offset:-2px;}
  .fact-list{display:flex;flex-direction:column;gap:16px;font-size:14.5px;}
  .fact-row{display:flex;gap:11px;align-items:flex-start;font-size:1em;line-height:1.55;}
  .fact-row .fact-icon{font-size:1.15em;flex-shrink:0;}
  .rating-shimmer{
    background: linear-gradient(90deg, #a8791b 0%, #f5d580 22%, #fffbe0 50%, #f5d580 78%, #a8791b 100%);
    background-size: 220% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: rating-shimmer-move 2.4s linear infinite;
  }
  @keyframes rating-shimmer-move{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 220% 50%; }
  }
  .card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(47,63,42,.10);}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--oxblood-dark);margin-bottom:12px;}
  .input, select.input, textarea.input{border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;background:#fff;width:100%;}
  textarea.input{min-height:60px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stars{display:inline-flex;line-height:1;}
  .stars .star-slot{position:relative;display:inline-block;width:1em;height:1em;}
  .stars .star-slot .star-base,.stars .star-slot .star-fill{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;}
  .stars .star-slot .star-base{color:#DDD1CC;}
  .stars .star-slot .star-fill{color:var(--gold);overflow:hidden;width:0%;}
  .stars.editable .star-slot{cursor:pointer;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .icon{font-size:34px;margin-bottom:10px;}
  .empty-state p{font-size:13.5px;max-width:380px;margin:0 auto 16px;line-height:1.5;}
  table.tracker{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.tracker thead tr{background:var(--oxblood-dark);color:#fff;}
  table.tracker th{padding:10px 12px;text-align:left;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.3px;}
  table.tracker td{padding:9px 12px;}
  table.tracker tbody tr{cursor:pointer;}
  table.tracker tbody tr:nth-child(odd){background:#F1EEDE;}
  table.tracker tbody tr:nth-child(even){background:#fffdf7;}
  .stat-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(47,63,42,.10);min-width:120px;}
  .stat-card .num{font-family:'Anton',sans-serif;font-size:30px;color:var(--oxblood);}
  .stat-card .label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;margin-top:2px;}
  .section-label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:10px;text-transform:uppercase;}
  .cover{border-radius:8px;display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 6px 16px rgba(0,0,0,.16);position:relative;overflow:hidden;}
  .cover span{color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:15px;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.3);letter-spacing:.2px;position:relative;z-index:1;}
  .cover::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 60%);}
  .cover.has-img{padding:0;}
  .cover.has-img img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
  .cover.has-img::before{display:none;}
  .cover-upload-box{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:12px;align-items:center;}
  .cover-preview{width:60px;height:88px;border-radius:5px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover-preview.empty{display:flex;align-items:center;justify-content:center;background:var(--blush);font-size:18px;}
  .gb-search-box{background:var(--blush);border-radius:8px;padding:12px;margin-bottom:14px;}
  .gb-search-label{font-size:12px;font-weight:700;color:var(--oxblood-dark);}
  .gb-result{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:6px;cursor:pointer;font-family:inherit;}
  .gb-result:hover{border-color:var(--oxblood);}
  .gb-result-cover{width:36px;height:52px;flex-shrink:0;border-radius:4px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .gb-result-cover img{width:100%;height:100%;object-fit:cover;}
  .gb-result-text{min-width:0;}
  .gb-result-title{font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gb-result-meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cover-card{cursor:pointer;width:128px;}
  .cover-card .cover{height:176px;margin-bottom:8px;}
  .cover-card .title{font-size:12.5px;font-weight:700;line-height:1.25;}
  .cover-card .author{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .spine{width:46px;border-radius:3px 3px 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding:10px 4px;cursor:pointer;box-shadow:inset -3px 0 6px rgba(0,0,0,.35),2px 3px 6px rgba(0,0,0,.25);flex-shrink:0;position:relative;overflow:hidden;}
  .spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.2px;text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,.9);max-height:100%;overflow:hidden;position:relative;z-index:2;}
  .spine-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.8) contrast(1.1);z-index:0;}
  .spine-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.3) 80%, rgba(0,0,0,0.6) 100%), linear-gradient(90deg, rgba(255,255,255,0.25) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.4) 100%);z-index:1;pointer-events:none;}
  .shelf-box{background:linear-gradient(180deg,var(--wood),var(--wood-dark));border-radius:10px;padding:18px 16px 0;}
  .shelf-row{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:12px;}
  .shelf-floor{height:10px;background:#2A1B10;border-radius:0 0 6px 6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(31,42,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-card{background:var(--cream);border-radius:16px;width:480px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-card.wide{width:720px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--cream);z-index:10;}
  .modal-head h3{font-family:'Anton',sans-serif;font-size:20px;color:var(--oxblood-dark);letter-spacing:.5px;text-transform:uppercase;}
  .modal-body{padding:22px;}
  .modal-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--oxblood-dark);}
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters-row .input{width:auto;flex:0 0 auto;font-size:12.5px;padding:7px 10px;}
  .filters-row input.input{flex:1;min-width:180px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
  .cal-cell{background:#fff;border-radius:8px;min-height:78px;padding:6px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;}
  .cal-cell.has-events{cursor:pointer;}
  .cal-cell.picked{border:2px solid var(--oxblood);}
  .cal-daynum{font-size:11px;color:var(--muted);font-weight:700;}
  .cal-dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;align-items:center;}
  .cal-covers{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
  .cal-cover-thumb{width:22px;height:32px;border-radius:3px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted);align-items:center;}
  .legend .dot{margin-right:5px;}
  .pie-card{display:flex;flex-direction:column;height:100%;}
  .pie-wrap{display:flex;align-items:center;justify-content:center;gap:28px;flex:1;flex-wrap:wrap;}
  .pie{width:min(46%,320px);aspect-ratio:1/1;border-radius:50%;position:relative;flex-shrink:0;}
  .pie::after{content:'';position:absolute;inset:21.7%;background:#fff;border-radius:50%;}
  .pie-legend{font-size:12.5px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 18px;flex:1;min-width:130px;max-width:420px;}
  .pie-legend .row{display:flex;align-items:center;gap:6px;padding:2px 6px;margin:-2px -6px;border-radius:6px;cursor:pointer;transition:background .15s ease, opacity .15s ease;}
  .pie-legend .sw{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .pie-svg{display:block;width:100%;height:100%;overflow:visible;}
  .pie-slice{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .15s ease, transform .15s ease, filter .15s ease;}
  .pie-wrap.has-active .pie-slice{opacity:.32;}
  .pie-wrap.has-active .pie-slice.active{opacity:1;transform:scale(1.045);filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));stroke:#fff;stroke-width:1.2;}
  .pie-wrap.has-active .pie-legend .row{opacity:.42;}
  .pie-wrap.has-active .pie-legend .row.active{opacity:1;background:var(--blush);font-weight:700;}
  .bars{display:flex;gap:4px;align-items:flex-end;height:180px;overflow-x:auto;padding-top:10px;}
  .bar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px;}
  .bar-pair{display:flex;gap:2px;align-items:flex-end;height:150px;}
  .bar{width:12px;border-radius:3px 3px 0 0;}
  .bar-month{font-size:9.5px;color:var(--muted);margin-top:4px;}
  .wish-card{width:240px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(47,63,42,.10);display:flex;flex-direction:column;}
  .wish-card .cover{width:100%;height:auto!important;aspect-ratio:2/3;}
  .wish-card .cover.has-img img{object-fit:contain;}
  .wish-body{display:flex;flex-direction:column;flex:1;}
  .wish-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .wish-title{font-weight:700;font-size:14.5px;line-height:1.3;}
  .wish-author{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3;}
  .wish-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .wish-price{font-weight:700;color:var(--oxblood);font-size:13px;}
  .wish-actions{display:flex;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
  .wish-action-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px 2px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.1px;color:var(--muted);}
  .wish-action-btn:hover{background:var(--blush);}
  .wish-action-btn svg{width:16px;height:16px;}
  .wish-action-btn.edit{color:var(--oxblood);}
  .wish-action-btn.read{color:var(--sage);}
  .wish-action-btn.remove{color:#A2572B;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:16px;}
  
  .cr-list{display:flex;flex-direction:column;}
  .cr-row{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cr-row:last-child{border-bottom:none;}
  .cr-row-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .cr-row .cr-title{font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .cr-row .cr-title:hover{text-decoration:underline;text-decoration-color:var(--line);}
  .cr-row .cr-controls{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .cr-progress-row{display:flex;align-items:center;gap:9px;}
  .cr-progress-bar{flex:1;height:6px;border-radius:999px;background:var(--blush);overflow:hidden;cursor:pointer;}
  .cr-progress-fill{height:100%;background:var(--oxblood);border-radius:999px;transition:width .25s ease;}
  .cr-progress-pct{font-size:11.5px;font-weight:700;color:var(--oxblood);cursor:pointer;flex-shrink:0;min-width:34px;text-align:right;}
  .cr-progress-pct:hover{text-decoration:underline;}

  .btn-complete {
    background: #2E7D32;
    color: #fff;
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 4px;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-complete:hover {
    background: #1B5E20;
  }

  @media (max-width:780px){
    .shell{flex-direction:column;}
    .sidebar{display:none;}
    .mobile-nav{display:flex;position:sticky;top:0;z-index:20;background:var(--oxblood-dark);align-items:stretch;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow-x:auto;}
    .mobile-nav-btn{flex:1 0 auto;min-width:54px;border:none;background:transparent;color:rgba(255,255,255,.75);padding:10px 2px 8px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;border-bottom:2.5px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mobile-nav-btn.active{color:#fff;border-bottom-color:var(--gold);}
    .mobile-more-panel{position:absolute;top:100%;right:8px;background:var(--oxblood-dark);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px;min-width:170px;z-index:21;}
    .mobile-more-panel .nav-btn{width:100%;color:#fff;}
    .mobile-more-panel .nav-btn.active{background:rgba(255,255,255,.14);}
    .mobile-more-backdrop{position:fixed;inset:0;z-index:19;}
    .grid2{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:1fr !important;}
    .book-detail-grid{grid-template-columns:120px 1fr !important;gap:14px !important;}
    .pie{width:96px;height:96px;aspect-ratio:unset;}
    .pie::after{inset:26px;}
    .main{padding:16px;max-width:100vw;}
    .page-head{align-items:flex-start;}
    #page-title{font-size:24px !important;}
    .page-head, #page-actions{width:100%;}
    #page-actions{justify-content:flex-start;}
    .user-chip{display:block;position:absolute;top:0;right:0;border:none;background:transparent;padding:0;cursor:pointer;}
    .user-chip img{width:39px;height:39px;display:block;}
    .modal-card{width:100%;}
    .modal-card.wide{width:100%;}
    .modal-body{padding:16px;}
    table.tracker{font-size:11.5px;}
    table.tracker th,table.tracker td{padding:8px 6px;}
    table.tracker th:nth-child(2),table.tracker td:nth-child(2){min-width:160px;padding-right:10px;}
    table.tracker td:nth-child(2){font-size:12.5px;line-height:1.35;}
    .stat-card{min-width:100px;flex:1 1 calc(50% - 7px);}

/* Helper to sort suggestions by the index of the typed letter */
function sortSuggestionsByInput(list, typedValue) {
  const query = (typedValue || "").trim().toLowerCase();
  if (!query) return [...list].sort((a, b) => a.localeCompare(b));
  
  return [...list].sort((a, b) => {
    const aLower = a.toLowerCase();
    const bLower = b.toLowerCase();
    const aIdx = aLower.indexOf(query);
    const bIdx = bLower.indexOf(query);

    // If both contain the query string, sort by the earliest occurrence index of that string
    if (aIdx !== -1 && bIdx !== -1) {
      if (aIdx !== bIdx) return aIdx - bIdx;
    } else if (aIdx !== -1) {
      return -1;
    } else if (bIdx !== -1) {
      return 1;
    }

    // Fallback: check matching order of the individual letters typed
    let aMatchIndex = 0;
    let bMatchIndex = 0;
    for (let char of query) {
      aMatchIndex = aLower.indexOf(char, aMatchIndex);
      bMatchIndex = bLower.indexOf(char, bMatchIndex);
      if (aMatchIndex === -1) aMatchIndex = Infinity;
      if (bMatchIndex === -1) bMatchIndex = Infinity;
    }

    if (aMatchIndex !== bMatchIndex) {
      return aMatchIndex - bMatchIndex;
    }

    return a.localeCompare(b);
  });
}

// Pulls a FRESH, COMPLETE, RAW copy of everything tied to a given profile id,
// across every collection/project used by this app and its sub-apps —
// not just the fields index.html happens to keep in `state`. This is
// deliberately redundant/defensive: if a field exists in Firebase that this
// app doesn't know about, it still gets captured because we dump whole
// documents rather than picking named fields off of them.
async function fetchFullProfileBackup(profileId){
  const result = { profileId };

  try {
    const snap = await db.collection("shelf-spine").doc(profileId).get();
    result["shelf-spine"] = snap.exists ? snap.data() : null;

  }

  return result;
}

async function exportBackupJSON(){
  const profileBackups = await Promise.all(PROFILES.map(p => fetchFullProfileBackup(p.id)));

  const backupData = {
    version: 2,
    exportedAt: new Date().toISOString(),
    note: "Full raw export across all profiles, all collections (shelf-spine — which includes books, wishlist, the yearly goal, and Goals Mode's goalsMode field — legacy library, bingo-app, wrappd-app). Each profile's data is under profiles[].",
    profiles: profileBackups
  };
  const filename = `shelf-spine-full-backup-${new Date().toISOString().slice(0,10)}.json`;
  const jsonStr = JSON.stringify(backupData, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json" });

  // iOS Safari (and in-app browsers) largely ignore the `download` attribute
  // and silently drop data: URIs, so a synthetic <a download> click is a
  // no-op there even though it works fine on desktop. Detect iOS and fall
  // back to opening the JSON in a new tab so the user can save it via the
  // share sheet.
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (!isIOS) {
    const url = URL.createObjectURL(blob);
    const dlAnchor = document.createElement('a');
    dlAnchor.href = url;
    dlAnchor.download = filename;
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } else {
    // iOS fallback: open in a new tab. The user can then use the Share
    // button in Safari to save/send the file.
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (!win) {
      // Popup blocked — fall back to navigating the current tab.
      window.location.href = url;
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  state.modal = null;
  renderModal();
}

async function restoreFullProfileBackup(profileEntry){
  const profileId = profileEntry.profileId;
  if (!profileId) return;

  const writeFirestore = async (collectionName, key) => {
    const data = profileEntry[key];
    if (!data || data.error) return; // nothing captured at export time, or that part failed — leave current data alone
    await db.collection(collectionName).doc(profileId).set(data);
  };

  await writeFirestore("shelf-spine", "shelf-spine");
  await writeFirestore("library", "library (legacy)");
  await writeFirestore("bingo-app", "bingo-app");
  await writeFirestore("wrappd-app", "wrappd-app");
}

async function importBackupJSON(file){
  if(!file) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("Could not read file"));
    reader.onload = async (e) => {
      try {
        const parsed = JSON.parse(e.target.result);

        if (parsed && parsed.version === 2 && Array.isArray(parsed.profiles)) {
          // Full multi-profile, multi-app backup produced by the current export.
          for (const profileEntry of parsed.profiles) {
            await restoreFullProfileBackup(profileEntry);
          }
          state.modal = null;
          render();
          alert("Full backup restored across all profiles and sub-apps! If you're on a Bingo, Wrapped, or Goals page, reload that page to see the restored data there.");
          resolve();
          // Reload this page so the shelf-spine listener picks up whichever
          // profile is currently active with a clean, fully-synced state.
          location.reload();
          return;
        }

        // Backward compatibility: older backups only ever contained the
        // current profile's books/wishlist (and possibly goals).
        if(parsed && (Array.isArray(parsed.books) || Array.isArray(parsed.wishlist))){
          if(Array.isArray(parsed.books)) state.books = parsed.books;
          if(Array.isArray(parsed.wishlist)) state.wishlist = parsed.wishlist;
          if(parsed.goals && typeof parsed.goals === "object") state.goals = parsed.goals;
          persistBooks();
          persistWishlist();
          if(parsed.goals) persistGoals();
          state.modal = null;
          render();
          alert("Backup restored successfully! (This was an older-format backup covering only books/wishlist/goals for the current profile.)");
          resolve();
        } else {
          alert("Invalid backup file format.");
          resolve();
        }
      } catch(err) {
        console.error("Restore failed:", err);
        reject(err);
      }
    };
    reader.readAsText(file);
  });
}

function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = ()=>cb(null);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function computeFunFacts(books){
  const facts = [];
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const completed = books.filter(b=>b.status==="done" && b.dateFinished);

  if(recent.length){
    const gmap={}; recent.forEach(b=>{ if(b.genre) gmap[b.genre]=(gmap[b.genre]||0)+1; });
    const top = Object.entries(gmap).sort((a,b)=>b[1]-a[1])[0];
    if(top) facts.push({icon:"📚", text:`In the past month you've read mostly <strong>${esc(top[0])}</strong> (${top[1]} of ${recent.length} book${recent.length===1?"":"s"} finished).`});
    else facts.push({icon:"📚", text:`You finished ${recent.length} book${recent.length===1?"":"s"} in the past month — nice pace!`});
  }

  const rated = completed.filter(b=>b.rating>0).sort((a,b)=>b.rating-a.rating || (b.dateFinished||"").localeCompare(a.dateFinished||""))[0];
  if(rated) facts.push({icon:"⭐", text:`Your top-rated read is <strong>${esc(rated.title)}</strong> at ${rated.rating}★.`});

  const withPages = completed.filter(b=>b.pagesHours && !isNaN(Number(b.pagesHours))).sort((a,b)=>Number(b.pagesHours)-Number(a.pagesHours))[0];
  if(withPages) facts.push({icon:"📖", text:`Your longest read was <strong>${esc(withPages.title)}</strong> at ${withPages.pagesHours} pages.`});

  const monthMap={};
  completed.forEach(b=>{ const key=b.dateFinished.slice(0,7); monthMap[key]=(monthMap[key]||0)+1; });
  const topMonth = Object.entries(monthMap).sort((a,b)=>b[1]-a[1])[0];
  if(topMonth && topMonth[1]>1){
    const [y,m] = topMonth[0].split("-");
    facts.push({icon:"🔥", text:`Your best month was ${monthNames[Number(m)-1]} ${y} — ${topMonth[1]} books finished.`});
  }

  const ratedAll = completed.filter(b=>b.rating>0);
  if(ratedAll.length){
    const avg = (ratedAll.reduce((s,b)=>s+b.rating,0)/ratedAll.length).toFixed(1);
    facts.push({icon:"🌟", text:`Your average rating for finished books is ${avg}★ across ${ratedAll.length} rated read${ratedAll.length===1?"":"s"}.`});
  }

  const dnfCount = books.filter(b=>b.status==="dnf").length;
  if(dnfCount) facts.push({icon:"👋", text:`You've set aside ${dnfCount} book${dnfCount===1?"":"s"} as did-not-finish — good riddance!`});

  const gmapAll={}; completed.forEach(b=>{ if(b.genre) gmapAll[b.genre]=(gmapAll[b.genre]||0)+1; });
  const topAll = Object.entries(gmapAll).sort((a,b)=>b[1]-a[1])[0];
  if(topAll) facts.push({icon:"🏆", text:`All-time, your most-read genre is <strong>${esc(topAll[0])}</strong> with ${topAll[1]} book${topAll[1]===1?"":"s"} finished.`});

  return facts;
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const books = state.books;
  if(books.length===0) return emptyState("Your dashboard wakes up once you've logged a book. Add one from the Book Tracker to see your stats here.");
  const year = new Date().getFullYear().toString();
  const completed = books.filter(b=>b.status==="done");
  const completedThisYear = completed.filter(b=>yearOf(b.dateFinished)===year);
  const rereadsThisYear = books.reduce((sum,b)=> sum + (b.rereads||[]).filter(r=>r.endDate && yearOf(r.endDate)===year).length, 0);
  const totalCountedThisYear = completedThisYear.length + rereadsThisYear;
  const reading = books.filter(b=>b.status==="reading").length;
  const dnfCount = books.filter(b=>b.status==="dnf").length;
  
  // Find all books finished in the current calendar month
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const finishedThisMonth = completed.filter(b => {
    if (!b.dateFinished) return false;
    const d = new Date(b.dateFinished + "T00:00:00");
    return !isNaN(d) && d.getFullYear() === currentYear && d.getMonth() === currentMonth;
  }).sort((a, b) => (b.dateFinished || "").localeCompare(a.dateFinished || ""));

  const funFacts = computeFunFacts(books);

  const goalVal = Number(state.goals[year]) || 0;
  let goalNum, goalPaceHTML = "";
  if(goalVal > 0){
    goalNum = `${totalCountedThisYear}<span style="font-size:16px;color:var(--muted);">/${goalVal}</span>`;
    const startOfYear = new Date(Number(year), 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / 86400000);
    const isLeap = (Number(year)%4===0 && Number(year)%100!==0) || Number(year)%400===0;
    const daysInYear = isLeap ? 366 : 365;
    const expectedByNow = goalVal * dayOfYear / daysInYear;
    const diff = Math.round(totalCountedThisYear - expectedByNow);
    const paceText = diff > 0 ? `${diff} book${diff===1?"":"s"} ahead of pace`
      : diff < 0 ? `${Math.abs(diff)} book${Math.abs(diff)===1?"":"s"} behind pace`
      : `Right on pace`;
    goalPaceHTML = `<div style="font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;">${paceText}</div>`;
  } else {
    goalNum = `<span style="font-size:16px;">Set goal</span>`;
  }

  const genreMap = {}; books.forEach(b=>{ if(b.genre) genreMap[b.genre]=(genreMap[b.genre]||0)+1; });
  const genreEntries = Object.entries(genreMap);
  const subGenreMap = {}; books.forEach(b=>{ if(b.subGenre) subGenreMap[b.subGenre]=(subGenreMap[b.subGenre]||0)+1; });
  const subGenreEntries = Object.entries(subGenreMap);
  const showingSubGenre = ui.dashGenreView === "subgenre";
  const genreViewEntries = showingSubGenre ? subGenreEntries : genreEntries;
  const genreViewColorFn = showingSubGenre ? (n=>SPINE_COLORS[hashStr(n)%SPINE_COLORS.length]) : genreColor;
  const formatMap = {}; books.forEach(b=>{ if(b.format) formatMap[b.format]=(formatMap[b.format]||0)+1; });
  const formatEntries = Object.entries(formatMap);
  const formatColors = { Physical: COLORS.oxblood, Digital: COLORS.rose, Audio: COLORS.sage };

  function dedupeAdjacentColors(entries, colorFn){
    const n = entries.length;
    if(n < 3) return entries;
    const items = entries.map(([name,val])=>({name,val,color:colorFn(name)}));
    const groups = {};
    items.forEach(it=>{ (groups[it.color] = groups[it.color]||[]).push(it); });
    const groupArr = Object.values(groups).sort((a,b)=>b.length-a.length);
    const result = new Array(n).fill(null);
    let idx = 0;
    groupArr.forEach(group=>{
      group.forEach(it=>{
        while(result[idx % n]) idx++;
        result[idx % n] = it;
        idx += 2;
      });
    });
    for(let i=0;i<n;i++){
      if(!result[i]){
        outer: for(const g of groupArr) for(const it of g){ if(!result.includes(it)){ result[i]=it; break outer; } }
      }
    }
    const colorAt = i => result[(i+n)%n].color;
    for(let pass=0; pass<n; pass++){
      let clean = true;
      for(let i=0;i<n;i++){
        if(colorAt(i) === colorAt(i+1)){
          clean = false;
          for(let j=0;j<n;j++){
            const iNext = (i+1)%n;
            if(j===i || j===iNext) continue;
            const a = result[iNext], b = result[j];
            if(a.color===b.color) continue;
            const prevOk = result[i].color !== b.color;
            const nextOk = result[(i+2)%n].color !== b.color;
            const jPrevOk = result[(j-1+n)%n].color !== a.color;
            const jNextOk = result[(j+1)%n].color !== a.color;
            if(prevOk && nextOk && jPrevOk && jNextOk){
              result[iNext] = b; result[j] = a;
              break;
            }
          }
        }
      }
      if(clean) break;
    }
    return result.map(it=>[it.name,it.val]);
  }
  function pie(entries, colorFn){
    entries = dedupeAdjacentColors(entries, colorFn);
    const total = entries.reduce((s,[,v])=>s+v,0) || 1;
    const cx=50, cy=50, rOuter=49, rInner=28;
    function polar(r, angleDeg){
      const a = (angleDeg-90) * Math.PI/180;
      return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
    }
    function slicePath(startAngle, endAngle){
      if(endAngle - startAngle >= 359.99) endAngle = startAngle + 359.99;
      const startOuter = polar(rOuter, endAngle), endOuter = polar(rOuter, startAngle);
      const startInner = polar(rInner, endAngle), endInner = polar(rInner, startAngle);
      const largeArc = (endAngle-startAngle) > 180 ? 1 : 0;
      return `M ${startOuter.x} ${startOuter.y} A ${rOuter} ${rOuter} 0 ${largeArc} 0 ${endOuter.x} ${endOuter.y} L ${endInner.x} ${endInner.y} A ${rInner} ${rInner} 0 ${largeArc} 1 ${startInner.x} ${startInner.y} Z`;
    }
    let acc = 0;
    const slices = entries.map(([name,val],i)=>{
      const start = acc/total*360; acc += val; const end = acc/total*360;
      return `<path class="pie-slice" data-idx="${i}" d="${slicePath(start,end)}" fill="${colorFn(name)}"></path>`;
    }).join("");
    const svg = slices ? `<svg class="pie-svg" viewBox="0 0 100 100">${slices}</svg>` : "";
    const pieStyle = slices ? "" : ` style="background:#eee"`;
    const legend = entries.map(([name,val],i)=>`<div class="row" data-idx="${i}"><span class="sw" style="background:${colorFn(name)}"></span>${esc(name)} · ${val}</div>`).join("");
    return `<div class="pie-wrap"><div class="pie"${pieStyle}>${svg}</div><div class="pie-legend">${legend||"<span style='color:var(--muted)'>No data yet</span>"}</div></div>`;
  }

  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const finished = new Array(12).fill(0);
  books.forEach(b=>{
    if(b.dateFinished && yearOf(b.dateFinished)===year) finished[new Date(b.dateFinished).getMonth()]++;
    (b.rereads||[]).forEach(r=>{ if(r.endDate && yearOf(r.endDate)===year) finished[new Date(r.endDate).getMonth()]++; });
  });
  const maxVal = Math.max(1, ...finished);
  const bars = monthNames.map((m,i)=>`
    <div class="bar-col">
      <div class="bar-pair">
        <div class="bar" style="height:${finished[i]/maxVal*100}%;background:${COLORS.oxblood}" title="${m} finished: ${finished[i]}"></div>
      </div>
      <div class="bar-month">${m}</div>
    </div>`).join("");

  return `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;">
      <div class="stat-card"><div class="num">${books.length}</div><div class="label">Total books</div></div>
      <div class="stat-card" title="${rereadsThisYear>0?`Includes ${rereadsThisYear} reread${rereadsThisYear===1?"":"s"}`:""}"><div class="num">${totalCountedThisYear}</div><div class="label">Read in ${year}</div></div>
      <div class="stat-card"><div class="num">${reading}</div><div class="label">Currently reading</div></div>
      <div class="stat-card"><div class="num">${completed.length}</div><div class="label">All-time completed</div></div>
      <div class="stat-card"><div class="num">${dnfCount}</div><div class="label">Did not finish</div></div>
      <div class="stat-card" style="cursor:pointer;" data-action="open-goal-form" title="Set your yearly reading goal">
        <div class="num">${goalNum}</div>
        <div class="label">${year} Goal</div>
        ${goalPaceHTML}
      </div>
    </div>
    <div id="cr-ff-row" style="display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin-bottom:18px;">
      ${(()=>{
        const readingBooks = books.filter(b=>b.status==="reading");
        if(!readingBooks.length) return "";
        // Scale row sizing down as the list grows past 3 books, so the card's
        // overall height stays roughly constant instead of growing unbounded.
        const scale = readingBooks.length > 3 ? Math.max(0.55, 3/readingBooks.length) : 1;
        const coverH = Math.round(64*scale);
        const coverW = Math.round(coverH*0.68);
        const rowPad = Math.max(5, Math.round(12*scale));
        const rowGap = Math.max(6, Math.round(12*scale));
        const innerGap = Math.max(4, Math.round(7*scale));
        const titleSize = Math.max(11.5, Math.round(13.5*scale));
        const starSize = Math.max(11, Math.round(13*scale));
        return `
      <div class="card" id="cr-card" style="flex:1 1 340px;min-width:300px;">
        <div class="section-label">Currently Reading</div>
        <div class="cr-list">
          ${readingBooks.map(b=>{
            const pct = Math.max(0, Math.min(100, Number(b.progressPercent)||0));
            return `
            <div class="cr-row" data-action="edit-progress" data-id="${b.id}" style="flex-direction:row;align-items:center;gap:${rowGap}px;padding:${rowPad}px 0;cursor:pointer;">
              <div style="width:${coverW}px;flex-shrink:0;">${coverHTML(b, coverH)}</div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:${innerGap}px;">
                <div class="cr-row-top">
                  <div class="cr-title" title="${esc(b.title)}" style="font-size:${titleSize}px;">${esc(b.title)}</div>
                  <div class="cr-controls">
                    ${starsHTML(b.rating,false,null,starSize)}
                  </div>
                </div>
                <div class="cr-progress-row">
                  <div class="cr-progress-bar"><div class="cr-progress-fill" style="width:${pct}%"></div></div>
                  <div class="cr-progress-pct">${pct}%</div>
                </div>
              </div>
            </div>`;}).join("")}
        </div>
      </div>`;
      })()}
      ${funFacts.length ? `
      <div class="card" id="ff-card" style="flex:1 1 340px;min-width:300px;">
        <div class="section-label">Fun facts</div>
        <div class="fact-list">
          ${funFacts.map(f=>`<div class="fact-row"><span class="fact-icon">${f.icon}</span><span>${f.text}</span></div>`).join("")}
        </div>
      </div>` : ""}
    </div>
    <div class="dash-grid" style="display:grid;grid-template-columns:260px 1fr 1fr;gap:16px;margin-bottom:18px;">
      <div class="card">
        <div class="section-label">Last Finished</div>
        ${finishedThisMonth.length > 0 ? `
          <div style="display:flex;flex-direction:column;gap:14px;max-height:360px;overflow-y:auto;padding-right:4px;">
            ${finishedThisMonth.map(b => `
              <div style="padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;">
                <div style="width:50px;flex-shrink:0;">${coverHTML(b, 70)}</div>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-size:13px;line-height:1.2;" title="${esc(b.title)}">${esc(b.title)}</div>
                  <div style="font-size:11.5px;color:var(--muted);margin-bottom:2px;" title="${esc(b.author)}">${esc(b.author)}</div>
                  <div style="font-size:10.5px;color:var(--muted);margin-bottom:4px;">Finished ${fmtDate(b.dateFinished)}</div>
                  ${starsHTML(b.rating, false, null, 11)}
                </div>
              </div>
            `).join("")}
          </div>
        ` : `<div style="font-size:12.5px;color:var(--muted);">No books finished this month yet.</div>`}
      </div>
      <div class="card pie-card">
        <div class="section-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <span>By ${showingSubGenre ? "sub-genre" : "genre"}</span>
          ${subGenreEntries.length ? `
          <div style="display:flex;gap:4px;">
            <button type="button" class="btn-text" data-action="dash-genre-view" data-view="genre" style="padding:2px 8px;border-radius:6px;font-size:10.5px;${!showingSubGenre?`background:var(--blush);color:var(--oxblood-dark);`:`color:var(--muted);`}">Genre</button>
            <button type="button" class="btn-text" data-action="dash-genre-view" data-view="subgenre" style="padding:2px 8px;border-radius:6px;font-size:10.5px;${showingSubGenre?`background:var(--blush);color:var(--oxblood-dark);`:`color:var(--muted);`}">Sub-genre</button>
          </div>` : ""}
        </div>
        ${pie(genreViewEntries, genreViewColorFn)}
      </div>
      <div class="card pie-card">
        <div class="section-label">By format</div>
        ${pie(formatEntries, n=>formatColors[n]||COLORS.oxblood)}
      </div>
    </div>
    <div class="card">
      <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;">
        <div>
          <div class="section-label">${year} in books</div>
          <div class="bars">${bars}</div>
          <div class="legend">
            <div><span class="dot" style="background:${COLORS.oxblood}"></span>Finished</div>
          </div>
        </div>
        ${(()=>{
          const topReads = completed.filter(b=>b.rating>0)
            .sort((a,b)=> b.rating-a.rating || a.title.localeCompare(b.title))
            .slice(0,24);
          if(!topReads.length) return "";
          return `
        <div style="flex:1;min-width:260px;">
          <div class="section-label">Top reads of all time</div>
          <div id="top-reads-row" style="display:flex;flex-wrap:nowrap;gap:20px;padding:22px 4px 34px;">
            ${topReads.map((b,i)=>{
              const tilt = (hashStr(b.id)%15)-7;
              const isFive = Number(b.rating) >= 5;
              return `
            <div class="top-read-item" data-idx="${i}" style="position:relative;width:66px;flex-shrink:0;transform:rotate(${tilt}deg);${i>=6?"display:none;":""}" title="${esc(b.title)}">
              ${coverHTML(b, 96)}
              <div style="position:absolute;bottom:-18px;left:50%;z-index:5;transform:translate(-50%,0) rotate(${-tilt}deg);background:rgba(10,10,10,.88);border-radius:999px;padding:5px 11px;box-shadow:0 3px 10px rgba(0,0,0,.4);white-space:nowrap;">
                <span style="font-weight:800;font-size:14.5px;letter-spacing:.2px;${isFive?"":"color:#fff;"}" class="${isFive?"rating-shimmer":""}">${fmtRating(b.rating)}★</span>
              </div>
            </div>`;}).join("")}
          </div>
        </div>`;
        })()}
      </div>
    </div>
  `;
}

/* ---------------- tracker ---------------- */
function statusPillTone(status){ return status==="done" ? "oxblood" : status==="dnf" ? "dnf" : ""; }
function renderTrackerGroupTable(books, cols){
  const head = cols.map(([k,label])=>`<th data-action="sort" data-key="${k}">${esc(label)} ${ui.sortKey===k?"▾":""}</th>`).join("");
  const showPriority = cols.some(([k])=>k==="priority");
  const rows = books.map(b=>`
    <tr data-action="edit-book" data-id="${b.id}" class="${ui.selected.has(b.id)?"selected-row":""}">
      <td class="chk"><input type="checkbox" data-action="toggle-select" data-id="${b.id}" ${ui.selected.has(b.id)?"checked":""} /></td>
      <td style="font-weight:700;">${esc(b.title)}</td>
      <td>${esc(b.author)}</td>
      <td>${b.genre?pillHTML(b.genre):""}</td>
      <td style="color:var(--muted);">${esc(b.subGenre)}</td>
      <td>${esc(b.format)}</td>
      ${showPriority?`<td style="color:var(--muted);">${esc(b.priority)}</td>`:""}
      <td>${starsHTML(b.rating,false,null,12)}</td>
      <td>${esc(b.source)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          ${pillHTML(STATUS[b.status], statusPillTone(b.status))}
          ${b.status==='reading'?`<button class="btn btn-complete" data-action="mark-completed" data-id="${b.id}">Complete ✓</button>`:''}
        </div>
      </td>
    </tr>`).join("");
  return `<table class="tracker"><thead><tr><th class="chk"></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}
function renderTracker(){
  const cols = [["title","Title"],["author","Author"],["genre","Genre"],["subGenre","Sub-genre"],["format","Format"],["priority","Priority"],["rating","Rating"],["source","Source"],["status","Status"]];
  if(state.books.length===0){
    return emptyState("Nothing logged yet. Add the book you're reading right now, or one you finished recently.", "+ Add your first book", "add-book");
  }
  const sorted = [...state.books].sort((a,b)=>(a[ui.sortKey]||"").toString().localeCompare((b[ui.sortKey]||"").toString()));
  const selectedCount = ui.selected.size;
  const groups = TRACKER_GROUPS.map(([key,label])=>{
    const list = sorted.filter(b=>b.status===key);
    if(list.length===0) return "";
    const groupCols = (key==="done"||key==="dnf") ? cols.filter(([k])=>k!=="priority") : cols;
    return `
      <div class="tracker-group">
        <div class="tracker-group-head">
          <div class="section-label" style="margin-bottom:0;">${esc(label)}</div>
          <span class="pill">${list.length}</span>
        </div>
        <div class="card" style="overflow-x:auto;padding:0;">
          ${renderTrackerGroupTable(list, groupCols)}
        </div>
      </div>`;
  }).join("");
  
  const selectionControls = selectedCount > 0 
    ? `<button class="btn btn-subtle" data-action="bulk-edit">Bulk edit (${selectedCount})</button>
       <button class="btn-text" style="color:var(--oxblood);" data-action="clear-selection">Deselect all</button>`
    : `<button class="btn-text" style="color:var(--oxblood);" data-action="select-all-books">Select all</button>`;

  const toolbarRight = `
    ${selectionControls}
    <button class="btn btn-primary" data-action="add-book">+ Add book</button>
  `;
  return `
    <div class="tracker-toolbar">
      <div style="font-size:12.5px;color:var(--muted);">${state.books.length} book${state.books.length===1?"":"s"} logged${selectedCount>0?` · ${selectedCount} selected`:""}</div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">${toolbarRight}</div>
    </div>
    ${groups}
  `;
}

/* ---------------- gallery ---------------- */
function renderGallery(){
  const books = state.books;
  if(books.length===0) return emptyState("Once you log books, they'll show up here as a browsable cover gallery.");
  const genres = sortSuggestionsByInput([...new Set(books.map(b=>b.genre).filter(Boolean))], ui.galleryGenre);
  const q = ui.galleryQuery.toLowerCase();

    if(q && !`${b.title} ${b.author}`.toLowerCase().includes(q)) return false;

    if(ui.galleryRating){ const n = Number(ui.galleryRating); if(n>=5 ? b.rating!==5 : (b.rating < n || b.rating >= n+1)) return false; }

  });
  const cards = filtered.map(b=>`
    <div class="cover-card" data-action="open-book" data-id="${b.id}">
      ${coverHTML(b,176)}
      <div class="title">${esc(b.title)}</div>
      <div class="author">${esc(b.author)}</div>
      ${starsHTML(b.rating,false,null,11)}
    </div>`).join("");
  return `
    <div class="filters-row">
      <input class="input" id="gallery-q" placeholder="Search title or author…" value="${esc(ui.galleryQuery)}" />
      <select class="input" id="gallery-status">
        <option value="">All statuses</option>
        ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${ui.galleryStatus===k?"selected":""}>${v}</option>`).join("")}
      </select>

/* ---------------- goodreads import ---------------- */
let goodreadsParsed = null;
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}
function normalizeGoodreadsDate(s){
  if(!s) return "";
  const m = s.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return "";
  return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
}
function mapGoodreadsFormat(binding){
  const s = (binding||"").toLowerCase();
  if(s.includes("audio")) return "Audio";
  if(s.includes("kindle")||s.includes("ebook")||s.includes("digital")||s.includes("nook")) return "Digital";
  return "Physical";
}
function mapGoodreadsStatus(shelf){
  const s = (shelf||"").toLowerCase();
  if(s.includes("currently")) return "reading";
  if(s.includes("to-read")) return "want";
  return "done";
}
function rowsToBooks(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(h=>h.trim());
  const idx = name => header.indexOf(name);
  const iTitle=idx("Title"), iAuthor=idx("Author"), iRating=idx("My Rating"), iDateRead=idx("Date Read"),
        iShelf=idx("Exclusive Shelf"), iBinding=idx("Binding"), iPages=idx("Number of Pages"),
        iReview=idx("My Review"), iNotes=idx("Private Notes"), iShelves=idx("Bookshelves");
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.length<2) continue;
    const title = iTitle>=0 ? row[iTitle].trim() : "";
    if(!title) continue;
    const shelvesRaw = iShelves>=0 ? row[iShelves] : "";
    const genreGuess = shelvesRaw ? (shelvesRaw.split(",").map(s=>s.trim()).filter(Boolean)[0]||"") : "";
    const status = mapGoodreadsStatus(iShelf>=0?row[iShelf]:"");
    out.push({
      id: uid(), isExample:false, title,
      author: iAuthor>=0 ? row[iAuthor].trim() : "",
      genre: genreGuess, subGenre: "",
      format: mapGoodreadsFormat(iBinding>=0?row[iBinding]:""),
      source: "", status: status,
      priority: (status === "done" || status === "dnf") ? "" : "Interested",
      rating: Number(iRating>=0?row[iRating]:0)||0,
      dateFinished: normalizeGoodreadsDate(iDateRead>=0?row[iDateRead]:""),
      language: "English", pagesHours: iPages>=0 ? row[iPages].trim() : "",
      review: iReview>=0 ? row[iReview].trim() : "", notes: iNotes>=0 ? row[iNotes].trim() : "",
      recommendedBy: "", coverUrl: "",
    });
  }
  return out;
}
function handleGoodreadsFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{ goodreadsParsed = rowsToBooks(parseCSV(e.target.result)); }
    catch(err){ goodreadsParsed = []; }
    renderModal();
  };
  reader.readAsText(file);
}
function runGoodreadsImport(){
  if(!goodreadsParsed || goodreadsParsed.length===0) return;
  const skipDupes = document.getElementById("gr-skip-dupes") ? document.getElementById("gr-skip-dupes").checked : true;
  const existingKeys = new Set(state.books.map(b=>(b.title+"|"+b.author).toLowerCase()));
  goodreadsParsed.forEach(b=>{
    const key = (b.title+"|"+b.author).toLowerCase();
    if(skipDupes && existingKeys.has(key)) return;
    state.books.push(b);
    existingKeys.add(key);
  });
  persistBooks();
  goodreadsParsed = null;
  state.modal = null;
  state.tab = "tracker";
  localStorage.setItem('shelf:lastTab', state.tab);
  render();
}
function goodreadsImportHTML(){
  const preview = goodreadsParsed;
  return `
    <div style="font-size:13px;line-height:1.65;margin-bottom:16px;">

      <ol style="margin:0;padding-left:18px;">

/* ---------------- series ---------------- */
function allSeriesNames(){
  const names = new Set();
  state.books.forEach(b=>{ if(b.seriesName) names.add(b.seriesName); });
  state.wishlist.forEach(w=>{ if(w.seriesName) names.add(w.seriesName); });
  return Array.from(names);
}
function findSeriesEntries(seriesName){
  const target = (seriesName||"").trim().toLowerCase();
  if(!target) return [];
  const fromBooks = state.books.filter(b=>(b.seriesName||"").trim().toLowerCase()===target)
    .map(b=>({kind:"book", id:b.id, title:b.title, author:b.author, number:b.seriesNumber||"", status:b.status}));
  const fromWish = state.wishlist.filter(w=>(w.seriesName||"").trim().toLowerCase()===target)
    .map(w=>({kind:"wish", id:w.id, title:w.title, author:w.author, number:w.seriesNumber||""}));
  return [...fromBooks, ...fromWish].sort((a,b)=>{
    const na = parseFloat(a.number), nb = parseFloat(b.number);
    const va = isNaN(na) ? Infinity : na, vb = isNaN(nb) ? Infinity : nb;
    if(va!==vb) return va-vb;
    return (a.title||"").localeCompare(b.title||"");
  });
}
function seriesBoxHTML(seriesName, excludeId){
  const name = (seriesName||"").trim();
  if(!name) return "";
  const entries = findSeriesEntries(name);
  const rows = entries.map(e=>{
    const isCurrent = e.id===excludeId;
    const numLabel = e.number ? `#${esc(String(e.number))}` : "—";
    const badge = e.kind==="book"
      ? `<span class="pill ${statusPillTone(e.status)}">${esc(STATUS[e.status]||e.status)}</span>`
      : `<span class="pill">Wishlist</span>`;

/* ---------------- google books lookup ---------------- */
let gbResults = [];
let gbSearchSeq = 0;
function getGbApiKey(){
  return EMBEDDED_GB_API_KEY || '';
}
async function searchGoogleBooks(query){
  const box = document.getElementById("gb-results");
  if(!box) return;
  const q = (query||"").trim();
  if(!q){ box.innerHTML = `<div style="padding:8px 2px;font-size:12px;color:var(--muted);">Type a title or author to search.</div>`; return; }
  const seq = ++gbSearchSeq;
  box.innerHTML = `<div style="padding:8px 2px;font-size:12px;color:var(--muted);">Searching…</div>`;
  try{
    const key = getGbApiKey();
    const url = "https://www.googleapis.com/books/v1/volumes?maxResults=8&q=" + encodeURIComponent(q) + (key ? "&key="+encodeURIComponent(key) : "");
    const res = await fetch(url);
    if(seq !== gbSearchSeq) return; // a newer search superseded this one
    if(!res.ok){
      let reason;
      if(res.status===429) reason = "Google is rate-limiting search traffic right now — try again in a moment.";
      else if(res.status===403) reason = "Google rejected the request (403).";
      else reason = "Request failed (status " + res.status + ").";
      box.innerHTML = `<div style="padding:8px 2px;font-size:12px;color:#A2572B;">${esc(reason)}</div>`;
      return;
    }
    const data = await res.json();
    const items = (data.items||[]).filter(it=>it.volumeInfo && it.volumeInfo.title);
    gbResults = items;
    if(!items.length){
      box.innerHTML = `<div style="padding:8px 2px;font-size:12px;color:var(--muted);">No matches found. Try a different search, or fill the form in by hand.</div>`;
      return;
    }
    box.innerHTML = items.map((it,i)=>{
      const v = it.volumeInfo;
      const thumb = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
      const authors = (v.authors||[]).join(", ");
      const year = v.publishedDate ? v.publishedDate.slice(0,4) : "";
      return `
        <button type="button" class="gb-result" data-action="gb-pick" data-index="${i}">
          <div class="gb-result-cover">${thumb?`<img src="${esc(thumb.replace('http://','https://'))}" alt="" />`:"📖"}</div>
          <div class="gb-result-text">
            <div class="gb-result-title">${esc(v.title)}</div>
            <div class="gb-result-meta">${esc(authors)}${year?` · ${year}`:""}</div>
          </div>
        </button>`;
    }).join("");
  }catch(err){
    if(seq !== gbSearchSeq) return;
    box.innerHTML = `<div style="padding:8px 2px;font-size:12px;color:#A2572B;">Search failed. Check your internet connection and try again.</div>`;
  }
}
function applyGoogleBooksPick(idx){
  const it = gbResults[idx];
  if(!it) return;
  const v = it.volumeInfo || {};
  const titleEl = document.getElementById("f-title") || document.getElementById("wf-title");
  const authorEl = document.getElementById("f-author") || document.getElementById("wf-author");
  const pagesEl = document.getElementById("f-pages") || document.getElementById("wf-pages");
  const genreEl = document.getElementById("f-genre");
  const subGenreEl = document.getElementById("f-subgenre");
  const coverHidden = document.getElementById("f-cover");
  const coverUrlEl = document.getElementById("f-cover-url");
  const coverPreview = document.getElementById("cover-preview");

  if(titleEl) titleEl.value = v.title || titleEl.value;
  if(authorEl && v.authors && v.authors.length) authorEl.value = v.authors.join(", ");
  if(pagesEl && v.pageCount && !pagesEl.value.trim()) pagesEl.value = String(v.pageCount);
  if(v.categories && v.categories.length){
    const parts = v.categories[0].split("/").map(s=>s.trim()).filter(Boolean);
    if(genreEl && parts[0] && !genreEl.value.trim()) genreEl.value = parts[0];
    if(subGenreEl && parts[1] && !subGenreEl.value.trim()) subGenreEl.value = parts[1];
  }
  const rawThumb = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
  if(rawThumb){
    const hiRes = rawThumb.replace("http://","https://").replace("zoom=1","zoom=2");
    if(coverHidden) coverHidden.value = hiRes;
    if(coverUrlEl) coverUrlEl.value = hiRes;
    if(coverPreview){
      coverPreview.classList.remove("empty");
      coverPreview.innerHTML = `<img src="${esc(hiRes)}" alt="cover preview" onerror="this.parentElement.classList.add('empty'); this.remove();"/>`;
    }
  }
  refreshSeriesBox();
  const box = document.getElementById("gb-results");
  if(box) box.innerHTML = `<div style="padding:8px 2px;font-size:11.5px;color:var(--oxblood-dark);font-weight:600;">✓ Filled in from "${esc(v.title||"")}". Review the fields below and adjust anything you like.</div>`;

/* ---------------- nav favorites ---------------- */
// Favorited nav items (tabs or the external sub-apps) are stored by key in
// localStorage and float to the top of both the desktop sidebar and the
// mobile "More" panel, ahead of a dotted separator. Toggled via the small
// star button on each nav item: revealed on hover on desktop, and on a
// ~500ms long-press on touch devices (which have no hover state).
function getFavKeys(){
  try{ return JSON.parse(localStorage.getItem("shelf:favNav")||"[]"); } catch(e){ return []; }
}
function toggleFavNav(key){
  let favs = getFavKeys();
  favs = favs.includes(key) ? favs.filter(k=>k!==key) : [...favs, key];
  localStorage.setItem("shelf:favNav", JSON.stringify(favs));
  render();
}
function tabBtnHTML(t){
  return `<button class="nav-btn ${state.tab===t.key?"active":""}" data-action="set-tab" data-tab="${t.key}">${esc(t.label)}</button>`;
}
function linkBtnHTML(l){
  return `<a href="${esc(l.href)}" class="nav-btn" style="text-decoration:none;display:block;">${esc(l.label)}</a>`;
}
function navItemHTML(key, innerHtml){
  const isFav = getFavKeys().includes(key);
  return `<div class="nav-item">
    ${innerHtml}
    <button type="button" class="nav-fav-btn${isFav?" is-fav":""}" data-action="toggle-fav" data-id="${esc(key)}" title="${isFav?"Remove from favorites":"Add to favorites"}" aria-label="Favorite">${isFav?"★":"☆"}</button>
  </div>`;
}
// Renders a group of nav entries (tabs/links) as favorites-first, then the
// rest, with a dotted separator between the two groups when both are non-empty.
function navGroupHTML(tabs, links){
  const favKeys = getFavKeys();
  const allEntries = [...tabs.map(t=>({...t,type:"tab"})), ...links.map(l=>({...l,type:"link"}))];
  const favEntries = favKeys.map(k=>allEntries.find(e=>e.key===k)).filter(Boolean);
  const restTabs = tabs.filter(t=>!favKeys.includes(t.key));
  const restLinks = links.filter(l=>!favKeys.includes(l.key));
  const entryHTML = (e)=> navItemHTML(e.key, e.type==="tab" ? tabBtnHTML(e) : linkBtnHTML(e));
  return `
    ${favEntries.map(entryHTML).join("")}
    ${favEntries.length ? '<hr class="nav-separator" />' : ""}
    ${restTabs.map(entryHTML).join("")}
    ${(restTabs.length && restLinks.length) ? '<hr class="nav-separator" />' : ""}
    ${restLinks.map(entryHTML).join("")}
  `;
}

  const statusVal = document.getElementById("f-status").value;
  let priorityVal = document.getElementById("f-priority").value;
  if(statusVal === "done" || statusVal === "dnf"){
    priorityVal = "";
  }
  const b = {
    id, isExample:false,
    title: document.getElementById("f-title").value.trim(),
    author: document.getElementById("f-author").value.trim(),
    genre: document.getElementById("f-genre").value.trim(),
    subGenre: document.getElementById("f-subgenre").value.trim(),
    format: document.getElementById("f-format").value,
    source: document.getElementById("f-source").value,
    status: statusVal,
    priority: priorityVal,
    rating: Number(document.getElementById("f-rating").value)||0,
    dateFinished: document.getElementById("f-finished").value,
    pagesHours: document.getElementById("f-pages").value.trim(),
    language: document.getElementById("f-language").value,
    review: document.getElementById("f-review").value.trim(),
    notes: document.getElementById("f-notes").value.trim(),
    recommendedBy: document.getElementById("f-recby").value.trim(),
    coverUrl: document.getElementById("f-cover").value.trim(),
    seriesName: (document.getElementById("f-series-name")?.value || "").trim(),
    seriesNumber: (document.getElementById("f-series-number")?.value || "").trim(),
    rereads: formRereads.filter(r=>r.endDate).map(r=>({id:r.id, endDate:r.endDate})),
    progressPercent: existing ? (existing.progressPercent || 0) : 0,
    progressMode: existing ? (existing.progressMode || "percent") : "percent",
    progressPage: existing ? (existing.progressPage || "") : "",
  };
  if(!b.title) return;
  if(existing) state.books = state.books.map(x=>x.id===id?b:x);
  else state.books.push(b);
  persistBooks();
  state.modal = null;
  render();
}
function saveProgressFromForm(){
  const id = document.getElementById("pf-id").value;
  const mode = document.getElementById("pf-mode").value;
  const book = findBook(id);
  if(!book) return;
  let percent, progressPage = book.progressPage || "";
  if(mode === "percent"){
    const val = document.getElementById("pf-percent");
    percent = Math.max(0, Math.min(100, Number(val ? val.value : 0) || 0));
  } else {
    const totalPages = Number(book.pagesHours) || 0;
    if(totalPages <= 0) return;
    const val = document.getElementById("pf-page");
    const curPage = Math.max(0, Math.min(totalPages, Number(val ? val.value : 0) || 0));
    progressPage = curPage;
    percent = Math.round((curPage/totalPages)*100);
  }
  const ratingEl = document.getElementById("pf-rating");
  const rating = ratingEl ? Math.max(0, Math.min(5, Number(ratingEl.value)||0)) : (book.rating||0);
  state.books = state.books.map(b => b.id===id ? { ...b, progressPercent: percent, progressMode: mode, progressPage: progressPage, rating: rating } : b);
  persistBooks();
  state.modal = null;
  render();
}

/* ---------------- nav favorite star: long-press reveal (touch) ---------------- */
// Desktop reveals the star on :hover (pure CSS). Touch devices have no hover,
// so a ~500ms press-and-hold on a nav item reveals its star instead; lifting
// the finger after a completed long-press suppresses the click that would
// otherwise navigate/switch tabs, so the user can then tap the star.
(function(){
  let holdTimer = null;
  let holdFired = false;
  document.addEventListener("touchstart", (e)=>{
    const item = e.target.closest(".nav-item");
    holdFired = false;
    if(!item) return;
    holdTimer = setTimeout(()=>{
      item.classList.add("show-fav");
      holdFired = true;
      if(navigator.vibrate) navigator.vibrate(15);
    }, 500);
  }, {passive:true});
  document.addEventListener("touchend", (e)=>{
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(holdFired){ e.preventDefault(); holdFired = false; }
  }, {passive:false});
  document.addEventListener("touchmove", ()=>{
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  }, {passive:true});
  // Tapping/clicking elsewhere hides any revealed stars again.
  document.addEventListener("click", (e)=>{
    if(e.target.closest(".nav-item")) return;
    document.querySelectorAll(".nav-item.show-fav").forEach(el=>el.classList.remove("show-fav"));
  });
})();

/* ---------------- pie chart hover / tap highlight ---------------- */
const PIE_HOVER_CAPABLE = !!(window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches);
function setPieActive(wrap, idx){
  if(!wrap) return;
  wrap.classList.toggle("has-active", idx !== null);
  wrap.querySelectorAll(".pie-slice").forEach(s=>{ s.classList.toggle("active", s.getAttribute("data-idx")===idx); });
  wrap.querySelectorAll(".pie-legend .row").forEach(r=>{ r.classList.toggle("active", r.getAttribute("data-idx")===idx); });
}
if(PIE_HOVER_CAPABLE){
  document.addEventListener("mouseover", (e)=>{
    const target = e.target.closest(".pie-slice, .pie-legend .row");
    if(!target) return;
    setPieActive(target.closest(".pie-wrap"), target.getAttribute("data-idx"));
  });
  document.addEventListener("mouseout", (e)=>{
    const target = e.target.closest(".pie-slice, .pie-legend .row");
    if(!target) return;
    const wrap = target.closest(".pie-wrap");
    const related = e.relatedTarget;
    if(related && wrap && wrap.contains(related) && related.closest(".pie-slice, .pie-legend .row")) return;
    setPieActive(wrap, null);
  });
} else {
  document.addEventListener("click", (e)=>{
    const target = e.target.closest(".pie-slice, .pie-legend .row");
    if(!target){
      const insideWrap = e.target.closest(".pie-wrap");
      if(!insideWrap) document.querySelectorAll(".pie-wrap.has-active").forEach(w=>setPieActive(w,null));
      return;
    }
    const wrap = target.closest(".pie-wrap");
    const idx = target.getAttribute("data-idx");
    const isActive = target.classList.contains("active");
    setPieActive(wrap, isActive ? null : idx);
  });
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", (e)=>{
  const overlay = e.target.closest("[data-action='overlay-close']");
  if(overlay && !e.target.closest("[data-stop]")){ state.modal=null; goodreadsParsed=null; render(); return; }

  const star = e.target.closest("[data-star]");
  if(star){
    const wrap = star.closest(".stars");
    if(!wrap.classList.contains("editable")) return;
    const target = wrap.getAttribute("data-star-target");
    const hidden = document.getElementById(target);
    const n = Number(star.getAttribute("data-star"));
    const rect = star.getBoundingClientRect();
    const clickFrac = rect.width>0 ? Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width)) : 1;
    const quarter = Math.min(4, Math.max(1, Math.ceil(clickFrac*4))) / 4;
    const current = Number(hidden.value)||0;
    let val = (n-1) + quarter;
    val = Math.round(val*4)/4;
    val = (val===current) ? 0 : val;
    hidden.value = val;
    applyStarFills(wrap, val);
    const numInput = document.getElementById(target+"-num");
    if(numInput) numInput.value = val || "";
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  if(action==="set-tab"){ state.tab = el.getAttribute("data-tab"); localStorage.setItem('shelf:lastTab', state.tab); ui.mobileMoreOpen = false; render(); }
  else if(action==="toggle-fav"){ toggleFavNav(id); }
  else if(action==="toggle-mobile-more"){ ui.mobileMoreOpen = !ui.mobileMoreOpen; render(); }
  else if(action==="close-mobile-more"){ ui.mobileMoreOpen = false; render(); }
  else if(action==="add-book"){ state.modal = {type:"book-form", payload:null}; renderModal(); }
  else if(action==="mark-completed"){ state.modal = {type:"complete-book", payload: findBook(id)}; renderModal(); }
  else if(action==="edit-progress"){ state.modal = {type:"progress-form", payload: findBook(id)}; renderModal(); }
  else if(action==="progress-mode"){
    if(state.modal && state.modal.type==="progress-form"){
      const newMode = el.getAttribute("data-mode");
      state.modal = {type:"progress-form", payload:{...state.modal.payload, progressMode:newMode}};
      renderModal();
    }
  }
  else if(action==="save-progress"){ saveProgressFromForm(); }
  else if(action==="edit-book"){ state.modal = {type:"book-form", payload: findBook(id)}; renderModal(); }
  else if(action==="open-book"){ state.modal = {type:"book-detail", payload: findBook(id)}; renderModal(); }
  else if(action==="edit-from-detail"){ state.modal = {type:"book-form", payload: findBook(id)}; renderModal(); }
  else if(action==="delete-book"){ deleteBook(id); }
  else if(action==="save-book"){ saveBookFromForm(); }
  else if(action==="save-complete-book"){ saveCompleteBookFromModal(); }
  else if(action==="mark-dnf"){ markDNFFromModal(id); }
  else if(action==="close-modal"){ state.modal = null; goodreadsParsed = null; renderModal(); }
  else if(action==="sort"){ ui.sortKey = el.getAttribute("data-key"); render(); }
  else if(action==="dash-genre-view"){ ui.dashGenreView = el.getAttribute("data-view"); render(); }
  else if(action==="dash-genre-view"){ ui.dashGenreView = el.getAttribute("data-view"); render(); }
  else if(action==="clear-examples"){ clearExamples(); }
  else if(action==="cal-prev"){ ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth()-1, 1); ui.calPicked=null; render(); }
  else if(action==="cal-next"){ ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth()+1, 1); ui.calPicked=null; render(); }
  else if(action==="cal-day"){ ui.calPicked = el.getAttribute("data-day"); render(); }
  else if(action==="add-wish"){ state.modal = {type:"wish-form", payload:null}; renderModal(); }
  else if(action==="edit-wish"){ state.modal = {type:"wish-form", payload: state.wishlist.find(w=>w.id===id)}; renderModal(); }
  else if(action==="save-wish"){ saveWishFromForm(); }
  else if(action==="delete-wish"){ deleteWish(id); }
  else if(action==="move-wish"){ state.modal = {type:"move-wish-form", payload: state.wishlist.find(w=>w.id===id)}; renderModal(); }
  else if(action==="confirm-move-wish"){ completeMoveWish(); }
  else if(action==="open-goal-form"){
    const year = new Date().getFullYear().toString();
    state.modal = {type:"goal-form", payload: { year, goal: state.goals[year] || "" }};
    renderModal();
  }
  else if(action==="save-goal"){ saveGoalFromForm(); }
  else if(action==="clear-cover"){
    document.getElementById("f-cover").value = "";
    const urlInput = document.getElementById("f-cover-url"); if(urlInput) urlInput.value = "";
    const prev = document.getElementById("cover-preview");
    if(prev){ prev.classList.add("empty"); prev.innerHTML = "📖"; }
  }
  else if(action==="gb-search"){
    const q = (document.getElementById("gb-search-q")?.value || "").trim();
    searchGoogleBooks(q);
  }
  else if(action==="gb-pick"){
    const idx = Number(el.getAttribute("data-index"));
    applyGoogleBooksPick(idx);
  }
  else if(action==="goodreads-search"){
    const t = (document.getElementById("f-title")?.value || "").trim();
    const a = (document.getElementById("f-author")?.value || "").trim();
    const q = [t,a].filter(Boolean).join(" ");
    if(q){ window.open("https://www.goodreads.com/search?q=" + encodeURIComponent(q), "_blank", "noopener"); }
  }
  else if(action==="quick-goodreads-search"){
    const q = (document.getElementById("quick-goodreads-q")?.value || "").trim();
    if(q){ window.open("https://www.goodreads.com/search?q=" + encodeURIComponent(q), "_blank", "noopener"); }
  }
  else if(action==="add-reread"){
    formRereads.push({id:uid(), endDate:new Date().toISOString().slice(0,10)});
    const box = document.getElementById("rereads-box");
    if(box) box.innerHTML = rereadsBoxHTML();
  }
  else if(action==="remove-reread"){
    formRereads = formRereads.filter(r=>r.id!==id);
    const box = document.getElementById("rereads-box");
    if(box) box.innerHTML = rereadsBoxHTML();
  }
  else if(action==="add-series-entry"){
    const seriesName = (document.getElementById("f-series-name")?.value || "").trim();
    const title = (document.getElementById("series-new-title")?.value || "").trim();
    if(!seriesName || !title) return;
    const author = (document.getElementById("series-new-author")?.value || "").trim();
    const number = (document.getElementById("series-new-number")?.value || "").trim();
    state.wishlist.push({
      id:uid(), isExample:false, title, author, priority:"Interested", coverUrl:"",
      pagesHours:"", genre:"", subGenre:"", seriesName, seriesNumber:number
    });
    persistWishlist();
    refreshSeriesBox();
    ["series-new-title","series-new-author","series-new-number"].forEach(fid=>{ const el=document.getElementById(fid); if(el) el.value=""; });
  }
  else if(action==="series-add-to-library"){
    const w = state.wishlist.find(x=>x.id===id);
    if(w){ state.modal = {type:"move-wish-form", payload:w}; renderModal(); }
  }
  else if(action==="import-goodreads"){ state.modal = {type:"goodreads-import", payload:null}; renderModal(); }
  else if(action==="do-goodreads-import"){ runGoodreadsImport(); }
  else if(action==="toggle-select"){ toggleSelect(id); render(); }
  else if(action==="select-all-books"){ selectAllBooks(); render(); }
  else if(action==="clear-selection"){ clearSelection(); render(); }
  else if(action==="delete-selected-books"){ deleteSelectedBooks(); }
  else if(action==="bulk-edit"){ state.modal = {type:"bulk-edit-form", payload:null}; renderModal(); }
  else if(action==="save-bulk-edit"){ saveBulkEditFromForm(); }
  else if(action==="open-export"){ state.modal = {type:"backup-export", payload:null}; renderModal(); }
  else if(action==="open-import"){ state.modal = {type:"backup-import", payload:null}; renderModal(); }
  else if(action==="do-export-json"){
    el.disabled = true;
    el.textContent = "Exporting…";
    exportBackupJSON().catch(err=>{
      console.error("Export failed:", err);
      alert("Export failed: " + err.message);
      el.disabled = false;
      el.textContent = "Download Full Backup";
    });
  }
  else if(action==="do-import-json"){
    const fileInput = document.getElementById("import-json-file");
    if(fileInput && fileInput.files[0]){
      if(!confirm("This will overwrite current data with what's in the backup file. Continue?")) return;
      el.disabled = true;
      el.textContent = "Restoring…";
      Promise.resolve(importBackupJSON(fileInput.files[0])).catch(err=>{
        console.error("Restore failed:", err);
        alert("Restore failed: " + err.message);
      }).finally(()=>{
        el.disabled = false;
        el.textContent = "Restore Data";
      });
    }
  }
  else if(action==="open-switch-user"){ ui.mobileMoreOpen = false; state.modal = {type:"switch-user", payload:null}; renderModal(); }
  else if(action==="select-user"){ switchUser(el.getAttribute("data-user-id")); }
});

document.addEventListener("change", (e)=>{
  if(e.target.id==="f-cover-file"){
    const file = e.target.files[0];
    if(!file) return;
    resizeImageFile(file, 400, (dataUrl)=>{
      if(!dataUrl) return;
      const hidden = document.getElementById("f-cover");
      const urlInput = document.getElementById("f-cover-url");
      const prev = document.getElementById("cover-preview");
      if(hidden) hidden.value = dataUrl;
      if(urlInput) urlInput.value = "";
      if(prev){ prev.classList.remove("empty"); prev.innerHTML = `<img src="${dataUrl}" alt="cover preview"/>`; }
    });
  }
  else if(e.target.id==="f-status"){
    const val = e.target.value;
    const priEl = document.getElementById("f-priority");
    const priWrap = document.getElementById("priority-field-wrap");
    const hide = (val === "done" || val === "dnf");
    if(priEl && hide){
      priEl.value = "";
    }
    if(priWrap) priWrap.style.display = hide ? "none" : "";
  }
  else if(e.target.id==="goodreads-file"){ handleGoodreadsFile(e.target.files[0]); }
  else if(e.target.id==="gallery-status"){ ui.galleryStatus = e.target.value; render(); }
  else if(e.target.id==="gallery-genre"){ ui.galleryGenre = e.target.value; render(); }
  else if(e.target.id==="gallery-rating"){ ui.galleryRating = e.target.value; render(); }
  else if(e.target.id==="shelf-genre"){ ui.shelfGenre = e.target.value; render(); }
});
document.addEventListener("keydown", (e)=>{
  if(e.key==="Enter" && e.target && e.target.id==="quick-goodreads-q"){
    e.preventDefault();
    const q = e.target.value.trim();
    if(q) window.open("https://www.goodreads.com/search?q=" + encodeURIComponent(q), "_blank", "noopener");
  }
  else if(e.key==="Enter" && e.target && e.target.id==="gb-search-q"){
    e.preventDefault();
