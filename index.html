<script>
  // Resume where I left off: if the last page visited wasn't the dashboard,
  // jump straight there before anything renders.
  // Exception: if we got here via an explicit "back to shelf" link (?home=1),
  // the user is deliberately choosing the dashboard, so skip the auto-resume.
  (function(){
    if (new URLSearchParams(location.search).has('home')) return;
    var last = localStorage.getItem('shelf:lastPage');
    if (last && last !== 'index.html') {
      location.replace(last);
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#26301F; --oxblood:#3F6B41; --oxblood-dark:#20331F; --oxblood-mid:#2C4A2A;
    --blush:#E6ECD9; --rose:#C08A4E; --cream:#F8F3E6; --gold:#C29A2E; --sage:#7C9473; --line:#DEE3D0; --muted:#748067;
    --wood:#6B4A32; --wood-dark:#3D2A1B; --shadow-tint:47,63,42;
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    margin:0;font-family:'Inter',sans-serif;color:var(--ink);
    overflow-wrap:anywhere;
    background-color:var(--cream);
    background-image:
      linear-gradient(rgba(248,243,230,.88), rgba(248,243,230,.88)),
      url("https://i.imgur.com/u5igRkn.jpeg");
    background-attachment:fixed;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7D2B8;border-radius:4px;}
  h1,h2,h3{margin:0;}
  .display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.2px;color:var(--oxblood-dark);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:210px;flex-shrink:0;background:var(--oxblood-dark);color:#fff;display:flex;flex-direction:column;padding:22px 14px;gap:4px;}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:23px;padding:2px 8px 14px;margin-bottom:12px;line-height:1.2;border-bottom:1px solid rgba(255,255,255,.16);}
  .nav-btn{text-align:left;border:none;background:transparent;color:#fff;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .nav-btn.active{background:rgba(255,255,255,.14);}
  .mobile-nav{display:none;}
  .main{flex:1;padding:28px 32px;min-width:0;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:2px solid var(--blush);position:relative;}
  .page-head::after{content:'';position:absolute;left:0;bottom:-2px;width:56px;height:2px;background:var(--gold);}
  .page-subtitle{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.2px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--oxblood);color:#fff;}
  .btn-ghost{background:transparent;color:var(--oxblood);border:1.5px solid var(--oxblood);}
  .btn-subtle{background:var(--blush);color:var(--oxblood-dark);}
  .btn-danger{background:transparent;color:#A2572B;text-decoration:underline;padding:0;font-size:12.5px;}
  .btn-text{border:none;background:none;font-weight:700;font-size:11.5px;cursor:pointer;padding:0;font-family:inherit;}
  .pill{background:var(--blush);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;display:inline-block;}
  .pill.oxblood{background:var(--oxblood);color:#fff;}
  .pill.dnf{background:#8A7C5E;color:#fff;}
  .tracker-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .tracker-group{margin-bottom:20px;}
  .tracker-group-head{display:flex;align-items:baseline;gap:8px;padding:12px 16px 10px;}
  table.tracker td.chk, table.tracker th.chk{width:34px;padding-left:14px;}
  table.tracker tr.selected-row{outline:2px solid var(--gold);outline-offset:-2px;}
  .fact-list{display:flex;flex-direction:column;gap:10px;}
  .fact-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;}
  .fact-row .fact-icon{font-size:15px;flex-shrink:0;}
  .card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(47,63,42,.10);}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--oxblood-dark);margin-bottom:12px;}
  .input, select.input, textarea.input{border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;background:#fff;width:100%;}
  textarea.input{min-height:60px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stars{display:inline-flex;line-height:1;}
  .stars .star-slot{position:relative;display:inline-block;width:1em;height:1em;}
  .stars .star-slot .star-base,.stars .star-slot .star-fill{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;}
  .stars .star-slot .star-base{color:#DDD1CC;}
  .stars .star-slot .star-fill{color:var(--gold);overflow:hidden;width:0%;}
  .stars.editable .star-slot{cursor:pointer;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .icon{font-size:34px;margin-bottom:10px;}
  .empty-state p{font-size:13.5px;max-width:380px;margin:0 auto 16px;line-height:1.5;}
  table.tracker{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.tracker thead tr{background:var(--oxblood-dark);color:#fff;}
  table.tracker th{padding:10px 12px;text-align:left;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.3px;}
  table.tracker td{padding:9px 12px;}
  table.tracker tbody tr{cursor:pointer;}
  table.tracker tbody tr:nth-child(odd){background:#F1EEDE;}
  table.tracker tbody tr:nth-child(even){background:#fffdf7;}
  .stat-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(47,63,42,.10);min-width:120px;}
  .stat-card .num{font-family:'Anton',sans-serif;font-size:30px;color:var(--oxblood);}
  .stat-card .label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;margin-top:2px;}
  .section-label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:10px;text-transform:uppercase;}
  .cover{border-radius:8px;display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 6px 16px rgba(0,0,0,.16);position:relative;overflow:hidden;}
  .cover span{color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:15px;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.3);letter-spacing:.2px;position:relative;z-index:1;}

  .cover.has-img img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}

  .cover-preview{width:60px;height:88px;border-radius:5px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover-preview.empty{display:flex;align-items:center;justify-content:center;background:var(--blush);font-size:18px;}
  .cover-card{cursor:pointer;width:128px;}
  .cover-card .cover{height:176px;margin-bottom:8px;}
  .cover-card .title{font-size:12.5px;font-weight:700;line-height:1.25;}
  .cover-card .author{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .spine{width:46px;border-radius:3px 3px 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding:10px 4px;cursor:pointer;box-shadow:inset -3px 0 6px rgba(0,0,0,.35),2px 3px 6px rgba(0,0,0,.25);flex-shrink:0;position:relative;overflow:hidden;}
  .spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.2px;text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,.9);max-height:100%;overflow:hidden;position:relative;z-index:2;}
  .spine-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.8) contrast(1.1);z-index:0;}
  .spine-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.3) 80%, rgba(0,0,0,0.6) 100%), linear-gradient(90deg, rgba(255,255,255,0.25) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.4) 100%);z-index:1;pointer-events:none;}
  .shelf-box{background:linear-gradient(180deg,var(--wood),var(--wood-dark));border-radius:10px;padding:18px 16px 0;}
  .shelf-row{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:12px;}
  .shelf-floor{height:10px;background:#2A1B10;border-radius:0 0 6px 6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(31,42,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-card{background:var(--cream);border-radius:16px;width:480px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-card.wide{width:720px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--cream);z-index:10;}

  .filters-row .input{width:auto;flex:0 0 auto;font-size:12.5px;padding:7px 10px;}
  .filters-row input.input{flex:1;min-width:180px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
  .cal-cell{background:#fff;border-radius:8px;min-height:78px;padding:6px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;}
  .cal-cell.has-events{cursor:pointer;}
  .cal-cell.picked{border:2px solid var(--oxblood);}
  .cal-daynum{font-size:11px;color:var(--muted);font-weight:700;}
  .cal-dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;align-items:center;}
  .cal-covers{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
  .cal-cover-thumb{width:22px;height:32px;border-radius:3px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted);align-items:center;}
  .legend .dot{margin-right:5px;}
  .pie-card{display:flex;flex-direction:column;height:100%;}
  .pie-wrap{display:flex;align-items:center;justify-content:center;gap:28px;flex:1;flex-wrap:wrap;}
  .pie{width:min(46%,320px);aspect-ratio:1/1;border-radius:50%;position:relative;flex-shrink:0;}
  .pie::after{content:'';position:absolute;inset:21.7%;background:#fff;border-radius:50%;}
  .pie-legend{font-size:12.5px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 18px;flex:1;min-width:130px;max-width:420px;}

  .pie-legend .sw{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .bars{display:flex;gap:4px;align-items:flex-end;height:180px;overflow-x:auto;padding-top:10px;}
  .bar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px;}
  .bar-pair{display:flex;gap:2px;align-items:flex-end;height:150px;}
  .bar{width:12px;border-radius:3px 3px 0 0;}
  .bar-month{font-size:9.5px;color:var(--muted);margin-top:4px;}
  .wish-card{width:210px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(47,63,42,.10);}
  .wish-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .wish-title{font-weight:700;font-size:13.5px;}
  .wish-author{font-size:11.5px;color:var(--muted);}
  .wish-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .wish-price{font-weight:700;color:var(--oxblood);font-size:13px;}
  .wish-actions{display:flex;gap:8px;margin-top:10px;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:16px;}
  
  .btn-complete {
    background: #2E7D32;
    color: #fff;
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 4px;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-complete:hover {
    background: #1B5E20;
  }

  @media (max-width:780px){
    .shell{flex-direction:column;}
    .sidebar{display:none;}
    .mobile-nav{display:flex;position:sticky;top:0;z-index:20;background:var(--oxblood-dark);align-items:stretch;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    .mobile-nav-btn{flex:1;border:none;background:transparent;color:rgba(255,255,255,.75);padding:10px 2px 8px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;border-bottom:2.5px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mobile-nav-btn.active{color:#fff;border-bottom-color:var(--gold);}
    .mobile-more-panel{position:absolute;top:100%;right:8px;background:var(--oxblood-dark);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px;min-width:170px;z-index:21;}
    .mobile-more-panel .nav-btn{width:100%;color:#fff;}
    .mobile-more-panel .nav-btn.active{background:rgba(255,255,255,.14);}
    .mobile-more-backdrop{position:fixed;inset:0;z-index:19;}
    .grid2{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:1fr !important;}
    .book-detail-grid{grid-template-columns:120px 1fr !important;gap:14px !important;}
    .pie{width:96px;height:96px;aspect-ratio:unset;}
    .pie::after{inset:26px;}
    .main{padding:16px;max-width:100vw;}
    .page-head{align-items:flex-start;}
    #page-title{font-size:24px !important;}
    .page-head, #page-actions{width:100%;}
    #page-actions{justify-content:flex-start;}
    .modal-card{width:100%;}
    .modal-card.wide{width:100%;}
    .modal-body{padding:16px;}
    table.tracker{font-size:11.5px;}
    table.tracker th,table.tracker td{padding:8px 6px;}
    table.tracker th:nth-child(2),table.tracker td:nth-child(2){min-width:160px;padding-right:10px;}
    table.tracker td:nth-child(2){font-size:12.5px;line-height:1.35;}
    .stat-card{min-width:100px;flex:1 1 calc(50% - 7px);}
  }

  /* Phone-only gallery scaling: fill the screen width, keep every detail (cover, title, author, stars) visible */
  @media (max-width:600px){
    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:14px 12px;
      width:100%;
    }
    .gallery-grid .cover-card{
      width:100% !important;
      display:flex;
      flex-direction:column;
    }
    .gallery-grid .cover-card .cover{
      width:100%;
      height:auto !important;
      aspect-ratio:2/3;
      margin-bottom:8px;
    }
    .gallery-grid .cover-card .cover span{
      font-size:16px;
    }
    .gallery-grid .cover-card .title{
      font-size:14.5px !important;
      line-height:1.3 !important;
    }
    .gallery-grid .cover-card .author{
      font-size:12.5px !important;
      margin-bottom:5px !important;
    }
    .gallery-grid .cover-card .stars{
      font-size:14px !important;
    }
    .filters-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .filters-row #gallery-q{
      grid-column:1 / -1;
    }
  }
</style>

<script>
/* ---------------- tokens & constants ---------------- */
const COLORS = { oxblood:'#3F6B41', rose:'#C08A4E', sage:'#7C9473', gold:'#C29A2E' };
const SPINE_COLORS = ["#4A7A4C","#C08A4E","#7FB59A","#C29A2E","#8A9C5E","#B5794A","#5E8F87","#A0703F","#6E8A4E","#9C8248"];
const STATUS = { reading:"Currently reading", done:"Completed", dnf:"Did not finish" };
const TRACKER_GROUPS = [["reading","Currently Reading"],["done","Completed"],["dnf","Did Not Finish"]];
const FORMATS = ["Physical","Digital","Audio"];
const SOURCES = ["Purchased","Borrowed","Gift","Free"];
const PRIORITIES = ["Must-read","Interested","Maybe"];
const LANGUAGES = ["English","Hebrew"];
const DEFAULT_GENRES = ["Fiction","Non-fiction","Romance","Fantasy","Sci-fi","Mystery","Historical","Young Adult","Memoir","Poetry"];
const TABS = [
  {key:"dashboard",label:"Dashboard"},
  {key:"tracker",label:"Book Tracker"},
  {key:"gallery",label:"Gallery"},
  {key:"shelf",label:"Shelf"},
  {key:"calendar",label:"Calendar"},
  {key:"wishlist",label:"Wishlist"},
];
const MOBILE_PRIMARY_KEYS = ["dashboard","tracker","gallery","shelf"];
const MOBILE_MORE_KEYS = ["calendar","wishlist"];
const TAB_SUBTITLES = {
  dashboard:"An overview of your reading life",
  tracker:"Every book, logged and organized",
  gallery:"Browse your collection by cover",
  shelf:"Your bookshelf, arranged by genre",
  calendar:"See when you finished",
  wishlist:"Books you can't wait to read",
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function genreColor(g){ if(!g) return SPINE_COLORS[0]; return SPINE_COLORS[hashStr(g)%SPINE_COLORS.length]; }
function spineHeight(title){ return 190 + (hashStr(title||"x")%40); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function yearOf(d){ return d ? d.slice(0,4) : null; }

/* Helper to sort suggestions by the index of the typed letter */
function sortSuggestionsByInput(list, typedValue) {
  const query = (typedValue || "").trim().toLowerCase();
  if (!query) return [...list].sort((a, b) => a.localeCompare(b));
  
  return [...list].sort((a, b) => {
    const aLower = a.toLowerCase();
    const bLower = b.toLowerCase();
    const aIdx = aLower.indexOf(query);
    const bIdx = bLower.indexOf(query);

    // If both contain the query string, sort by the earliest occurrence index of that string
    if (aIdx !== -1 && bIdx !== -1) {
      if (aIdx !== bIdx) return aIdx - bIdx;
    } else if (aIdx !== -1) {
      return -1;
    } else if (bIdx !== -1) {
      return 1;
    }

    // Fallback: check matching order of the individual letters typed
    let aMatchIndex = 0;
    let bMatchIndex = 0;
    for (let char of query) {
      aMatchIndex = aLower.indexOf(char, aMatchIndex);
      bMatchIndex = bLower.indexOf(char, bMatchIndex);
      if (aMatchIndex === -1) aMatchIndex = Infinity;
      if (bMatchIndex === -1) bMatchIndex = Infinity;
    }

    if (aMatchIndex !== bMatchIndex) {
      return aMatchIndex - bMatchIndex;
    }

    return a.localeCompare(b);
  });
}

/* ---------------- persistence (Firebase Firestore) ---------------- */
let firestoreReady = false;

async function loadData(){
  SHARED_DOC.onSnapshot((snap) => {
    if (!snap.exists) {
      if (!firestoreReady) {
        SHARED_DOC.set({ books: SEED_BOOKS, wishlist: SEED_WISHLIST })
          .catch(err => console.error("Failed to seed Firestore:", err));
      }
      return;
    }
    const data = snap.data();
    state.books = Array.isArray(data.books) ? data.books : [];
    state.wishlist = Array.isArray(data.wishlist) ? data.wishlist : [];
    state.goals = (data.goals && typeof data.goals === "object") ? data.goals : {};
    state.loaded = true;
    firestoreReady = true;
    render();
  }, (err) => {
    console.error("Firestore sync error:", err);
    alert("Couldn't connect to the shared library. Check your internet connection.");
  });
}

/* ---------------- JSON Backup & Restore ---------------- */
function exportBackupJSON(){
  const backupData = {
    version: 1,
    exportedAt: new Date().toISOString(),
    books: state.books,
    wishlist: state.wishlist
  };
  const filename = `shelf-spine-backup-${new Date().toISOString().slice(0,10)}.json`;
  const jsonStr = JSON.stringify(backupData, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json" });

  // iOS Safari (and in-app browsers) largely ignore the `download` attribute
  // and silently drop data: URIs, so a synthetic <a download> click is a
  // no-op there even though it works fine on desktop. Detect iOS and fall
  // back to opening the JSON in a new tab so the user can save it via the
  // share sheet.
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (!isIOS) {
    const url = URL.createObjectURL(blob);
    const dlAnchor = document.createElement('a');
    dlAnchor.href = url;
    dlAnchor.download = filename;
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } else {
    // iOS fallback: open in a new tab. The user can then use the Share
    // button in Safari to save/send the file.
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (!win) {
      // Popup blocked — fall back to navigating the current tab.
      window.location.href = url;
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  state.modal = null;
  renderModal();
}

function importBackupJSON(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(parsed && (Array.isArray(parsed.books) || Array.isArray(parsed.wishlist))){
        if(Array.isArray(parsed.books)) state.books = parsed.books;
        if(Array.isArray(parsed.wishlist)) state.wishlist = parsed.wishlist;
        persistBooks();
        persistWishlist();
        state.modal = null;
        render();
        alert("Backup restored successfully!");
      } else {
        alert("Invalid backup file format.");
      }
    } catch(err) {
      alert("Error parsing backup file.");
    }
  };
  reader.readAsText(file);
}

function starsHTML(value, editable, target, size){

}

function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = ()=>cb(null);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- fun facts ---------------- */
function computeFunFacts(books){
  const facts = [];
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const completed = books.filter(b=>b.status==="done" && b.dateFinished);
  const now = new Date();
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()-30);

  const recent = completed.filter(b=>{ const d=new Date(b.dateFinished+"T00:00:00"); return !isNaN(d) && d>=cutoff && d<=now; });
  if(recent.length){
    const gmap={}; recent.forEach(b=>{ if(b.genre) gmap[b.genre]=(gmap[b.genre]||0)+1; });
    const top = Object.entries(gmap).sort((a,b)=>b[1]-a[1])[0];
    if(top) facts.push({icon:"📚", text:`In the past month you've read mostly <strong>${esc(top[0])}</strong> (${top[1]} of ${recent.length} book${recent.length===1?"":"s"} finished).`});
    else facts.push({icon:"📚", text:`You finished ${recent.length} book${recent.length===1?"":"s"} in the past month — nice pace!`});
  }

  const rated = completed.filter(b=>b.rating>0).sort((a,b)=>b.rating-a.rating || (b.dateFinished||"").localeCompare(a.dateFinished||""))[0];
  if(rated) facts.push({icon:"⭐", text:`Your top-rated read is <strong>${esc(rated.title)}</strong> at ${rated.rating}★.`});

  const withPages = completed.filter(b=>b.pagesHours && !isNaN(Number(b.pagesHours))).sort((a,b)=>Number(b.pagesHours)-Number(a.pagesHours))[0];
  if(withPages) facts.push({icon:"📖", text:`Your longest read was <strong>${esc(withPages.title)}</strong> at ${withPages.pagesHours} pages/hours.`});

  const monthMap={};
  completed.forEach(b=>{ const key=b.dateFinished.slice(0,7); monthMap[key]=(monthMap[key]||0)+1; });
  const topMonth = Object.entries(monthMap).sort((a,b)=>b[1]-a[1])[0];
  if(topMonth && topMonth[1]>1){
    const [y,m] = topMonth[0].split("-");
    facts.push({icon:"🔥", text:`Your best month was ${monthNames[Number(m)-1]} ${y} — ${topMonth[1]} books finished.`});
  }

  const ratedAll = completed.filter(b=>b.rating>0);
  if(ratedAll.length){
    const avg = (ratedAll.reduce((s,b)=>s+b.rating,0)/ratedAll.length).toFixed(1);
    facts.push({icon:"🌟", text:`Your average rating for finished books is ${avg}★ across ${ratedAll.length} rated read${ratedAll.length===1?"":"s"}.`});
  }

  const dnfCount = books.filter(b=>b.status==="dnf").length;
  if(dnfCount) facts.push({icon:"👋", text:`You've set aside ${dnfCount} book${dnfCount===1?"":"s"} as did-not-finish — no shame in that.`});

  const gmapAll={}; completed.forEach(b=>{ if(b.genre) gmapAll[b.genre]=(gmapAll[b.genre]||0)+1; });
  const topAll = Object.entries(gmapAll).sort((a,b)=>b[1]-a[1])[0];
  if(topAll) facts.push({icon:"🏆", text:`All-time, your most-read genre is <strong>${esc(topAll[0])}</strong> with ${topAll[1]} book${topAll[1]===1?"":"s"} finished.`});

  return facts;
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const books = state.books;
  if(books.length===0) return emptyState("Your dashboard wakes up once you've logged a book. Add one from the Book Tracker to see your stats here.");
  const year = new Date().getFullYear().toString();
  const completed = books.filter(b=>b.status==="done");
  const completedThisYear = completed.filter(b=>yearOf(b.dateFinished)===year);
  const reading = books.filter(b=>b.status==="reading").length;
  const dnfCount = books.filter(b=>b.status==="dnf").length;
  
  // Find all books finished in the current calendar month
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const finishedThisMonth = completed.filter(b => {
    if (!b.dateFinished) return false;
    const d = new Date(b.dateFinished + "T00:00:00");
    return !isNaN(d) && d.getFullYear() === currentYear && d.getMonth() === currentMonth;
  }).sort((a, b) => (b.dateFinished || "").localeCompare(a.dateFinished || ""));

  const funFacts = computeFunFacts(books);

  const goalVal = Number(state.goals[year]) || 0;
  let goalNum, goalPaceHTML = "";
  if(goalVal > 0){
    goalNum = `${completedThisYear.length}<span style="font-size:16px;color:var(--muted);">/${goalVal}</span>`;
    const startOfYear = new Date(Number(year), 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / 86400000);
    const isLeap = (Number(year)%4===0 && Number(year)%100!==0) || Number(year)%400===0;
    const daysInYear = isLeap ? 366 : 365;
    const expectedByNow = goalVal * dayOfYear / daysInYear;
    const diff = Math.round(completedThisYear.length - expectedByNow);
    const paceText = diff > 0 ? `${diff} book${diff===1?"":"s"} ahead of pace`
      : diff < 0 ? `${Math.abs(diff)} book${Math.abs(diff)===1?"":"s"} behind pace`
      : `Right on pace`;
    goalPaceHTML = `<div style="font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;">${paceText}</div>`;
  } else {
    goalNum = `<span style="font-size:16px;">Set goal</span>`;
  }

  const genreMap = {}; books.forEach(b=>{ if(b.genre) genreMap[b.genre]=(genreMap[b.genre]||0)+1; });
  const genreEntries = Object.entries(genreMap);
  const formatMap = {}; books.forEach(b=>{ if(b.format) formatMap[b.format]=(formatMap[b.format]||0)+1; });
  const formatEntries = Object.entries(formatMap);
  const formatColors = { Physical: COLORS.oxblood, Digital: COLORS.rose, Audio: COLORS.sage };

  function pie(entries, colorFn){
    const total = entries.reduce((s,[,v])=>s+v,0) || 1;
    let acc = 0; const stops = [];
    entries.forEach(([name,val])=>{
      const start = acc/total*100; acc += val; const end = acc/total*100;
      stops.push(`${colorFn(name)} ${start}% ${end}%`);
    });
    const bg = stops.length ? `conic-gradient(${stops.join(",")})` : "#eee";
    const legend = entries.map(([name,val])=>`<div class="row"><span class="sw" style="background:${colorFn(name)}"></span>${esc(name)} · ${val}</div>`).join("");
    return `<div class="pie-wrap"><div class="pie" style="background:${bg}"></div><div class="pie-legend">${legend||"<span style='color:var(--muted)'>No data yet</span>"}</div></div>`;
  }

  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const finished = new Array(12).fill(0);
  books.forEach(b=>{
    if(b.dateFinished && yearOf(b.dateFinished)===year) finished[new Date(b.dateFinished).getMonth()]++;
  });
  const maxVal = Math.max(1, ...finished);
  const bars = monthNames.map((m,i)=>`
    <div class="bar-col">
      <div class="bar-pair">
        <div class="bar" style="height:${finished[i]/maxVal*100}%;background:${COLORS.oxblood}" title="${m} finished: ${finished[i]}"></div>
      </div>
      <div class="bar-month">${m}</div>
    </div>`).join("");

  return `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;">
      <div class="stat-card"><div class="num">${books.length}</div><div class="label">Total books</div></div>
      <div class="stat-card"><div class="num">${completedThisYear.length}</div><div class="label">Read in ${year}</div></div>
      <div class="stat-card"><div class="num">${reading}</div><div class="label">Currently reading</div></div>
      <div class="stat-card"><div class="num">${completed.length}</div><div class="label">All-time completed</div></div>
      <div class="stat-card"><div class="num">${dnfCount}</div><div class="label">Did not finish</div></div>
      <div class="stat-card" style="cursor:pointer;" data-action="open-goal-form" title="Set your yearly reading goal">
        <div class="num">${goalNum}</div>
        <div class="label">${year} Goal</div>
        ${goalPaceHTML}
      </div>
    </div>
    ${funFacts.length ? `
    <div class="card" style="margin-bottom:18px;">
      <div class="section-label">Fun facts</div>
      <div class="fact-list">
        ${funFacts.map(f=>`<div class="fact-row"><span class="fact-icon">${f.icon}</span><span>${f.text}</span></div>`).join("")}
      </div>
    </div>` : ""}
    <div class="dash-grid" style="display:grid;grid-template-columns:260px 1fr 1fr;gap:16px;margin-bottom:18px;">
      <div class="card">
        <div class="section-label">Last Finished</div>
        ${finishedThisMonth.length > 0 ? `
          <div style="display:flex;flex-direction:column;gap:14px;max-height:360px;overflow-y:auto;padding-right:4px;">
            ${finishedThisMonth.map(b => `
              <div style="padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;">
                <div style="width:50px;flex-shrink:0;">${coverHTML(b, 70)}</div>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-size:13px;line-height:1.2;" title="${esc(b.title)}">${esc(b.title)}</div>
                  <div style="font-size:11.5px;color:var(--muted);margin-bottom:2px;" title="${esc(b.author)}">${esc(b.author)}</div>
                  <div style="font-size:10.5px;color:var(--muted);margin-bottom:4px;">Finished ${fmtDate(b.dateFinished)}</div>
                  ${starsHTML(b.rating, false, null, 11)}
                </div>
              </div>
            `).join("")}
          </div>
        ` : `<div style="font-size:12.5px;color:var(--muted);">No books finished this month yet.</div>`}
      </div>
      <div class="card pie-card">
        <div class="section-label">By genre</div>
        ${pie(genreEntries, genreColor)}
      </div>
      <div class="card pie-card">
        <div class="section-label">By format</div>
        ${pie(formatEntries, n=>formatColors[n]||COLORS.oxblood)}
      </div>
    </div>
    <div class="card">
      <div class="section-label">${year} in books</div>
      <div class="bars">${bars}</div>
      <div class="legend">
        <div><span class="dot" style="background:${COLORS.oxblood}"></span>Finished</div>
      </div>
    </div>
  `;
}

/* ---------------- goodreads import ---------------- */
let goodreadsParsed = null;
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}
function normalizeGoodreadsDate(s){
  if(!s) return "";
  const m = s.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return "";
  return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
}
function mapGoodreadsFormat(binding){
  const s = (binding||"").toLowerCase();
  if(s.includes("audio")) return "Audio";
  if(s.includes("kindle")||s.includes("ebook")||s.includes("digital")||s.includes("nook")) return "Digital";
  return "Physical";
}
function mapGoodreadsStatus(shelf){
  const s = (shelf||"").toLowerCase();
  if(s.includes("currently")) return "reading";
  if(s.includes("to-read")) return "want";
  return "done";
}
function rowsToBooks(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(h=>h.trim());
  const idx = name => header.indexOf(name);
  const iTitle=idx("Title"), iAuthor=idx("Author"), iRating=idx("My Rating"), iDateRead=idx("Date Read"),
        iShelf=idx("Exclusive Shelf"), iBinding=idx("Binding"), iPages=idx("Number of Pages"),
        iReview=idx("My Review"), iNotes=idx("Private Notes"), iShelves=idx("Bookshelves");
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.length<2) continue;
    const title = iTitle>=0 ? row[iTitle].trim() : "";
    if(!title) continue;
    const shelvesRaw = iShelves>=0 ? row[iShelves] : "";
    const genreGuess = shelvesRaw ? (shelvesRaw.split(",").map(s=>s.trim()).filter(Boolean)[0]||"") : "";
    const status = mapGoodreadsStatus(iShelf>=0?row[iShelf]:"");
    out.push({
      id: uid(), isExample:false, title,
      author: iAuthor>=0 ? row[iAuthor].trim() : "",
      genre: genreGuess, subGenre: "",
      format: mapGoodreadsFormat(iBinding>=0?row[iBinding]:""),
      source: "", status: status,
      priority: (status === "done" || status === "dnf") ? "" : "Interested",
      rating: Number(iRating>=0?row[iRating]:0)||0,
      dateFinished: normalizeGoodreadsDate(iDateRead>=0?row[iDateRead]:""),
      language: "English", pagesHours: iPages>=0 ? row[iPages].trim() : "",
      review: iReview>=0 ? row[iReview].trim() : "", notes: iNotes>=0 ? row[iNotes].trim() : "",
      recommendedBy: "", coverUrl: "",
    });
  }
  return out;
}
function handleGoodreadsFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{ goodreadsParsed = rowsToBooks(parseCSV(e.target.result)); }
    catch(err){ goodreadsParsed = []; }
    renderModal();
  };
  reader.readAsText(file);
}
function runGoodreadsImport(){
  if(!goodreadsParsed || goodreadsParsed.length===0) return;
  const skipDupes = document.getElementById("gr-skip-dupes") ? document.getElementById("gr-skip-dupes").checked : true;
  const existingKeys = new Set(state.books.map(b=>(b.title+"|"+b.author).toLowerCase()));
  goodreadsParsed.forEach(b=>{
    const key = (b.title+"|"+b.author).toLowerCase();
    if(skipDupes && existingKeys.has(key)) return;
    state.books.push(b);
    existingKeys.add(key);
  });
  persistBooks();
  goodreadsParsed = null;
  state.modal = null;
  state.tab = "tracker";
  localStorage.setItem('shelf:lastTab', state.tab);
  render();
}
function goodreadsImportHTML(){
  const preview = goodreadsParsed;
  return `
    <div style="font-size:13px;line-height:1.65;margin-bottom:16px;">
      <div class="section-label">How to export your Goodreads library</div>
      <ol style="margin:0;padding-left:18px;">
        <li>Sign in at goodreads.com and open <b>My Books</b>.</li>
        <li>In the left sidebar, scroll down to <b>Tools</b> and click <b>Import and export</b>.</li>
        <li>Click the <b>Export Library</b> button, then wait for the download link and click it.</li>

/* ---------------- actions ---------------- */
function findBook(id){ return state.books.find(b=>b.id===id); }
function saveBookFromForm(){
  const id = document.getElementById("f-id").value;
  const existing = findBook(id);
  const statusVal = document.getElementById("f-status").value;
  let priorityVal = document.getElementById("f-priority").value;
  if(statusVal === "done" || statusVal === "dnf"){
    priorityVal = "";
  }
  const b = {
    id, isExample:false,
    title: document.getElementById("f-title").value.trim(),
    author: document.getElementById("f-author").value.trim(),
    genre: document.getElementById("f-genre").value.trim(),
    subGenre: document.getElementById("f-subgenre").value.trim(),
    format: document.getElementById("f-format").value,
    source: document.getElementById("f-source").value,
    status: statusVal,
    priority: priorityVal,
    rating: Number(document.getElementById("f-rating").value)||0,
    dateFinished: document.getElementById("f-finished").value,
    pagesHours: document.getElementById("f-pages").value.trim(),
    language: document.getElementById("f-language").value,
    review: document.getElementById("f-review").value.trim(),
    notes: document.getElementById("f-notes").value.trim(),
    recommendedBy: document.getElementById("f-recby").value.trim(),
    coverUrl: document.getElementById("f-cover").value.trim(),
  };
  if(!b.title) return;
  if(existing) state.books = state.books.map(x=>x.id===id?b:x);
  else state.books.push(b);
  persistBooks();
  state.modal = null;
  render();
}
function saveCompleteBookFromModal(){
  const id = document.getElementById("cf-id").value;
  const dateFinished = document.getElementById("cf-finished").value;
  const rating = Number(document.getElementById("cf-rating").value) || 0;
  
  if (rating <= 0) {
    alert("Please provide a rating before completing.");
    return;
  }

  state.books = state.books.map(b => {
    if(b.id === id){
      return {
        ...b,
        status: "done",
        dateFinished: dateFinished,
        rating: rating,
        priority: ""
      };
    }
    return b;
  });
  persistBooks();
  state.modal = null;
  render();
}
function markDNFFromModal(id){
  state.books = state.books.map(b => {
    if(b.id === id){
      return {
        ...b,
        status: "dnf",
        rating: 0,
        priority: ""
      };
    }
    return b;
  });
  persistBooks();
  state.modal = null;
  render();
}
function deleteBook(id){
  state.books = state.books.filter(b=>b.id!==id);
  persistBooks();
  state.modal = null;
  render();
}
function saveWishFromForm(){
  const id = document.getElementById("wf-id").value;
  const existing = state.wishlist.find(w=>w.id===id);
  const w = {
    id, isExample:false,
    title: document.getElementById("wf-title").value.trim(),
    author: document.getElementById("wf-author").value.trim(),
    price: document.getElementById("wf-price").value.trim(),
    priority: document.getElementById("wf-priority").value,
    bought: existing ? existing.bought : false,
  };
  if(!w.title) return;
  if(existing) state.wishlist = state.wishlist.map(x=>x.id===id?w:x);
  else state.wishlist.push(w);
  persistWishlist();
  state.modal = null;
  render();
}
function deleteWish(id){ state.wishlist = state.wishlist.filter(w=>w.id!==id); persistWishlist(); render(); }
function saveGoalFromForm(){
  const year = document.getElementById("gf-year").value;
  const val = Math.max(0, Math.floor(Number(document.getElementById("gf-goal").value) || 0));
  state.goals = { ...state.goals, [year]: val };
  persistGoals();
  state.modal = null;
  render();
}
function moveWishToTracker(id){
  const w = state.wishlist.find(x=>x.id===id);
  if(!w) return;
  state.books.push({ id:uid(), title:w.title, author:w.author, genre:"", subGenre:"", format:"Physical", source:"Purchased", status:"reading", priority:w.priority, rating:0, dateFinished:"", language:"English", pagesHours:"", review:"", notes:"", recommendedBy:"", isExample:false });
  state.wishlist = state.wishlist.filter(x=>x.id!==id);
  persistBooks(); persistWishlist();
  state.tab = "tracker";
  localStorage.setItem('shelf:lastTab', state.tab);
  render();
}
function toggleSelect(id){ if(ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id); }
function selectAllBooks(){ state.books.forEach(b=>ui.selected.add(b.id)); }
function clearSelection(){ ui.selected.clear(); }
function deleteSelectedBooks(){
  if(ui.selected.size===0) return;
  if(!confirm(`Delete ${ui.selected.size} book(s)? This can't be undone.`)) return;
  state.books = state.books.filter(b=>!ui.selected.has(b.id));
  ui.selected.clear();
  persistBooks(); render();
}
function saveBulkEditFromForm(){
  const fields = [["bf-status","status"],["bf-genre","genre"],["bf-format","format"],["bf-source","source"],["bf-priority","priority"]];
  const changes = {};
  fields.forEach(([elId,key])=>{
    const el = document.getElementById(elId);
    if(el && el.value) changes[key] = el.value;
  });
  if(Object.keys(changes).length>0){
    state.books = state.books.map(b=> {
      if(!ui.selected.has(b.id)) return b;
      const updated = {...b, ...changes};
      if(updated.status === "done" || updated.status === "dnf"){
        updated.priority = "";
      }
      return updated;
    });
    persistBooks();
  }
  ui.selected.clear();
  state.modal = null;
  render();
}
function clearExamples(){
  state.books = state.books.filter(b=>!b.isExample);
  state.wishlist = state.wishlist.filter(w=>!w.isExample);
  persistBooks(); persistWishlist();
  render();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", (e)=>{
  const overlay = e.target.closest("[data-action='overlay-close']");
  if(overlay && !e.target.closest("[data-stop]")){ state.modal=null; goodreadsParsed=null; render(); return; }

  const star = e.target.closest("[data-star]");
  if(star){
    const wrap = star.closest(".stars");
    if(!wrap.classList.contains("editable")) return;
    const target = wrap.getAttribute("data-star-target");
    const hidden = document.getElementById(target);
    const n = Number(star.getAttribute("data-star"));
    const rect = star.getBoundingClientRect();
    const clickFrac = rect.width>0 ? Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width)) : 1;
    const quarter = Math.min(4, Math.max(1, Math.ceil(clickFrac*4))) / 4;
    const current = Number(hidden.value)||0;
    let val = (n-1) + quarter;
    val = Math.round(val*4)/4;
    val = (val===current) ? 0 : val;
    hidden.value = val;
    applyStarFills(wrap, val);
    const numInput = document.getElementById(target+"-num");
    if(numInput) numInput.value = val || "";
    return;
  }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  if(action==="set-tab"){ state.tab = el.getAttribute("data-tab"); localStorage.setItem('shelf:lastTab', state.tab); ui.mobileMoreOpen = false; render(); }
  else if(action==="toggle-mobile-more"){ ui.mobileMoreOpen = !ui.mobileMoreOpen; render(); }
  else if(action==="close-mobile-more"){ ui.mobileMoreOpen = false; render(); }
  else if(action==="add-book"){ state.modal = {type:"book-form", payload:null}; renderModal(); }
  else if(action==="mark-completed"){ state.modal = {type:"complete-book", payload: findBook(id)}; renderModal(); }
  else if(action==="edit-book"){ state.modal = {type:"book-form", payload: findBook(id)}; renderModal(); }
  else if(action==="open-book"){ state.modal = {type:"book-detail", payload: findBook(id)}; renderModal(); }
  else if(action==="edit-from-detail"){ state.modal = {type:"book-form", payload: findBook(id)}; renderModal(); }
  else if(action==="delete-book"){ deleteBook(id); }
  else if(action==="save-book"){ saveBookFromForm(); }
  else if(action==="save-complete-book"){ saveCompleteBookFromModal(); }
  else if(action==="mark-dnf"){ markDNFFromModal(id); }
  else if(action==="close-modal"){ state.modal = null; goodreadsParsed = null; renderModal(); }
  else if(action==="sort"){ ui.sortKey = el.getAttribute("data-key"); render(); }
  else if(action==="clear-examples"){ clearExamples(); }
  else if(action==="cal-prev"){ ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth()-1, 1); ui.calPicked=null; render(); }
  else if(action==="cal-next"){ ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth()+1, 1); ui.calPicked=null; render(); }
  else if(action==="cal-day"){ ui.calPicked = el.getAttribute("data-day"); render(); }
  else if(action==="add-wish"){ state.modal = {type:"wish-form", payload:null}; renderModal(); }
  else if(action==="edit-wish"){ state.modal = {type:"wish-form", payload: state.wishlist.find(w=>w.id===id)}; renderModal(); }
  else if(action==="save-wish"){ saveWishFromForm(); }
  else if(action==="delete-wish"){ deleteWish(id); }
  else if(action==="move-wish"){ moveWishToTracker(id); }
  else if(action==="open-goal-form"){
    const year = new Date().getFullYear().toString();
    state.modal = {type:"goal-form", payload: { year, goal: state.goals[year] || "" }};
    renderModal();
  }
  else if(action==="save-goal"){ saveGoalFromForm(); }
  else if(action==="clear-cover"){
    document.getElementById("f-cover").value = "";
    const urlInput = document.getElementById("f-cover-url"); if(urlInput) urlInput.value = "";
    const prev = document.getElementById("cover-preview");
    if(prev){ prev.classList.add("empty"); prev.innerHTML = "📖"; }
  }
  else if(action==="goodreads-search"){
    const t = (document.getElementById("f-title")?.value || "").trim();
    const a = (document.getElementById("f-author")?.value || "").trim();
    const q = [t,a].filter(Boolean).join(" ");
    if(q){ window.open("https://www.goodreads.com/search?q=" + encodeURIComponent(q), "_blank", "noopener"); }
  }
  else if(action==="import-goodreads"){ state.modal = {type:"goodreads-import", payload:null}; renderModal(); }
  else if(action==="do-goodreads-import"){ runGoodreadsImport(); }
  else if(action==="toggle-select"){ toggleSelect(id); render(); }
  else if(action==="select-all-books"){ selectAllBooks(); render(); }
  else if(action==="clear-selection"){ clearSelection(); render(); }
  else if(action==="delete-selected-books"){ deleteSelectedBooks(); }
  else if(action==="bulk-edit"){ state.modal = {type:"bulk-edit-form", payload:null}; renderModal(); }
  else if(action==="save-bulk-edit"){ saveBulkEditFromForm(); }
  else if(action==="open-export"){ state.modal = {type:"backup-export", payload:null}; renderModal(); }
  else if(action==="open-import"){ state.modal = {type:"backup-import", payload:null}; renderModal(); }
  else if(action==="do-export-json"){ exportBackupJSON(); }
  else if(action==="do-import-json"){
    const fileInput = document.getElementById("import-json-file");
    if(fileInput && fileInput.files[0]){
      importBackupJSON(fileInput.files[0]);
    }
  }
});

      if(!dataUrl) return;
      const hidden = document.getElementById("f-cover");
      const urlInput = document.getElementById("f-cover-url");
      const prev = document.getElementById("cover-preview");

      if(urlInput) urlInput.value = "";

  else if(e.target.id==="f-status"){
    const val = e.target.value;
    const priEl = document.getElementById("f-priority");
    const priWrap = document.getElementById("priority-field-wrap");

      priEl.value = "";
    }

  else if(e.target.id==="gallery-genre"){ ui.galleryGenre = e.target.value; render(); }
  else if(e.target.id==="gallery-rating"){ ui.galleryRating = e.target.value; render(); }
  else if(e.target.id==="shelf-genre"){ ui.shelfGenre = e.target.value; render(); }
  else if(e.target.getAttribute && e.target.getAttribute("data-action")==="toggle-bought"){
    const id = e.target.getAttribute("data-id");
    state.wishlist = state.wishlist.map(w=> w.id===id ? {...w, bought:e.target.checked} : w);
    persistWishlist(); render();
  }
});
document.addEventListener("input", (e)=>{
  if(e.target.id==="gallery-q"){ ui.galleryQuery = e.target.value; render(); document.getElementById("gallery-q") && document.getElementById("gallery-q").focus(); }
  else if(e.target.id==="f-genre"){
    const val = e.target.value;
    const datalist = document.getElementById("genre-list");
    if (datalist) {
      const allGenres = Array.from(new Set([...DEFAULT_GENRES, ...state.books.map(x=>x.genre).filter(Boolean)]));
      datalist.innerHTML = sortSuggestionsByInput(allGenres, val).map(g=>`<option value="${esc(g)}">`).join("");
    }
  }
  else if(e.target.id==="f-subgenre"){
    const val = e.target.value;
    const datalist = document.getElementById("subgenre-list");
    if (datalist) {
      const allSubGenres = Array.from(new Set(state.books.map(x=>x.subGenre).filter(Boolean)));
      datalist.innerHTML = sortSuggestionsByInput(allSubGenres, val).map(sg=>`<option value="${esc(sg)}">`).join("");
    }
  }
  else if(e.target.id==="f-cover-url"){
    const val = e.target.value.trim();
    const hidden = document.getElementById("f-cover");
    const prev = document.getElementById("cover-preview");
    if(hidden) hidden.value = val;
    if(prev){
      if(val){ prev.classList.remove("empty"); prev.innerHTML = `<img src="${esc(val)}" alt="cover preview" onerror="this.parentElement.classList.add('empty'); this.remove();"/>`; }
      else { prev.classList.add("empty"); prev.innerHTML = "📖"; }
    }
  }
  else if(e.target.id==="f-rating-num" || e.target.id==="cf-rating-num"){
    const targetId = e.target.id === "cf-rating-num" ? "cf-rating" : "f-rating";
    const hidden = document.getElementById(targetId);
    let val = Number(e.target.value)||0;
    val = Math.max(0, Math.min(5, val));
    if(hidden) hidden.value = val;
    const wrap = e.target.closest("span")?.querySelector(".stars");
    if(wrap) applyStarFills(wrap, val);
  }
});

/* ---------------- init ---------------- */
loadData();
</script>
</body>
</html>
