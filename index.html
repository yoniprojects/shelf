});
document.addEventListener("input", (e)=>{
  if(e.target.id==="gallery-q"){ ui.galleryQuery = e.target.value; render(); document.getElementById("gallery-q") && document.getElementById("gallery-q").focus(); }
  else if(e.target.id==="f-genre"){
    const val = e.target.value;
    const datalist = document.getElementById("genre-list");
    if (datalist) {
      const allGenres = Array.from(new Set([...DEFAULT_GENRES, ...state.books.map(x=>x.genre).filter(Boolean)]));
      datalist.innerHTML = sortSuggestionsByInput(allGenres, val).map(g=>`<option value="${esc(g)}">`).join("");
    }
  }
  else if(e.target.id==="f-subgenre"){
    const val = e.target.value;
    const datalist = document.getElementById("subgenre-list");
    if (datalist) {
      const allSubGenres = Array.from(new Set(state.books.map(x=>x.subGenre).filter(Boolean)));
      datalist.innerHTML = sortSuggestionsByInput(allSubGenres, val).map(sg=>`<option value="${esc(sg)}">`).join("");
    }
  }
  else if(e.target.id==="f-cover-url"){
    const val = e.target.value.trim();
    const hidden = document.getElementById("f-cover");
    const prev = document.getElementById("cover-preview");
    if(hidden) hidden.value = val;
    if(prev){
      if(val){ prev.classList.remove("empty"); prev.innerHTML = `<img src="${esc(val)}" alt="cover preview" onerror="this.parentElement.classList.add('empty'); this.remove();"/>`; }
      else { prev.classList.add("empty"); prev.innerHTML = "📖"; }
    }
  }
  else if(e.target.id==="f-series-name"){
    refreshSeriesBox();
  }
  else if(e.target.classList && e.target.classList.contains("reread-date")){
    const rid = e.target.getAttribute("data-id");
    const r = formRereads.find(x=>x.id===rid);
    if(r) r.endDate = e.target.value;
  }
  else if(/-rating-num$/.test(e.target.id)){
    const targetId = e.target.id.replace(/-num$/, "");
    const hidden = document.getElementById(targetId);
    let val = Number(e.target.value)||0;
    val = Math.max(0, Math.min(5, val));
    if(hidden) hidden.value = val;
    const wrap = e.target.closest("span")?.querySelector(".stars");
    if(wrap) applyStarFills(wrap, val);
  }
});

/* ---------------- dashboard: top reads dynamic fit ---------------- */
function fitTopReads(){
  const row = document.getElementById("top-reads-row");
  if(!row) return;
  const items = Array.from(row.querySelectorAll(".top-read-item"));
  if(!items.length) return;
  items.forEach(it=>{ it.style.display = ""; });
  const rowWidth = row.clientWidth;
  const itemWidth = items[0].getBoundingClientRect().width;
  if(itemWidth <= 0) return;
  const gapPx = parseFloat(getComputedStyle(row).columnGap || getComputedStyle(row).gap) || 0;
  let count = Math.floor((rowWidth + gapPx) / (itemWidth + gapPx));
  count = Math.max(1, Math.min(items.length, count));
  items.forEach((it,i)=>{ it.style.display = i < count ? "" : "none"; });
}

/* ---------------- dashboard: fun-facts dynamic sizing ---------------- */
function fitFunFactsHeight(){
  const row = document.getElementById("cr-ff-row");
  const crCard = document.getElementById("cr-card");
  const ffCard = document.getElementById("ff-card");
  if(!row || !crCard || !ffCard) return;
  const factList = ffCard.querySelector(".fact-list");
  if(!factList) return;

  const BASE_FONT = 14.5, BASE_GAP = 16;
  const MIN_SCALE = 0.72, MAX_SCALE = 1.65;

  // Measure natural (unstretched) heights so we can compare real content sizes,
  // not the equalized heights align-items:stretch produces.
  row.style.alignItems = "flex-start";
  factList.style.fontSize = "";
  factList.style.gap = "";

  // Only relevant when the two cards are actually sharing a row.
  const sameRow = Math.abs(crCard.getBoundingClientRect().top - ffCard.getBoundingClientRect().top) < 1;
  if(!sameRow){
    row.style.alignItems = "stretch";
    return;
  }

  const crHeight = crCard.offsetHeight;
  let ffHeight = ffCard.offsetHeight;
  if(crHeight > 0 && ffHeight > 0){
    let scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, crHeight/ffHeight));
    factList.style.fontSize = (BASE_FONT*scale).toFixed(2)+"px";
    factList.style.gap = Math.max(6, Math.round(BASE_GAP*scale))+"px";
    // One corrective pass: line-wrapping means font-size vs height isn't perfectly
    // linear, so re-measure once and nudge closer.
    ffHeight = ffCard.offsetHeight;
    if(ffHeight > 0){
      const correction = Math.max(0.85, Math.min(1.18, crHeight/ffHeight));
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale*correction));
      factList.style.fontSize = (BASE_FONT*scale).toFixed(2)+"px";
      factList.style.gap = Math.max(6, Math.round(BASE_GAP*scale))+"px";
    }
  }
  row.style.alignItems = "stretch";
}
let funFactsFitRAF = null;
function scheduleFunFactsFit(){
  if(state.tab !== "dashboard") return;
  if(funFactsFitRAF) cancelAnimationFrame(funFactsFitRAF);
  funFactsFitRAF = requestAnimationFrame(()=>{ fitFunFactsHeight(); fitTopReads(); });
}
let funFactsResizeTimer = null;
window.addEventListener("resize", ()=>{
  clearTimeout(funFactsResizeTimer);
  funFactsResizeTimer = setTimeout(scheduleFunFactsFit, 120);
});
