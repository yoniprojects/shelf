    <!-- Firebase SDKs to load shared data from index -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // Resume where I left off: mark this page as the last one visited.
        localStorage.setItem('shelf:lastPage', 'wheel.html');

        // Firebase Setup
        const firebaseConfig = {
          apiKey: "AIzaSyBqOuK-l7h5Do9sAk1y4MBxwYkFFu2pusY",
          authDomain: "readingtracker-73e78.firebaseapp.com",
          projectId: "readingtracker-73e78",
          storageBucket: "readingtracker-73e78.firebasestorage.app",
          messagingSenderId: "391536984056",
          appId: "1:391536984056:web:ec841e6e42dbfd51e8e00d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // Same per-user document scheme as the main Shelf & Spine app.
        function getCurrentUserId(){
          return localStorage.getItem('shelf:currentUser') || 'shared';
        }
        const SHARED_DOC = db.collection("shelf-spine").doc(getCurrentUserId());
        // Spin counter state lives in its own collection, keyed per-profile,
        // so it syncs across any device logged into the same profile
        // (Yoni's "shared" profile and Tom's "tom" profile stay separate).
        const WHEEL_DOC = db.collection("wheel-app").doc(getCurrentUserId());
        // Local fallback so the counter shows instantly on load instead of
        // waiting on a Firestore round trip (and doesn't blank out if that
        // round trip fails silently). Scoped per-profile like the Firestore doc.
        const SPINS_CACHE_KEY = `shelf:wheelSpins:${getCurrentUserId()}`;

        let currentRotation = 0;
        let smallWheelRotation = 0;
        let currentSpins = 0;
        let isSpinning = false;
        let suppressNextSpinsSave = false;
        
        let allBooks = [];
        let filteredBooks = [];
        let readingBooks = [];
        let tbrBooks = [];
        let goalsModeData = [];

        // Sub-goals: a Goals-mode-only breakdown of a single goal (e.g. a
        // milestone like "Chapter 9") into a sequential list of smaller
        // sub-goals. Lives entirely on WHEEL_DOC (never written back to
        // SHARED_DOC / goals.html) so it stays wheel-only, but still syncs
        // across devices on the same profile via Firestore.
        // Shape: { [subGoalKey]: { parentLabel, bookTitle, items: [{id, text, completed}] } }
        let subGoalsMap = {};
        let editingSubGoalKey = null;
        let editingSubGoalBookTitle = '';
        let editingSubGoalParentLabel = '';
        let currentWinnerSubGoal = null; // { key, id } for the "Mark Sub-Goal Done" button
        let wheelMode = ['reading', 'tbr', 'goals'].includes(localStorage.getItem('shelf:wheelMode'))
            ? localStorage.getItem('shelf:wheelMode')
            : 'reading';

        // Tracks which checkbox-filter values are unchecked. Empty set = everything shown.
        let deselectedGenres = new Set();
        let deselectedFormats = new Set();

        function toggleSelectFilter(field) {
            const target = document.getElementById(`${field}-filter`);
            const isOpen = target.classList.contains('open');
            document.querySelectorAll('.select-filter.open').forEach(el => el.classList.remove('open'));
            if (!isOpen) target.classList.add('open');
        }

        // Close any open filter dropdown when clicking outside it.
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.select-filter')) {
                document.querySelectorAll('.select-filter.open').forEach(el => el.classList.remove('open'));
            }
        });

        function updateFilterOptions() {
            renderCombinedFilters();
        }

        // Builds the list of distinct values (plus a "(None)" entry for blanks)
        // for a given book field, e.g. 'genre' or 'format'.
        function getFieldValues(field) {
            const values = Array.from(new Set(allBooks.map(b => b[field]).filter(Boolean))).sort();
            if (allBooks.some(b => !b[field])) values.push('__none__');
            return values;
        }

        function renderCombinedFilters() {
            const container = document.getElementById('filter-combined-options');
            const summaryEl = document.getElementById('filters-filter-summary');
            const includeFormat = wheelMode !== 'tbr';

            const genreValues = getFieldValues('genre');
            const formatValues = includeFormat ? getFieldValues('format') : [];

            let html = '';
            html += buildFilterSectionHtml('genre', 'Genre', genreValues, deselectedGenres);
            if (includeFormat) {
                html += buildFilterSectionHtml('format', 'Format', formatValues, deselectedFormats);
            }

            if (!html) {
                html = `<div class="empty-state" style="margin-top:0;padding:10px 12px;">No options yet.</div>`;
            }
            container.innerHTML = html;

            const summaryParts = [];
            const genreSummary = fieldSummaryText(genreValues, deselectedGenres, 'Genres');
            if (genreSummary) summaryParts.push(genreSummary);
            if (includeFormat) {
                const formatSummary = fieldSummaryText(formatValues, deselectedFormats, 'Formats');
                if (formatSummary) summaryParts.push(formatSummary);
            }
            summaryEl.textContent = summaryParts.length ? summaryParts.join(', ') : 'All Filters';
        }

        function buildFilterSectionHtml(field, sectionLabel, values, deselectedSet) {
            if (values.length === 0) return '';
            let html = `<div class="select-filter-section-heading">${sectionLabel}</div>`;
            values.forEach((v, i) => {
                const label = v === '__none__' ? '(None)' : v;
                const id = `filter-${field}-${i}`;
                const checked = !deselectedSet.has(v);
                html += `
                    <label class="select-filter-option" for="${id}">
                        <input type="checkbox" id="${id}" data-field="${field}" data-value="${v.replace(/"/g, '&quot;')}" ${checked ? 'checked' : ''} onchange="onFilterCheckboxChange(event)">
                        ${label}
                    </label>`;
            });
            return html;
        }

        // Returns a short summary fragment for a field, or null if everything
        // in it is selected (the default "no filtering" state).
        function fieldSummaryText(values, deselectedSet, pluralLabel) {
            if (values.length === 0) return null;
            const selectedCount = values.length - deselectedSet.size;
            if (selectedCount === values.length) return null;
            if (selectedCount === 0) return `No ${pluralLabel}`;
            return `${selectedCount}/${values.length} ${pluralLabel}`;
        }

        function onFilterCheckboxChange(e) {
            const field = e.target.getAttribute('data-field');
            const value = e.target.getAttribute('data-value');
            const set = field === 'genre' ? deselectedGenres : deselectedFormats;
            if (e.target.checked) {
                set.delete(value);
            } else {
                set.add(value);
            }
            renderCombinedFilters();
            applyFilters();
        }

        // Same local-date formatting goals.html uses, so "today" lines up
        // with whatever day the milestone was scheduled for.
        function todayLocalDateStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // For each currently-reading book, find its goal entry/entries (matched
        // by bookTitle, same as goals.html's book picker) and pick the first
        // not-yet-completed milestone dated today, in the milestones' original
        // order. Books with no such milestone (nothing scheduled today, or
        // today's milestones are all already checked off) are left out
        // entirely — that's what gives the "swap to next milestone" / "book
        // disappears" behavior for free, recomputed fresh on every snapshot.
        // "Move to next day" — a wheel-only override of which date's
        // milestones are being shown in Goals mode. Lives on WHEEL_DOC (never
        // SHARED_DOC / goals.html), synced the same way sub-goals are, so
        // choosing to move on from one device carries over to any other
        // device signed into the same profile. Null = just use the real
        // calendar date.
        let goalsViewDateOverride = null;

        // Real calendar date always wins once it catches up to (or passes)
        // the override, so this can't get stuck showing a stale future date
        // forever — it only ever lets you look *ahead*, never behind.
        function effectiveGoalsDate() {
            const todayStr = todayLocalDateStr();
            if (goalsViewDateOverride && goalsViewDateOverride > todayStr) {
                return goalsViewDateOverride;
            }
            return todayStr;
        }

        // Earliest date after `afterDate` that still has an incomplete
        // milestone somewhere, or null if nothing is scheduled beyond it.
        function findNextGoalsDate(afterDate) {
            const candidates = new Set();
            goalsModeData.forEach(g => (g.milestones || []).forEach(ms => {
                if (!ms.completed && ms.date && ms.date > afterDate) candidates.add(ms.date);
            }));
            if (candidates.size === 0) return null;
            return Array.from(candidates).sort()[0];
        }

        function saveGoalsViewDateToFirebase() {
            WHEEL_DOC.set({ goalsViewDate: goalsViewDateOverride }, { merge: true })
                .then(() => setSyncStatus('synced'))
                .catch(err => {
                    console.error("Goals view-date save failed", err);
                    setSyncStatus('offline');
                });
        }

        // Called from the "Move to Next Day" button. Only ever advances
        // forward, skipping ahead to whatever date next has something
        // scheduled (so it doesn't stop on empty in-between days).
        function advanceGoalsDay() {
            const next = findNextGoalsDate(effectiveGoalsDate());
            if (!next) return;
            goalsViewDateOverride = next;
            saveGoalsViewDateToFirebase();
            allBooks = computeAllBooksForMode('goals');
            applyFilters();
        }

        function computeGoalsBooks() {
            const viewDate = effectiveGoalsDate();
            const result = [];
            readingBooks.forEach(book => {
                const matchingGoals = goalsModeData.filter(g => g.bookTitle === book.title);
                let todayMilestone = null;
                for (const goal of matchingGoals) {
                    const found = (goal.milestones || []).find(ms => ms.date === viewDate && !ms.completed);
                    if (found) { todayMilestone = found; break; }
                }
                if (todayMilestone) {
                    result.push({ ...book, goalLabel: todayMilestone.label });
                }
            });
            return result;
        }

        function computeAllBooksForMode(mode) {
            if (mode === 'tbr') return tbrBooks;
            if (mode === 'goals') return computeGoalsBooks();
            return readingBooks;
        }

        // ---- Sub-Goals (Goals mode only) ----------------------------------

        // Identifies a single goal instance (today's milestone for a given
        // book) so its sub-goal breakdown can be looked up/saved. Stable for
        // as long as that milestone label stays "today's" milestone; once
        // goals.html moves on to a new milestone, that's treated as a new
        // goal with its own (empty) sub-goal list.
        function subGoalKey(book) {
            return `${book.title || ''}|||${book.goalLabel || ''}`;
        }

        function getSubGoalEntry(book) {
            return subGoalsMap[subGoalKey(book)];
        }

        // Returns what should actually be shown on the wheel/list/winner
        // modal for this goal: the first not-yet-completed sub-goal if any
        // are defined, otherwise the original goal label.
        function getEffectiveGoalDisplay(book) {
            const entry = getSubGoalEntry(book);
            const items = entry && Array.isArray(entry.items) ? entry.items : [];
            if (items.length === 0) {
                return { text: book.goalLabel, isSubGoal: false };
            }
            const nextIndex = items.findIndex(i => !i.completed);
            if (nextIndex === -1) {
                return { text: book.goalLabel, isSubGoal: false, allDone: true };
            }
            const next = items[nextIndex];
            return {
                text: next.text,
                isSubGoal: true,
                subGoalId: next.id,
                key: subGoalKey(book),
                position: `${nextIndex + 1}/${items.length}`
            };
        }

        function openSubGoalEditor(book) {
            if (wheelMode !== 'goals') return;
            editingSubGoalKey = subGoalKey(book);
            editingSubGoalBookTitle = book.title || 'Untitled';
            editingSubGoalParentLabel = book.goalLabel || '';
            document.getElementById('subgoal-parent-label').textContent =
                `${editingSubGoalBookTitle}: ${editingSubGoalParentLabel}`;
            document.getElementById('subgoal-textarea').value = '';
            document.getElementById('subgoal-range-parts').value = '';
            document.getElementById('subgoal-chapter-start').value = '';
            document.getElementById('subgoal-chapter-end').value = '';
            document.getElementById('subgoal-chapter-parts').value = '';
            updateSubGoalChapterPageCount();
            subGoalDetected = parseGoalLabelForSplit(editingSubGoalParentLabel);
            applySubGoalDetectedUI();
            renderSubGoalEditorBody();
            document.getElementById('subgoal-modal').classList.add('active');
        }

        // ---- Smart goal-type detection ----
        //
        // goals.html always writes milestone labels in one of a few fixed
        // formats depending on how the goal was created there:
        //   "Page 12-16"        -> a page range (exact numbers, no input needed)
        //   "Percentage 20-40%" -> a percentage range (exact numbers, no input needed)
        //   "Chapter 9", or any free-text chapter name -> a chapter. Chapters
        //     (numbered or named) don't carry page numbers in their label, so
        //     both are treated identically: the user tells us the chapter's
        //     start/end page once, and we split by page from there.
        // We parse today's milestone label back into its exact numbers so the
        // sub-goal editor can skip asking for anything except what's actually
        // missing, and produce sub-ranges that add up perfectly to the
        // original goal (e.g. "Page 1-4" split 2 ways -> "Page 1-2" + "Page 3-4").
        let subGoalDetected = { type: 'chapter' };

        function parseGoalLabelForSplit(label) {
            if (!label) return { type: 'chapter' };
            let m = label.match(/^Page (\d+)-(\d+)$/);
            if (m) return { type: 'page', from: parseInt(m[1], 10), to: parseInt(m[2], 10) };
            m = label.match(/^Percentage (\d+)-(\d+)%$/);
            if (m) return { type: 'percent', from: parseInt(m[1], 10), to: parseInt(m[2], 10) };
            return { type: 'chapter' }; // covers "Chapter 9" and any free-text chapter name
        }

        // Splits the inclusive range [from, to] into `parts` contiguous,
        // (near-)equal-sized chunks (earlier chunks absorb the remainder),
        // formatting each chunk with fmt(start, end).
        function splitRangeIntoLabels(from, to, parts, fmt) {
            const total = to - from + 1;
            parts = Math.max(1, Math.min(parts, total));
            const base = Math.floor(total / parts);
            const remainder = total % parts;
            const labels = [];
            let cursor = from;
            for (let i = 0; i < parts; i++) {
                const size = base + (i < remainder ? 1 : 0);
                const start = cursor;
                const end = cursor + size - 1;
                labels.push(fmt(start, end));
                cursor = end + 1;
            }
            return labels;
        }

        // Live "X pages in this chapter" hint as the user fills in the
        // chapter's start/end page fields.
        function updateSubGoalChapterPageCount() {
            const start = parseInt(document.getElementById('subgoal-chapter-start').value, 10);
            const end = parseInt(document.getElementById('subgoal-chapter-end').value, 10);
            const el = document.getElementById('subgoal-chapter-pagecount');
            if (start && end && end >= start) {
                const count = end - start + 1;
                el.textContent = `${count} page${count === 1 ? '' : 's'} in this chapter.`;
            } else {
                el.textContent = '';
            }
        }

        // Shows/hides the right inputs and explains what was auto-detected.
        function applySubGoalDetectedUI() {
            const rangeWrap = document.getElementById('subgoal-range-inputs');
            const chapterWrap = document.getElementById('subgoal-chapter-inputs');
            const portionsWrap = document.getElementById('subgoal-portions-inputs');
            const infoEl = document.getElementById('subgoal-detected-info');
            const partsInput = document.getElementById('subgoal-range-parts');

            rangeWrap.style.display = 'none';
            chapterWrap.style.display = 'none';
            portionsWrap.style.display = 'none';

            if (subGoalDetected.type === 'page') {
                rangeWrap.style.display = 'flex';
                const span = subGoalDetected.to - subGoalDetected.from + 1;
                infoEl.textContent = `Detected pages ${subGoalDetected.from}-${subGoalDetected.to} (${span} pages). Just say how many pieces to split it into.`;
                partsInput.max = String(span);
            } else if (subGoalDetected.type === 'percent') {
                rangeWrap.style.display = 'flex';
                const span = subGoalDetected.to - subGoalDetected.from + 1;
                infoEl.textContent = `Detected ${subGoalDetected.from}-${subGoalDetected.to}%. Just say how many pieces to split it into.`;
                partsInput.max = String(span);
            } else {
                chapterWrap.style.display = 'flex';
                infoEl.textContent = `Chapter goal — enter its start and end page, then how many pieces to split it into.`;
            }
        }

        function closeSubGoalEditor() {
            document.getElementById('subgoal-modal').classList.remove('active');
            editingSubGoalKey = null;
        }

        // Intercepts clicks on the Cancel button or outside the editor to check for unsaved input
        function requestCloseSubGoalEditor() {
            if (hasUnsavedSubGoalInput()) {
                if (!confirm('You have unsaved sub-goals or inputs in progress. Are you sure you want to cancel?')) {
                    return;
                }
            }
            closeSubGoalEditor();
        }

        // Checks if the user has typed or entered sub-goal data in the current form that hasn't been added yet
        function hasUnsavedSubGoalInput() {
            if (subGoalDetected.type === 'page' || subGoalDetected.type === 'percent') {
                const parts = document.getElementById('subgoal-range-parts').value.trim();
                if (parts !== '') return true;
            } else {
                const start = document.getElementById('subgoal-chapter-start').value.trim();
                const end = document.getElementById('subgoal-chapter-end').value.trim();
                const parts = document.getElementById('subgoal-chapter-parts').value.trim();
                if (start !== '' || end !== '' || parts !== '') return true;
            }
            return false;
        }

        function renderSubGoalEditorBody() {
            if (!editingSubGoalKey) return;
            const listEl = document.getElementById('subgoal-list');
            const entry = subGoalsMap[editingSubGoalKey];
            const items = entry && Array.isArray(entry.items) ? entry.items : [];
            listEl.innerHTML = '';

            if (items.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'subgoal-empty-hint';
                hint.textContent = 'No sub-goals yet — add some below and the wheel will hand them out one at a time.';
                listEl.appendChild(hint);
                return;
            }

            const nextIndex = items.findIndex(i => !i.completed);
            items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'subgoal-row' + (item.completed ? ' completed' : '') + (idx === nextIndex ? ' up-next' : '');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !!item.completed;
                checkbox.addEventListener('change', () => toggleSubGoalItem(item.id));
                row.appendChild(checkbox);

                const text = document.createElement('div');
                text.className = 'subgoal-row-text';
                text.textContent = item.text;
                row.appendChild(text);

                if (idx === nextIndex) {
                    const tag = document.createElement('span');
                    tag.className = 'subgoal-row-next-tag';
                    tag.textContent = 'Up next';
                    row.appendChild(tag);
                }

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'subgoal-row-delete';
                del.textContent = '×';
                del.title = 'Delete';
                del.addEventListener('click', () => deleteSubGoalItem(item.id));
                row.appendChild(del);

                listEl.appendChild(row);
            });
        }

        function ensureEditingEntry() {
            if (!subGoalsMap[editingSubGoalKey]) {
                subGoalsMap[editingSubGoalKey] = {
                    parentLabel: editingSubGoalParentLabel,
                    bookTitle: editingSubGoalBookTitle,
                    items: []
                };
            }
            return subGoalsMap[editingSubGoalKey];
        }

        // Builds the sub-goal text checkpoints for whichever split mode is
        // currently selected. 'pages'/'percent' auto-generate evenly spaced
        // checkpoints; 'portions' just reads the free-text textarea.
        function generateSubGoalTextsForCurrentMode() {
            const info = subGoalDetected;

            if (info.type === 'page') {
                const parts = parseInt(document.getElementById('subgoal-range-parts').value, 10);
                if (!parts || parts < 1) return [];
                return splitRangeIntoLabels(info.from, info.to, parts,
                    (s, e) => s === e ? `Page ${s}` : `Page ${s}-${e}`);
            }
            if (info.type === 'percent') {
                const parts = parseInt(document.getElementById('subgoal-range-parts').value, 10);
                if (!parts || parts < 1) return [];
                return splitRangeIntoLabels(info.from, info.to, parts,
                    (s, e) => s === e ? `${s}%` : `${s}-${e}%`);
            }
            // Chapter (numbered or named): split by the page range the user gave us.
            const start = parseInt(document.getElementById('subgoal-chapter-start').value, 10);
            const end = parseInt(document.getElementById('subgoal-chapter-end').value, 10);
            const parts = parseInt(document.getElementById('subgoal-chapter-parts').value, 10);
            if (!start || !end || end < start || !parts || parts < 1) return [];
            return splitRangeIntoLabels(start, end, parts,
                (s, e) => s === e ? `Page ${s}` : `Page ${s}-${e}`);
        }

        // Called from the "Add" button: generates the sub-goals for the
        // current split mode, adds them to the list, saves, then closes
        // the popup.
        function handleAddSubGoals() {
            if (!editingSubGoalKey) { closeSubGoalEditor(); return; }
            const texts = generateSubGoalTextsForCurrentMode();
            if (texts.length > 0) {
                const entry = ensureEditingEntry();
                texts.forEach(text => {
                    entry.items.push({
                        id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                        text,
                        completed: false
                    });
                });
                saveSubGoalsToFirebase();
            }
            closeSubGoalEditor();
        }

        function toggleSubGoalItem(id) {
            const entry = subGoalsMap[editingSubGoalKey];
            if (!entry) return;
            const item = entry.items.find(i => i.id === id);
            if (!item) return;
            item.completed = !item.completed;
            renderSubGoalEditorBody();
            saveSubGoalsToFirebase();
        }

        function deleteSubGoalItem(id) {
            const entry = subGoalsMap[editingSubGoalKey];
            if (!entry) return;
            entry.items = entry.items.filter(i => i.id !== id);
            renderSubGoalEditorBody();
            saveSubGoalsToFirebase();
        }

        function clearSubGoalList() {
            if (!editingSubGoalKey || !subGoalsMap[editingSubGoalKey]) return;
            if (!confirm('Clear the entire sub-goal list for this goal?')) return;
            subGoalsMap[editingSubGoalKey].items = [];
            renderSubGoalEditorBody();
            saveSubGoalsToFirebase();
        }

        // Marks the whole parent goal (not just a sub-goal piece of it) as
        // done. This writes straight to SHARED_DOC — the same doc/field
        // goals.html itself uses (data.goalsMode) — so the milestone shows
        // as completed there too, exactly as if it had been checked off in
        // goals.html directly. Any leftover sub-goals for it are cleared
        // since there's nothing left to hand out from the wheel.
        function markEntireGoalComplete() {
            if (!editingSubGoalKey) return;
            const viewDate = effectiveGoalsDate();
            const goal = goalsModeData.find(g => g.bookTitle === editingSubGoalBookTitle &&
                (g.milestones || []).some(ms => ms.label === editingSubGoalParentLabel && ms.date === viewDate && !ms.completed));
            if (!goal) {
                alert("Couldn't find this goal to mark complete — it may have already been finished elsewhere.");
                closeSubGoalEditor();
                return;
            }
            if (!confirm(`Mark "${editingSubGoalParentLabel}" as complete? This will also mark it done in goals.html.`)) return;

            const ms = goal.milestones.find(m => m.label === editingSubGoalParentLabel && m.date === viewDate && !m.completed);
            if (ms) ms.completed = true;

            SHARED_DOC.set({ goalsMode: goalsModeData }, { merge: true })
                .then(() => setSyncStatus('synced'))
                .catch(err => {
                    console.error("Mark goal complete failed", err);
                    setSyncStatus('offline');
                });

            // Clear any sub-goal breakdown for this now-finished goal.
            delete subGoalsMap[editingSubGoalKey];
            saveSubGoalsToFirebase();

            closeSubGoalEditor();
            allBooks = computeAllBooksForMode('goals');
            applyFilters();
        }

        // Persists the whole sub-goals map to WHEEL_DOC (never SHARED_DOC),
        // so goals.html never sees this data, but any device signed into
        // this same profile picks it up via the WHEEL_DOC listener above.
        let retrySubGoalsSaveListenerAttached = false;
        function retrySubGoalsSaveWhenOnline() {
            if (retrySubGoalsSaveListenerAttached) return;
            retrySubGoalsSaveListenerAttached = true;
            window.addEventListener('online', () => {
                retrySubGoalsSaveListenerAttached = false;
                saveSubGoalsToFirebase();
            }, { once: true });
        }

        function saveSubGoalsToFirebase() {
            WHEEL_DOC.set({ subGoals: subGoalsMap }, { merge: true })
                .then(() => setSyncStatus('synced'))
                .catch(err => {
                    console.error("Sub-goals save failed", err);
                    setSyncStatus('offline');
                    retrySubGoalsSaveWhenOnline();
                });
            if (wheelMode === 'goals') applyFilters();
        }

        // Called from the "✓ Mark Sub-Goal Done" button on the winner modal.
        // Marks the sub-goal that was just spun as completed, saves it, and
        // closes the popup.
        function markWinnerSubGoalDone() {
            if (!currentWinnerSubGoal) { closeWinnerModal(); return; }
            const entry = subGoalsMap[currentWinnerSubGoal.key];
            const item = entry && entry.items.find(i => i.id === currentWinnerSubGoal.id);
            if (item) {
                item.completed = true;
                saveSubGoalsToFirebase();
            }
            closeWinnerModal();
        }

        // Real-time synchronization with Index app.
        // Keeps "Currently reading" books, the Wishlist (TBR), and Goals
        // Mode's milestone data (data.goalsMode, written by goals.html) all
        // in sync, and switches the active list based on wheelMode. Because
        // goalsMode lives on this same shared doc, a milestone checked off in
        // goals.html — on this device or another — pushes a live update here
        // too, with no separate listener needed.
        SHARED_DOC.onSnapshot((snap) => {
            if (snap.exists) {
                const data = snap.data();
                readingBooks = Array.isArray(data.books) ? data.books.filter(book => book.status === 'reading') : [];
                tbrBooks = Array.isArray(data.wishlist) ? data.wishlist : [];
                goalsModeData = Array.isArray(data.goalsMode) ? data.goalsMode : [];
                allBooks = computeAllBooksForMode(wheelMode);
                updateFilterOptions();
                applyFilters();
            }
        });

        function setWheelMode(mode) {
            if (mode !== 'reading' && mode !== 'tbr' && mode !== 'goals') return;
            wheelMode = mode;
            localStorage.setItem('shelf:wheelMode', mode);
            document.getElementById('mode-reading-btn').classList.toggle('active', mode === 'reading');
            document.getElementById('mode-goals-btn').classList.toggle('active', mode === 'goals');
            document.getElementById('mode-tbr-btn').classList.toggle('active', mode === 'tbr');
            allBooks = computeAllBooksForMode(mode);
            deselectedGenres.clear();
            deselectedFormats.clear();
            updateFilterOptions();
            applyFilters();
        }

        // Shows/hides the "Move to Next Day" bar above the goals list. Only
        // relevant in Goals mode, and only actionable once every goal
        // scheduled for the day currently being viewed is done (or there was
        // nothing scheduled for it at all) *and* there's a future date with
        // something still incomplete to move on to.
        function updateGoalsNextDayBar() {
            const bar = document.getElementById('goals-next-day-bar');
            if (wheelMode !== 'goals') {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            const viewDate = effectiveGoalsDate();
            const dayIsClear = allBooks.length === 0; // computeGoalsBooks() already excludes done/no-milestone books
            const next = findNextGoalsDate(viewDate);

            if (!dayIsClear || !next) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            const nextLabel = formatShortDate(next);
            bar.style.display = 'flex';
            bar.className = 'goals-next-day-bar';
            bar.innerHTML = `
                <span>🎉 All done${viewDate === todayLocalDateStr() ? ' for today' : ''} — ready to move on?</span>
                <button type="button" class="goals-next-day-btn" onclick="advanceGoalsDay()">Move to ${nextLabel} →</button>
            `;
        }

        function formatShortDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const todayStr = todayLocalDateStr();
            if (dateStr === todayStr) return 'Today';
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            if (dateStr === toLocalDateStr_(tomorrow)) return 'Tomorrow';
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // Local helper (same logic as todayLocalDateStr but for an arbitrary
        // Date object) used only by formatShortDate's "Tomorrow" check.
        function toLocalDateStr_(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function applyFilters() {
            filteredBooks = allBooks.filter(book => {
                const genreVal = book.genre || '__none__';
                const formatVal = book.format || '__none__';
                return !deselectedGenres.has(genreVal) && !deselectedFormats.has(formatVal);
            });

            updateBooksListUI();
            drawWheel();
        }

        function updateBooksListUI() {
            const container = document.getElementById('books-container');
            const titleElem = document.getElementById('books-count-title');
            const viewingLabel = document.getElementById('goals-viewing-date-label');
            const modeLabel = wheelMode === 'tbr' ? 'TBR Books' : wheelMode === 'goals' ? "Today's Goals" : 'Currently Reading';
            titleElem.innerText = `${modeLabel} on Wheel (${filteredBooks.length})`;

            if (wheelMode === 'goals') {
                const viewDate = effectiveGoalsDate();
                if (viewDate !== todayLocalDateStr()) {
                    viewingLabel.textContent = `📅 Viewing: ${formatShortDate(viewDate)}`;
                    viewingLabel.style.display = 'block';
                } else {
                    viewingLabel.style.display = 'none';
                }
            } else {
                viewingLabel.style.display = 'none';
            }

            updateGoalsNextDayBar();

            if (filteredBooks.length === 0) {
                container.innerHTML = wheelMode === 'goals'
                    ? `<div class="empty-state">No goal milestones scheduled for ${effectiveGoalsDate() === todayLocalDateStr() ? 'today' : 'this day'}.</div>`
                    : `<div class="empty-state">No books match your current filters.</div>`;
                return;
            }

            container.innerHTML = '';
            filteredBooks.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-item-card';

                let titleText = book.title || 'Untitled';
                let subGoalBadgeText = null;
                if (wheelMode === 'goals' && book.goalLabel) {
                    const display = getEffectiveGoalDisplay(book);
                    titleText = `${book.title || 'Untitled'}: ${display.text}`;
                    if (display.isSubGoal) {
                        subGoalBadgeText = `Sub-goal ${display.position}`;
                        card.classList.add('has-subgoals');
                    } else if (display.allDone) {
                        subGoalBadgeText = 'All sub-goals done 🎉';
                        card.classList.add('has-subgoals');
                    }
                }

                const titleEl = document.createElement('div');
                titleEl.className = 'book-item-title';
                titleEl.textContent = titleText;
                card.appendChild(titleEl);

                const authorEl = document.createElement('div');
                authorEl.className = 'book-item-author';
                authorEl.textContent = book.author || 'Unknown Author';
                card.appendChild(authorEl);

                if (subGoalBadgeText) {
                    const badgeEl = document.createElement('div');
                    badgeEl.className = 'book-item-subgoal-badge';
                    badgeEl.textContent = subGoalBadgeText;
                    card.appendChild(badgeEl);
                }

                // Goals mode only: double-click a goal to split it into a
                // sequential list of sub-goals. Never wired up in
                // reading/TBR mode.
                if (wheelMode === 'goals' && book.goalLabel) {
                    card.title = 'Double-click to split into sub-goals';
                    card.addEventListener('dblclick', () => openSubGoalEditor(book));
                }

                container.appendChild(card);
            });
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2, cy = canvas.height / 2, radius = cx - 10;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (filteredBooks.length === 0) {
                ctx.fillStyle = '#f9f9f9';
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#e0dcd3';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#888888';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText("No Books Found", cx, cy);
                return;
            }

            const sliceAngle = (2 * Math.PI) / filteredBooks.length;
            const pastelColors = ['#e2f0cb', '#bffcc6', '#fff9a6', '#ffc6ff', '#c7ceea', '#ffb7b2', '#ffdac1'];
            
            filteredBooks.forEach((book, index) => {
                const startAngle = index * sliceAngle;
                ctx.beginPath(); 
                ctx.moveTo(cx, cy); 
                ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
                ctx.fillStyle = pastelColors[index % pastelColors.length]; 
                ctx.fill(); 
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save(); 
                ctx.translate(cx, cy); 
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right'; 
                ctx.fillStyle = '#444e37'; 
                ctx.font = 'bold 11px sans-serif';
                
                let displayText = (wheelMode === 'goals' && book.goalLabel)
                    ? `${book.title || 'Untitled'}: ${getEffectiveGoalDisplay(book).text}`
                    : (book.title || 'Untitled');
                if (displayText.length > 22) displayText = displayText.substring(0, 20) + '...';
                ctx.fillText(displayText, radius - 15, 4);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (filteredBooks.length === 0 || isSpinning) return;
            isSpinning = true;

            const n = filteredBooks.length;
            const sliceAngle = 360 / n;
            
            const winningIndex = Math.floor(Math.random() * n);
            const targetSliceCenter = (winningIndex * sliceAngle) + (sliceAngle / 2);
            const extraSpins = 360 * 5;
            
            const desiredStopAngle = 270 - targetSliceCenter;
            const normalizedCurrent = currentRotation % 360;
            let delta = desiredStopAngle - normalizedCurrent;
            while (delta < 0) delta += 360;

            currentRotation += extraSpins + delta;
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                showWinningBook(filteredBooks[winningIndex]);
            }, 4000);
        }

        // Same as spinWheel(), but also counts as one of the "spins left"
        // from the small wheel's spin count, decreasing it by one.
        function spinWheelUseSpin() {
            if (currentSpins <= 0) return;
            spinWheel();
            decreaseSpins();
        }

        function showWinningBook(book) {
            document.getElementById('winner-title').innerText = book.title || 'Untitled';
            document.getElementById('winner-author').innerText = book.author || 'Unknown Author';
            const goalEl = document.getElementById('winner-goal');
            const doneBtn = document.getElementById('winner-subgoal-done-btn');
            currentWinnerSubGoal = null;
            if (wheelMode === 'goals' && book.goalLabel) {
                const display = getEffectiveGoalDisplay(book);
                goalEl.innerText = display.text;
                goalEl.style.display = '';
                if (display.isSubGoal) {
                    currentWinnerSubGoal = { key: display.key, id: display.subGoalId };
                    doneBtn.style.display = '';
                } else {
                    doneBtn.style.display = 'none';
                }
            } else {
                goalEl.style.display = 'none';
                doneBtn.style.display = 'none';
            }
            document.getElementById('winner-modal').classList.add('active');
            fireConfetti();
        }

        function closeWinnerModal() {
            document.getElementById('winner-modal').classList.remove('active');
            document.getElementById('winner-subgoal-done-btn').style.display = 'none';
            currentWinnerSubGoal = null;
        }

        function drawSmallWheel() {
            const canvas = document.getElementById('small-wheel');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2, cy = canvas.height / 2, radius = cx - 3;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const isUltra = document.getElementById('energy-level').value === 'Ultra';
            const slices = isUltra ? 20 : 5;
            const sliceAngle = (2 * Math.PI) / slices;
            const normalColors = ['#ffdac1', '#ffb7b2', '#c7ceea', '#bffcc6', '#fff9a6'];
            const ultraColors = [
                '#a259ff','#b76aff','#ff6b6b','#ff8e53','#ffd700',
                '#c3f584','#5efce8','#74b9ff','#fd79a8','#a29bfe',
                '#55efc4','#fdcb6e','#e17055','#d63031','#6c5ce7',
                '#00b894','#0984e3','#e84393','#fab1a0','#81ecec'
            ];
            const colors = isUltra ? ultraColors : normalColors;

            for (let i = 0; i < slices; i++) {
                const startAngle = i * sliceAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = isUltra ? 1 : 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = isUltra ? '#222' : '#444e37';
                ctx.font = isUltra ? 'bold 9px Arial' : 'bold 14px Arial';
                ctx.fillText((i + 1).toString(), radius - (isUltra ? 5 : 12), isUltra ? 3 : 5);
                ctx.restore();
            }
        }

        function setEnergyLevel(level) {
            document.getElementById('energy-level').value = level;
            const buttons = document.querySelectorAll('#energy-level-toggle button[type="button"]');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim().toUpperCase() === level.toUpperCase() || (btn.textContent.includes('ULTRA') && level === 'Ultra')) {
                    btn.classList.add('active');
                }
            });
            drawSmallWheel();
        }

        function unlockUltra(e) {
            e.preventDefault();
            e.stopPropagation();
            const ultraBtn = document.getElementById('ultra-btn');
            if (ultraBtn.style.display === 'none') {
                ultraBtn.style.display = '';
                ultraBtn.animate([
                    { opacity: 0, transform: 'scale(0.7)' },
                    { opacity: 1, transform: 'scale(1.08)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 400, easing: 'ease-out' });
            }
        }

        function lockUltra(e) {
            e.preventDefault();
            e.stopPropagation();
            const ultraBtn = document.getElementById('ultra-btn');
            ultraBtn.animate([
                { opacity: 1, transform: 'scale(1)' },
                { opacity: 0, transform: 'scale(0.7)' }
            ], { duration: 300, easing: 'ease-in' }).onfinish = () => {
                ultraBtn.style.display = 'none';
                if (document.getElementById('energy-level').value === 'Ultra') {
                    setEnergyLevel('Energized');
                }
            };
        }

        function spinSmallWheel() {
            const energy = document.getElementById('energy-level').value;
            let rand = Math.random() * 100;
            let result = 1;
            let slices = energy === 'Ultra' ? 20 : 5;

            if (energy === 'Ultra') {
                result = Math.floor(Math.random() * 20) + 1;
            } else if (energy === 'Tired') {
                result = rand < 25 ? 1 : rand < 50 ? 2 : rand < 65 ? 3 : rand < 80 ? 4 : 5;
            } else if (energy === 'Normal') {
                result = rand < 10 ? 1 : rand < 20 ? 2 : rand < 45 ? 3 : rand < 70 ? 4 : 5;
            } else {
                result = rand < 5 ? 1 : rand < 10 ? 2 : rand < 50 ? 3 : rand < 75 ? 4 : 5;
            }

            const targetIndex = result - 1;
            const sliceAngle = 360 / slices;
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.6);
            const stopAngle = (targetIndex * sliceAngle) + (sliceAngle / 2) + randomOffset;

            smallWheelRotation += (360 * 5) + (270 - stopAngle) - (smallWheelRotation % 360);
            document.getElementById('small-wheel').style.transform = `rotate(${smallWheelRotation}deg)`;
            document.getElementById('small-wheel-result').innerText = "Rolling...";
            document.getElementById('done-btn').style.display = 'none';

            setTimeout(() => {
                currentSpins = result;
                updateSpinsUI();
                saveSpinsToFirebase();
            }, 1500);
        }

        function decreaseSpins() {
            if (currentSpins > 0) {
                currentSpins--;
                if (currentSpins === 0) {
                    completeSmallWheel();
                } else {
                    updateSpinsUI();
                    saveSpinsToFirebase();
                }
            }
        }

        function updateOneDownButtonVisibility() {
            const oneDownBtn = document.getElementById('one-down-btn');
            oneDownBtn.style.display = currentSpins > 1 ? 'inline-block' : 'none';
        }

        // Reflects currentSpins in the UI. Shared by every path that changes
        // currentSpins (spin result, decrease, manual edit, cross-device sync)
        // so the "spins left" text and buttons never drift out of sync.
        function updateSpinsUI() {
            const resultElem = document.getElementById('small-wheel-result');
            const doneBtn = document.getElementById('done-btn');
            if (currentSpins > 0) {
                resultElem.innerText = `Spins left: ${currentSpins}`;
                doneBtn.style.display = 'inline-block';
                updateOneDownButtonVisibility();
            } else {
                resultElem.innerText = '';
                doneBtn.style.display = 'none';
                document.getElementById('one-down-btn').style.display = 'none';
            }
            document.getElementById('spin-use-spin-btn').style.display = currentSpins > 0 ? 'inline-block' : 'none';
            document.getElementById('spin-wheel-btn').innerText = currentSpins > 0 ? 'Spin Wheel' : 'Spin Wheel for Next Read!';
            document.getElementById('spin-use-spin-btn').innerText = 'Spin & 1 down';
        }

        // Reflects whether the count is actually synced to Firestore (so
        // other devices on the same profile will see it) or only cached on
        // this device because the last write/read failed.
        function setSyncStatus(state) {
            const el = document.getElementById('spins-sync-status');
            if (!el) return;
            clearTimeout(setSyncStatus._fadeTimer);
            if (state === 'offline') {
                el.textContent = '⚠ Saved on this device only — will retry sync';
                el.style.color = '#c97b7b';
            } else {
                // 'saving' and 'synced' are the happy path - stay silent.
                el.textContent = '';
            }
        }

        // Persists currentSpins to Firestore, keyed per-profile, so any
        // device signed into the same profile picks up right where it left off.
        function saveSpinsToFirebase() {
            // Always mirror to localStorage, even if this particular change
            // originated from a remote snapshot, so the cache never drifts
            // from the last known-good value.
            try {
                localStorage.setItem(SPINS_CACHE_KEY, String(currentSpins));
            } catch (err) {
                console.error("Wheel spins local cache write failed", err);
            }

            if (suppressNextSpinsSave) {
                suppressNextSpinsSave = false;
                return;
            }

            setSyncStatus('saving');
            WHEEL_DOC.set({ currentSpins }, { merge: true })
                .then(() => setSyncStatus('synced'))
                .catch(err => {
                    console.error("Wheel spins save failed", err);
                    setSyncStatus('offline');
                    retrySpinsSaveWhenOnline();
                });
        }

        // If a save fails (e.g. device briefly offline), retry once the
        // browser reports it's back online, so other devices still end up
        // with the right count without the user having to do anything.
        let retrySpinsSaveListenerAttached = false;
        function retrySpinsSaveWhenOnline() {
            if (retrySpinsSaveListenerAttached) return;
            retrySpinsSaveListenerAttached = true;
            window.addEventListener('online', () => {
                retrySpinsSaveListenerAttached = false;
                saveSpinsToFirebase();
            }, { once: true });
        }

        // Reads the last locally-cached spin count, if any. Returns null if
        // nothing has been cached yet for this profile.
        function loadCachedSpins() {
            try {
                const raw = localStorage.getItem(SPINS_CACHE_KEY);
                if (raw === null) return null;
                const val = parseInt(raw, 10);
                return isNaN(val) ? null : val;
            } catch (err) {
                console.error("Wheel spins local cache read failed", err);
                return null;
            }
        }

        // Cross-device sync: whenever the stored spin count changes (e.g. set
        // from another device/profile session), reflect it here too.
        WHEEL_DOC.onSnapshot((snap) => {
            if (snap.exists) {
                const data = snap.data();
                if (typeof data.currentSpins === 'number' && data.currentSpins !== currentSpins) {
                    suppressNextSpinsSave = true;
                    currentSpins = data.currentSpins;
                    updateSpinsUI();
                    try {
                        localStorage.setItem(SPINS_CACHE_KEY, String(currentSpins));
                    } catch (err) {
                        console.error("Wheel spins local cache write failed", err);
                    }
                }

                // Sub-goals live on this same doc so they sync cross-device
                // without ever touching SHARED_DOC (goals.html stays unaware
                // of them). Pick up remote edits (e.g. marked done on phone).
                subGoalsMap = (data.subGoals && typeof data.subGoals === 'object') ? data.subGoals : {};

                // "Move to next day" override — also wheel-only, same reason:
                // pick up a device-to-device change (e.g. advanced on phone).
                goalsViewDateOverride = typeof data.goalsViewDate === 'string' ? data.goalsViewDate : null;

                if (wheelMode === 'goals') {
                    allBooks = computeAllBooksForMode('goals');
                    applyFilters();
                }
                if (document.getElementById('subgoal-modal').classList.contains('active')) {
                    renderSubGoalEditorBody();
                }

                // A snapshot successfully arrived at all, whether or not the
                // value changed, so we know Firestore is reachable right now.
                setSyncStatus('synced');
            }
        }, (err) => {
            // Firestore read failed (offline, blocked, permissions, etc).
            // Don't fail silently - at least the local cache in window.onload
            // will have already restored the last known count.
            console.error("Wheel spins listener failed:", err);
            setSyncStatus('offline');
        });

        // Triple-click on the "Spins left" text to manually edit the count.
        // Intentionally no visual hint that this is possible.
        let spinsResultClickCount = 0;
        let spinsResultClickTimer = null;
        function handleSpinsResultClick() {
            spinsResultClickCount++;
            clearTimeout(spinsResultClickTimer);
            spinsResultClickTimer = setTimeout(() => { spinsResultClickCount = 0; }, 500);
            if (spinsResultClickCount === 3) {
                spinsResultClickCount = 0;
                enableManualSpinsEdit();
            }
        }

        function enableManualSpinsEdit() {
            const el = document.getElementById('small-wheel-result');
            const input = document.createElement('input');
            input.type = 'number';
            input.value = currentSpins;
            input.style.cssText = 'width:60px;text-align:center;font:inherit;font-weight:inherit;color:inherit;background:transparent;border:none;outline:none;padding:0;margin:0;';
            input.addEventListener('blur', commitManualSpinsEdit);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
            el.innerHTML = '';
            el.appendChild(input);
            input.focus();
            input.select();
        }

        function commitManualSpinsEdit(e) {
            const val = parseInt(e.target.value, 10);
            currentSpins = (isNaN(val) || val < 0) ? 0 : val;
            updateSpinsUI();
            saveSpinsToFirebase();
        }

        const spinsCompleteMessages = [
            "🎉 All done! You earned it!",
            "✨ Spins complete — great job!",
            "🥳 That's a wrap! Well spun!",
            "📚 Nailed it! On to the next read!",
            "🌟 Amazing! All spins finished!",
            "🎊 Woohoo! You did it!",
            "💫 Fantastic! Spins all used up!"
        ];

        function completeSmallWheel() {
            currentSpins = 0;
            updateSpinsUI();
            saveSpinsToFirebase();
            showSpinsCongrats();
        }

        function showSpinsCongrats() {
            const message = spinsCompleteMessages[Math.floor(Math.random() * spinsCompleteMessages.length)];
            document.getElementById('congrats-message').innerText = message;
            document.getElementById('congrats-modal').classList.add('active');
            fireConfetti();
        }

        function closeCongratsModal() {
            document.getElementById('congrats-modal').classList.remove('active');
        }

        function fireConfetti() {
            const colors = ['#e2f0cb', '#bffcc6', '#fff9a6', '#ffc6ff', '#c7ceea'];
            for (let i = 0; i < 60; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti-piece';
                conf.style.left = (Math.random() * window.innerWidth) + 'px';
                conf.style.top = -10 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(conf);

                let startY = -20;
                let startX = parseFloat(conf.style.left);
                let speedY = Math.random() * 3 + 2;
                let speedX = (Math.random() - 0.5) * 4;
                let rot = Math.random() * 360;

                const anim = setInterval(() => {
                    startY += speedY;
                    startX += speedX;
                    rot += 5;
                    conf.style.top = startY + 'px';
                    conf.style.left = startX + 'px';
                    conf.style.transform = `rotate(${rot}deg)`;
                    if (startY > window.innerHeight) {
                        clearInterval(anim);
                        conf.remove();
                    }
                }, 16);
            }
        }

        window.onload = () => {
            document.getElementById('mode-reading-btn').classList.toggle('active', wheelMode === 'reading');
            document.getElementById('mode-goals-btn').classList.toggle('active', wheelMode === 'goals');
            document.getElementById('mode-tbr-btn').classList.toggle('active', wheelMode === 'tbr');
            updateFilterOptions();
            applyFilters();
            drawSmallWheel();

            // Show the last known spin count right away instead of leaving
            // the panel blank while Firestore's onSnapshot round trip is
            // still in flight (or failing silently).
            const cachedSpins = loadCachedSpins();
            if (cachedSpins !== null) {
                currentSpins = cachedSpins;
                updateSpinsUI();
            }

            document.getElementById('small-wheel-result').addEventListener('click', handleSpinsResultClick);
        };
    </script>
</body>
</html>
