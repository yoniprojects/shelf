<script>
/* ==================================================================
   SPLITTER — in-app tool to break one very large audio file into
   several smaller ones, entirely on-device.

   Why this exists: iOS Safari's <audio>/blob-URL playback path has a
   real ceiling on very large single files (see the loadedmetadata/
   stall workarounds elsewhere in this file) — an 8+ hour audiobook in
   one file is squarely in the zone that trips it. Splitting into
   several ~2 hour parts sidesteps the whole problem, and this app
   already natively supports multi-file books (the "ripped CD folder"
   path — matches.mode:'multi'), so split parts slot right back in as
   one continuous book.

   How it works: loads ffmpeg.wasm (only when this tool is opened —
   never on normal app boot) and uses stream-copy (-c copy), which
   repackages the existing audio data into new files without decoding
   or re-encoding it. That keeps quality identical, keeps the split
   fast, and avoids ever holding fully-decoded PCM in memory (an 8hr
   file as raw PCM would be multiple GB — plenty to crash an iOS tab
   on its own). The one file still has to be loaded into ffmpeg's
   in-memory filesystem once to do this, so it's not free, but it's a
   single one-time pass rather than what playback was doing.

   ffmpeg.wasm needs an internet connection the first time it's used
   per session (to fetch the ~25MB core from a CDN); after that it's
   cached for the rest of the tab's lifetime.
================================================================== */
let ffmpegInstance = null;
async function loadFfmpegEngine(onLog){
  if (ffmpegInstance) return ffmpegInstance;
  // Safari/WKWebView never expose real SharedArrayBuffer outside a
  // cross-origin-isolated page (COOP/COEP headers), which isn't possible
  // here. ffmpeg.wasm references SharedArrayBuffer directly even in its
  // single-thread core, causing a bare "Can't find variable" ReferenceError
  // rather than a graceful fallback. We only ever use the single-thread
  // core (no real multithreading), so aliasing it to ArrayBuffer is enough
  // to satisfy the reference.
  if (typeof window.SharedArrayBuffer === 'undefined') {
    window.SharedArrayBuffer = window.ArrayBuffer;
  }
  await new Promise((resolve, reject) => {
    if (window.FFmpeg) return resolve();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load the splitting engine. Check your internet connection and try again.'));
    document.head.appendChild(s);
  });
  const { createFFmpeg } = window.FFmpeg;
  const ffmpeg = createFFmpeg({
    log: false,
    corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
    logger: onLog || (()=>{}),
  });
  await ffmpeg.load();
  ffmpegInstance = ffmpeg;
  return ffmpeg;
}

// Parses ffmpeg's own stderr banner ("Duration: 08:12:33.44, ...") instead of
// probing with an off-DOM Audio() element — that's the exact technique that
// silently hangs on large files on mobile Safari (see ensureDurationsKnown's
// comment above), so it's worth avoiding here too even though this code path
// isn't iOS-exclusive.
function parseDurationFromLog(msg){
  const m = /Duration:\s*(\d+):(\d\d):(\d\d)\.(\d+)/.exec(msg);
  if (!m) return null;
  return (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/100;
}

function splitterPartName(originalName, i, total){
  const dot = originalName.lastIndexOf('.');
  const base = dot > 0 ? originalName.slice(0, dot) : originalName;
  const ext = dot > 0 ? originalName.slice(dot) : '';
  const num = String(i+1).padStart(total >= 10 ? 2 : 1, '0');
  return `${base} - Part ${num}${ext}`;
}

function pickSplitterFile(){
  document.getElementById('splitterFileInput').click();
}
function handleSplitterFile(file){
  if (!file) return;
  if (!isAudioFile(file.name)){ toast('That doesn\'t look like an audio file.'); return; }
  state.splitter.file = file;
  state.splitter.status = 'idle';
  state.splitter.parts = [];
  render();
}

async function runSplit(){
  const sp = state.splitter;
  if (!sp.file || sp.status === 'loading-engine' || sp.status === 'probing' || sp.status === 'splitting') return;
  sp.parts = [];
  sp.progressPct = 0;
  try{
    sp.status = 'loading-engine';
    sp.statusText = 'Loading splitting engine (first time only, needs internet)…';
    render();
    let duration = null;
    const ffmpeg = await loadFfmpegEngine((e) => {
      if (duration == null){
        const d = parseDurationFromLog(e.message || '');
        if (d) duration = d;
      }
    });

    sp.status = 'probing';
    sp.statusText = 'Reading file…';
    render();
    const { fetchFile } = window.FFmpeg;
    const inputName = 'input' + (extOf(sp.file.name) ? '.'+extOf(sp.file.name) : '');
    ffmpeg.FS('writeFile', inputName, await fetchFile(sp.file));

    // A quick, cheap no-output run just to make ffmpeg print the Duration:
    // line into the logger above. -t 0.001 keeps it near-instant.
    if (duration == null){
      try{ await ffmpeg.run('-i', inputName, '-t', '0.001', '-f', 'null', '-'); } catch(e){}
    }
    if (!duration || !isFinite(duration) || duration <= 0){
      throw new Error("Couldn't read this file's length. It may be corrupted or an unsupported format.");
    }

    const targetSec = Math.max(0.25, Number(sp.targetHours)||2) * 3600;
    const numParts = Math.max(1, Math.round(duration / targetSec));
    const partLen = duration / numParts;

    if (numParts <= 1){
      sp.status = 'error';
      sp.statusText = `This file is only ${fmtHMS(duration)} long — shorter than your target part length, so there's nothing to split. Try a smaller target length if you still want to break it up.`;
      render();
      return;
    }

    const results = [];
    for (let i=0;i<numParts;i++){
      sp.status = 'splitting';
      sp.statusText = `Splitting part ${i+1} of ${numParts}…`;
      sp.progressPct = Math.round((i/numParts)*100);
      render();

      const start = i*partLen;
      const outName = 'out' + i + (extOf(sp.file.name) ? '.'+extOf(sp.file.name) : '');
      const args = ['-ss', String(start), '-i', inputName];
      if (i < numParts-1) args.push('-t', String(partLen));
      // -c copy: repackage, don't re-encode — fast, no quality loss, low memory.
      args.push('-c', 'copy', '-avoid_negative_ts', 'make_zero', outName);
      await ffmpeg.run(...args);

      const data = ffmpeg.FS('readFile', outName);
      const blob = new Blob([data.buffer], { type: sp.file.type || 'audio/mpeg' });
      const name = splitterPartName(sp.file.name, i, numParts);
      results.push({ name, size: blob.size, blob });
      ffmpeg.FS('unlink', outName); // free memory before the next part
    }

    ffmpeg.FS('unlink', inputName);
    sp.parts = results;
    sp.status = 'done';
    sp.statusText = `Done — split into ${numParts} parts.`;
    sp.progressPct = 100;
    render();
  } catch(err){
    console.error('Splitter error:', err);
    sp.status = 'error';
    sp.statusText = (err && err.message) ? err.message : 'Something went wrong while splitting this file.';
    render();
  }
}

function downloadSplitterPart(idx){
  const part = state.splitter.parts[idx];
  if (!part) return;
  const url = URL.createObjectURL(part.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = part.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function openSplitter(){
  state.view = 'splitter';
  render();
}
function closeSplitter(){
  state.view = 'gallery';
  render();
}

function renderSplitter(){
  const sp = state.splitter;
  const busy = sp.status === 'loading-engine' || sp.status === 'probing' || sp.status === 'splitting';
  return `<div class="wrap">
    <button class="player-back" data-action="close-splitter" style="margin-bottom:14px;">‹ Library</button>
    <h2 class="display" style="font-size:20px;margin-bottom:6px;">Split a large file</h2>
    <p style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:20px;">
      Break one very long audiobook file into a few smaller parts, right on this device — no quality loss.
      Useful for 8+ hour files, which can be unreliable to play as a single file on iOS.
      Downloaded parts can be re-added to this same book from its player screen ("Add file(s)…") and will play back-to-back as one book.
    </p>

    <div class="match-box">
      ${!sp.file ? `
        <button class="btn btn-accent" data-action="pick-splitter-file">Choose audio file…</button>
      ` : `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <div style="font-size:22px;">🎧</div>
          <div style="min-width:0;">
            <div style="font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(sp.file.name)}</div>
            <div style="font-size:11.5px;color:var(--muted-dim);">${fmtBytes(sp.file.size)}</div>
          </div>
        </div>

        ${sp.status !== 'done' ? `
          <label style="display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;">Target length per part</label>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <input type="number" min="0.25" step="0.25" value="${esc(sp.targetHours)}" id="splitter-hours-input"
              ${busy ? 'disabled' : ''}
              style="width:80px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:14px;" />
            <span style="font-size:13px;color:var(--muted);">hours</span>
          </div>

          <div style="display:flex;gap:10px;">
            <button class="btn btn-accent" data-action="run-split" ${busy ? 'disabled' : ''}>${busy ? 'Working…' : 'Split file'}</button>
            <button class="btn btn-subtle" data-action="pick-splitter-file" ${busy ? 'disabled' : ''}>Choose different file</button>
          </div>
        ` : ''}

        ${sp.status !== 'idle' ? `
          <div style="margin-top:16px;">
            ${busy ? `<div class="prog-bar" style="margin-bottom:8px;"><div class="prog-fill" style="width:${sp.progressPct}%;"></div></div>` : ''}
            <div style="font-size:12.5px;color:${sp.status==='error'?'var(--bad)':'var(--muted)'};line-height:1.5;">${esc(sp.statusText)}</div>
          </div>
        ` : ''}

        ${sp.status === 'done' ? `
          <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;">
            ${sp.parts.map((p,i) => `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border-radius:9px;padding:9px 12px;">
                <div style="min-width:0;">
                  <div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name)}</div>
                  <div style="font-size:11px;color:var(--muted-dim);">${fmtBytes(p.size)}</div>
                </div>
                <button class="btn btn-sm btn-ghost" data-action="download-split-part" data-id="${i}">Download</button>
              </div>
            `).join('')}
            <button class="btn btn-subtle" style="margin-top:8px;" data-action="pick-splitter-file">Split another file</button>
          </div>
        ` : ''}
      `}
    </div>
  </div>`;
}
</script>

          <input type="number" id="sleep-chapters-input" min="1" max="${Math.max(1,list.length)}" value="1" style="width:64px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;background:var(--panel-2);color:var(--ink);outline:none;">
          <span style="font-size:12.5px;color:var(--muted);">chapter(s)</span>
          <button class="btn btn-accent btn-sm" data-action="set-sleep-chapters" style="margin-left:auto;">Start</button>
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

// Local, non-committing star picker for the complete-book modal — unlike
// starsEditableHTML (which writes straight to Firestore on click, for the
// always-visible player rating), this only updates the modal's own draft
// until "Complete Book" is pressed, matching the tracker's own completion
// flow where rating + date are chosen together before anything is saved.
function starsPickerHTML(value, size){
  size = size || 22;
  value = Math.max(0, Math.min(5, Number(value)||0));
  let out = `<span class="mini-stars editable" style="font-size:${size}px">`;
  for (let n=1;n<=5;n++){
    const frac = Math.max(0, Math.min(1, value-(n-1)));
    out += `<span class="star-slot">
      <span class="star-base">★</span>
      <span class="star-fill" style="width:${Math.round(frac*100)}%">★</span>
      <span class="star-hit star-hit-q1" data-action="pick-complete-rating" data-val="${n-0.75}"></span>
      <span class="star-hit star-hit-q2" data-action="pick-complete-rating" data-val="${n-0.5}"></span>
      <span class="star-hit star-hit-q3" data-action="pick-complete-rating" data-val="${n-0.25}"></span>
      <span class="star-hit star-hit-q4" data-action="pick-complete-rating" data-val="${n}"></span>
    </span>`;
  }
  return out + `</span>`;
}

// Mirrors the tracker's own "Complete book" modal (date finished + required
// rating) so finishing a book here asks for exactly the same information.
function renderCompleteModal(itemId){
  const item = findItem(itemId);
  if (!item) return '';
  const book = item.raw || {};
  const draft = state.modal.draft || (state.modal.draft = {
    dateFinished: new Date().toISOString().slice(0,10),
    rating: Number(book.rating)||0,
  });
  return `<div class="modal-overlay">
    <div class="modal-card" style="width:380px;">
      <div class="modal-head">
        <h3>Complete book</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      <div class="modal-body">
        <label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Date finished</label>
        <input type="date" id="complete-date-input" value="${esc(draft.dateFinished)}" style="width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--panel-2);color:var(--ink);outline:none;margin-bottom:16px;">
        <label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;">Rating <span style="color:var(--bad);">*</span></label>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
          ${starsPickerHTML(draft.rating)}
          <span style="font-size:12.5px;color:var(--muted);">${draft.rating ? String(draft.rating) : 'Tap to rate'}</span>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-accent" data-action="save-complete-book" data-id="${esc(item.id)}">Complete Book</button>
        </div>
      </div>
    </div>
  </div>`;
}

// Same option lists and shape as the tracker's own wishlist "Read" flow.
const WISH_FORMATS = ["Physical","Digital","Audio"];
const WISH_SOURCES = ["Purchased","Borrowed","Gift","Free"];
const WISH_LANGUAGES = ["English","Hebrew"];
function wishSelectOptions(list, current){
  return list.map(v => `<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
}
const modalInputStyle = "width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--panel-2);color:var(--ink);outline:none;";

// Mirrors the tracker's own moveWishFormHTML() — same fields, same defaults —
// except Format is pre-filled to "Audio" instead of "Physical", since a book
// chosen from here is (presumably) about to be listened to, not read.
function renderMoveWishModal(wishId){
  const w = state.wishlist.find(x => x.id === wishId);
  if (!w) return '';
  return `<div class="modal-overlay">
    <div class="modal-card" style="width:420px;">
      <div class="modal-head">
        <h3>Move to Currently Reading</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      <div class="modal-body">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;">
          Moving <strong style="color:var(--ink);">${esc(w.title)}</strong> to Currently Reading. A few more details:
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
          <label style="display:block;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Source</div>
            <select id="mw-source" style="${modalInputStyle}">${wishSelectOptions(WISH_SOURCES,'Purchased')}</select>
          </label>
          <label style="display:block;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Format</div>
            <select id="mw-format" style="${modalInputStyle}">${wishSelectOptions(WISH_FORMATS,'Audio')}</select>
          </label>
          <label style="display:block;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Language</div>
            <select id="mw-language" style="${modalInputStyle}">${wishSelectOptions(WISH_LANGUAGES,'English')}</select>
          </label>
          <label style="display:block;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Recommended by</div>
            <input id="mw-recby" placeholder="Optional" style="${modalInputStyle}">
          </label>
        </div>
        <label style="display:block;margin-bottom:18px;">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">Notes / thoughts</div>
          <textarea id="mw-notes" placeholder="Quotes, annotations, anything to remember" style="${modalInputStyle}min-height:70px;resize:vertical;font-family:inherit;"></textarea>
        </label>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-accent" data-action="confirm-move-wish" data-id="${esc(w.id)}">Add to Currently Reading</button>
        </div>
      </div>
    </div>
  </div>`;
}
function openMoveWishModal(wishId){
  const w = state.wishlist.find(x => x.id === wishId);
  if (!w) return;
  state.modal = { kind:'move-wish', id: wishId };
  render();
}
// Mirrors the tracker's own completeMoveWish() field-for-field: same new-book
// shape, same defaults (status "reading", priority "Interested", a 14-day due
// date if Borrowed), and the same two writes — books AND wishlist, to the
// same BOOKS_DOC/shelf-spine doc the tracker itself reads and writes. So a
// book moved from here shows up on the tracker's Currently Reading list (and
// disappears from its Wishlist tab) exactly as if "Read" had been clicked there.
function confirmMoveWish(wishId){
  const w = state.wishlist.find(x => x.id === wishId);
  if (!w) return;
  const source = (document.getElementById('mw-source')||{}).value || 'Purchased';
  const format = (document.getElementById('mw-format')||{}).value || 'Audio';
  const language = (document.getElementById('mw-language')||{}).value || 'English';
  const recommendedBy = ((document.getElementById('mw-recby')||{}).value || '').trim();
  const notes = ((document.getElementById('mw-notes')||{}).value || '').trim();
  const todayISO = new Date().toISOString().slice(0,10);
  const addDaysISO = (iso, days) => { const d = new Date((iso||todayISO)+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); };
  const newBook = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    title: w.title, author: w.author, genre: w.genre||'', subGenre: w.subGenre||'',
    format, source, status: 'reading', priority: 'Interested', rating: 0, dateFinished: '',
    language, pagesHours: w.pagesHours||'', review: '', notes, recommendedBy, coverUrl: w.coverUrl||'',
    seriesName: w.seriesName||'', seriesNumber: w.seriesNumber||'', rereads: [],
    isExample: false, progressPercent: 0, progressMode: 'percent', progressPage: '',
    dueDate: source === 'Borrowed' ? addDaysISO(todayISO, 14) : '',
  };
  const newWishlist = state.wishlist.filter(x => x.id !== wishId);
  state.wishlist = newWishlist;
  if (format === 'Audio') state.books = [...state.books, newBook]; // optimistic local update — this view only ever shows Audio books
  state.modal = null;
  render();

  // Always re-fetch from the server (not the local cache) right before
  // merging — see saveBookPatch's comment above for why: this device's
  // cached copy of the doc can be stale, and state.books here only ever
  // holds the Audio-format subset (this app's own filter) anyway, so
  // writing it back wholesale would silently drop every non-audio book
  // from the shared tracker doc, since Firestore replaces array fields
  // rather than merging their elements.
  BOOKS_DOC.get({ source: 'server' }).then(snap => {
    const data = snap.exists ? snap.data() : {};
    const fullBooks = Array.isArray(data.books) ? data.books : [];
    const mergedFullBooks = [...fullBooks, newBook];
    state.allBooks = mergedFullBooks;
    return BOOKS_DOC.set({ books: mergedFullBooks, wishlist: newWishlist }, { merge: true });
  }).then(() => toast(`${w.title} moved to Currently Reading.`))
    .catch(err => { console.error('Failed to move wishlist item:', err); toast('Could not sync — try again.'); });
}

/* ==================================================================
   MAIN RENDER + EVENT DELEGATION
================================================================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="topbar-outer wrap" style="padding-bottom:0;">
    <div class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        <div><div class="word">Audiobooks</div><div class="sub">Shelf & Spine</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        ${state.view !== 'splitter' ? `<button class="btn-icon" title="Split a large audiobook file" data-action="open-splitter" style="display:flex;align-items:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        </button>` : ''}
        <a class="back-link" href="index.html?home=1">Back to Shelf ›</a>
      </div>
    </div>
  </div>` + (state.view === 'player' ? renderPlayer() : state.view === 'splitter' ? renderSplitter() : renderGallery());

  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = state.modal
    ? (state.modal.kind === 'sleep' ? renderSleepModal()
      : state.modal.kind === 'complete' ? renderCompleteModal(state.modal.id)
      : state.modal.kind === 'move-wish' ? renderMoveWishModal(state.modal.id)
      : renderMatchModal(state.modal.id))
    : '';
}

document.addEventListener('click', async (e) => {
  // Backdrop click: closes the modal only when the click lands directly on
  // the overlay itself (not a descendant) — checked before the data-action
  // lookup below, and independent of it, since the overlay no longer carries
  // its own data-action (that approach required bubbling all the way up to
  // this listener, which the modal card's own click handling was blocking).
  if (e.target.classList && e.target.classList.contains('modal-overlay')){
    state.modal = null; render(); return;
  }
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;

  if (action === 'connect-folder') return connectFolder();
  if (action === 'reconnect-folder') return reconnectFolder();
  if (action === 'rescan') return rescanLibrary();
  if (action === 'open-book'){
    const it = findItem(id);
    if (it && it.source === 'wishlist') return openMoveWishModal(it.raw.id);
    return openPlayer(id);
  }
  if (action === 'close-player') return closePlayer();
  if (action === 'toggle-play') return togglePlay();
  if (action === 'skip-back') return skip(-30);
  if (action === 'skip-fwd') return skip(30);
  if (action === 'rate-up') return setRate(1);
  if (action === 'rate-down') return setRate(-1);
  if (action === 'set-rating') return setRating(id, parseFloat(t.dataset.val));
  if (action === 'jump-chapter') return jumpToChapter(parseInt(t.dataset.idx,10));
  if (action === 'view-book'){ player.scrubMode = 'book'; render(); return; }
  if (action === 'view-chapter'){ player.scrubMode = 'chapter'; render(); return; }
  if (action === 'add-files'){ return triggerAddFiles(id); }
  if (action === 'open-match-modal'){ state.modal = { id }; render(); return; }
  if (action === 'open-sleep-modal'){ state.modal = { kind:'sleep' }; render(); return; }
  if (action === 'close-modal'){ state.modal = null; render(); return; }
  if (action === 'set-sleep-book'){
    const el = document.getElementById('sleep-book-input');
    const v = el ? parseFloat(el.value) : NaN;
    if (v > 0) setSleepTimerBook(v);
    return;
  }
  if (action === 'set-sleep-speed'){
    const el = document.getElementById('sleep-speed-input');
    const v = el ? parseFloat(el.value) : NaN;
    if (v > 0) setSleepTimerSpeed(v);
    return;
  }
  if (action === 'set-sleep-chapters'){
    const el = document.getElementById('sleep-chapters-input');
    const v = el ? parseInt(el.value,10) : NaN;
    if (v > 0) setSleepTimerChapters(v);
    return;
  }
  if (action === 'cancel-sleep-timer'){ clearSleepTimer(); toast('Sleep timer canceled.'); render(); return; }
  if (action === 'open-complete-modal'){
    const it = findItem(id);
    if (!it) return;
    state.modal = { kind:'complete', id, draft: {
      dateFinished: new Date().toISOString().slice(0,10),
      rating: Number((it.raw||{}).rating) || 0,
    }};
    render();
    return;
  }
  if (action === 'pick-complete-rating'){
    if (state.modal && state.modal.kind === 'complete'){
      state.modal.draft = state.modal.draft || {};
      state.modal.draft.rating = parseFloat(t.dataset.val);
      render();
    }
    return;
  }
  if (action === 'save-complete-book'){ return saveCompleteBook(id); }
  if (action === 'confirm-move-wish'){ return confirmMoveWish(id); }
  if (action === 'clear-match'){ await clearMatch(id); state.modal = null; render(); return; }
  if (action === 'pick-folder'){
    const path = t.dataset.path;
    const folder = state.scan.folders.find(f => f.path === path);
    if (folder){ await setMultiMatch(id, folder); state.modal = null; toast('Matched.'); if (state.view==='player' && state.currentBookId===id) await startPlaybackSession(id, state.matches[id], findItem(id)); else render(); }
    return;
  }
  if (action === 'open-splitter') return openSplitter();
  if (action === 'close-splitter') return closeSplitter();
  if (action === 'pick-splitter-file') return pickSplitterFile();
  if (action === 'run-split'){
    const hoursEl = document.getElementById('splitter-hours-input');
    if (hoursEl){ const v = parseFloat(hoursEl.value); if (v > 0) state.splitter.targetHours = v; }
    return runSplit();
  }
  if (action === 'download-split-part') return downloadSplitterPart(parseInt(t.dataset.id, 10));
  if (action === 'pick-file'){
    const path = t.dataset.path;
    const file = state.scan.files.find(f => f.path === path);
    if (file){ await setSingleMatch(id, file); state.modal = null; toast('Matched.'); if (state.view==='player' && state.currentBookId===id) await startPlaybackSession(id, state.matches[id], findItem(id)); else render(); }
    return;
  }
});

// Double-tap/double-click a rating to type an exact number instead of tapping stars.
// Deliberately no visual affordance for this — it's just there if you know it's there.
document.addEventListener('dblclick', (e) => {
  const el = e.target.closest('[data-rating-for]');
  if (!el) return;
  e.preventDefault();
  const bookId = el.dataset.ratingFor;
  const book = state.books.find(b => b.id === bookId);
  if (!book) return;
  const current = Number(book.rating) || 0;
  const input = window.prompt('Rating (0–5):', current || '');
  if (input === null) return;
  const val = parseFloat(input);
  if (isNaN(val)) return;
  setRating(bookId, val);
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'scrub'){
    player.seeking = true;
    const max = parseFloat(e.target.max) || 1;
    e.target.style.setProperty('--fill', (e.target.value/max*100)+'%');
    const elapsedEl = document.getElementById('time-elapsed');
    const remEl = document.getElementById('time-remaining');
    if (elapsedEl) elapsedEl.textContent = fmtHMS(parseFloat(e.target.value));
    if (remEl) remEl.textContent = fmtRemaining(Math.max(0, max-parseFloat(e.target.value)));
  }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'scrub'){
    player.seeking = false;
    await scrubTo(parseFloat(e.target.value));
    saveProgress();
  }
});

document.addEventListener('keydown', (e) => {
  if (state.view !== 'player' || !player.isReady) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight'){ skip(30); }
  if (e.code === 'ArrowLeft'){ skip(-30); }
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  handleFilesSelected(e.target.files);
});
document.getElementById('splitterFileInput').addEventListener('change', (e) => {
  handleSplitterFile(e.target.files && e.target.files[0]);
  e.target.value = ''; // allow picking the same file again
});

/* ---------------- boot ---------------- */
render();
loadBooks();
loadProgress();
refreshStorageEstimate();
if (SUPPORTS_FS_ACCESS){
  restoreRootDir().then(() => { if (state.dirPermissionOk) rescanLibrary(); });
}
// Resume straight into the player on reload, the same way the old code tried
// to do it by guessing at initial state — except this actually waits for the
// book list to load first, so it can find the book and hand off to the normal
// openPlayer() flow (which itself waits for progress before picking a start
// time). This was the real source of the "resets to 0" bug: previously the
// page would jump into the player view immediately on load, before the match
// or the saved position had loaded from anywhere — so it looked stuck or blank,
// and anything played from there saved right over the real progress.
if (location.hash === '#player' && state.currentBookId){
  booksReadyPromise.then(() => {
    if (findItem(state.currentBookId)) openPlayer(state.currentBookId);
  });
}
</script>
