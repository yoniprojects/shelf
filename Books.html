/* ============================================================
   In-book search
   ============================================================ */
const searchInput = $('#searchInput'), searchBtn = $('#searchBtn'),
      searchStatus = $('#searchStatus'), searchResultsEl = $('#searchResults');
let searchToken = 0;

// Walks book.navToc (already built in document order from the EPUB's nav)
// to find the last chapter heading at or before this spine index — same
// idea as a "current chapter" lookup, just keyed off an arbitrary result
// instead of the reading position.
function navLabelForIndex(index){
  if(!book || !book.navToc || index==null) return '';
  let best = '';
  for(const entry of book.navToc){
    if(entry.index!=null && entry.index<=index) best = (entry.label||'').trim();
  }
  return best;
}

// Folds curly/smart quotes and dashes to their plain-ASCII equivalents.
// Applied to both the query and the source text before comparing, since a
// pasted passage almost always carries the book's typographic quotes/dashes
// (’ “ ” – —) while a typed query usually has the plain keyboard versions —
// a mismatch that would otherwise silently break the match. One-char-for-
// one-char, so it never disturbs the position map built alongside it.
function foldQuotes(s){
  return s.replace(/[\u2018\u2019\u201A\u201B]/g, "'")
          .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
          .replace(/[\u2013\u2014]/g, '-');
}

// Loads each spine section, then searches its FULL text as one continuous,
// whitespace-normalized string rather than trusting epub.js's own find()/
// search(). epub.js's find() only matches within a single text node, and
// its search() only bridges a handful of *sequential* nodes — so a query
// spanning an italicized word, a footnote link, or just a paragraph break
// can fail even though the words are right there on the page. Worse, the
// text it searches is the raw, un-normalized textContent: many EPUBs (esp.
// ones converted from Gutenberg-style plain text) hard-wrap their source
// markup, leaving literal newlines/indentation inside a paragraph that a
// normally-spaced query will never match either. Building one normalized
// string per section (via getReadableTextNodes/buildCombinedText/
// normalizeWithMap, already used elsewhere for anchoring) and mapping a
// match back to its exact (node, offset) sidesteps both problems.
async function searchSection(item, qNorm){
  const nodes = getReadableTextNodes(item.document);
  if(!nodes.length) return [];
  const {text, starts} = buildCombinedText(nodes);
  const {norm, idx} = normalizeWithMap(text);
  const hay = foldQuotes(norm).toLowerCase();
  const matches = [];
  let from = 0, pos;
  while((pos = hay.indexOf(qNorm, from)) !== -1){
    const startRaw = idx[pos];
    const endRaw = idx[pos+qNorm.length-1] + 1;
    const startPos = resolvePosition(starts, startRaw);
    const endPos = resolvePosition(starts, endRaw-1);
    if(startPos && endPos){
      try{
        const range = item.document.createRange();
        range.setStart(startPos.node, startPos.offset);
        range.setEnd(endPos.node, endPos.offset+1);
        const cfi = item.cfiFromRange(range);
        const excerptStart = Math.max(0, pos-75);
        const excerptEnd = Math.min(norm.length, pos+qNorm.length+75);
        let excerpt = norm.slice(excerptStart, excerptEnd);
        if(excerptStart>0) excerpt = '…'+excerpt;
        if(excerptEnd<norm.length) excerpt += '…';
        matches.push({cfi, excerpt});
      }catch(e){}
    }
    from = pos + qNorm.length;
  }
  return matches;
}

async function runBookSearch(query){
  const q = foldQuotes(normalizeWithMap(query.trim()).norm).toLowerCase();
  if(!book || !book.epubBook) return;
  const myToken = ++searchToken;
  if(!q){ searchStatus.textContent=''; searchResultsEl.innerHTML=''; return; }
  searchBtn.disabled = true;
  searchStatus.textContent = 'Searching…';
  searchResultsEl.innerHTML = '';
  const results = [];
  for(const item of book.epubBook.spine.spineItems){
    if(myToken !== searchToken) return; // a newer search superseded this one
    try{
      await item.load(book.epubBook.load.bind(book.epubBook));
      (await searchSection(item, q)).forEach(m=>{
        results.push({ cfi: m.cfi, excerpt: normText(m.excerpt), index: item.index });
      });
      item.unload();
    }catch(e){}
  }
  if(myToken !== searchToken) return;
  searchBtn.disabled = false;
  searchStatus.textContent = results.length ? `${results.length} match${results.length===1?'':'es'}` : 'No matches found.';
  renderSearchResults(results, q);
}

function renderSearchResults(results, query){
  searchResultsEl.innerHTML = '';
  results.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'search-result';
    const chap = document.createElement('div');
    chap.className = 'search-result-chapter';
    chap.textContent = navLabelForIndex(r.index);
    const excerpt = document.createElement('div');
    excerpt.className = 'search-result-excerpt';
    appendHighlighted(excerpt, r.excerpt, query);
    row.appendChild(chap);
    row.appendChild(excerpt);
    row.addEventListener('click', ()=> goToSearchResult(r, query));
    searchResultsEl.appendChild(row);
  });
}

// Builds the excerpt as text nodes plus a single <mark> around the matched
// term via DOM APIs rather than innerHTML — this text comes from the book
// file itself, not something we should trust as markup.
function appendHighlighted(container, excerpt, query){
  container.innerHTML = '';
  const idx = excerpt.toLowerCase().indexOf(query.toLowerCase());
  if(idx < 0){ container.textContent = excerpt; return; }
  container.appendChild(document.createTextNode(excerpt.slice(0, idx)));
  const mark = document.createElement('mark');
  mark.textContent = excerpt.slice(idx, idx+query.length);
  container.appendChild(mark);
  container.appendChild(document.createTextNode(excerpt.slice(idx+query.length)));
}

function goToSearchResult(result, query){
  if(!book || !book.rendition || !result.cfi) return;
  closeSettings();
  book.rendition.display(result.cfi).then(()=>{
    if(settings.viewMode!=='scroll' || !book.rendition) return;
    // Same fine-tuning as a view-mode switch: display(cfi) only guarantees
    // the target is *somewhere* on screen, so re-find the exact matched
    // text (correct source casing, taken from the excerpt) and center it.
    setTimeout(()=>{
      try{
        const contentsArr = book.rendition.getContents();
        const idx = result.excerpt.toLowerCase().indexOf(query.toLowerCase());
        const snippet = normText(idx>=0 ? result.excerpt.slice(idx, idx+query.length) : query);
        const found = findAnchorRange(contentsArr, snippet);
        if(found) scrollRangeToCenter(found.contents, found.range);
      }catch(e){}
    }, 60);
  }).catch(()=>{});
}

searchInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); runBookSearch(searchInput.value); }
});

/* ============================================================
   Nav / progress persistence
   ============================================================ */
$('#backBtn').addEventListener('click', ()=>{
  saveProgress();
  if (book && book.trackerItem && book.trackerItem.source === 'book'){
    // Flush immediately rather than waiting on the debounce, so closing the
    // reader always reflects the true final position on the main tracker.
    syncPercentToMainSiteNow(book.trackerItem.id, Math.round(currentPercent()*100));
  }
  if(book){
    try{ if(book.rendition) book.rendition.destroy(); }catch(e){}
    try{ book.epubBook.destroy(); }catch(e){}
  }
  book = null;
  topTitleRatingEl.innerHTML = '';
  showLibrary();
});

function saveProgress(){
  if(!book) return;
  const cfi = book.currentCfi || book.savedCfi || null;
  const pct = currentPercent();
  // Local mirror updates instantly (snappy resume even offline); the cloud write
  // is debounced inside persistProgressCloud, same as Audiobooks' persistProgress.
  persistProgressCloud(book.id, { cfi, percent: pct });
  if (book.trackerItem && book.trackerItem.source === 'book'){
    syncPercentToMainSite(book.trackerItem.id, Math.round(pct*100));
  }
}
const saveProgressDebounced = debounce(saveProgress, 400);

/* ============================================================
   Tracker modals: move-to-reading / complete book
   ============================================================ */
const TM_FORMATS = ["Physical","Digital","Audio"];
const TM_SOURCES = ["Purchased","Borrowed","Gift","Free"];
const TM_LANGUAGES = ["English","Hebrew"];
function tmSelectOptions(list, current){
  return list.map(v => `<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
}
function starsPickerHTML(value, size){
  size = size || 22;
  value = Math.max(0, Math.min(5, Number(value)||0));
  let out = `<span class="mini-stars editable" style="font-size:${size}px">`;
  for (let n=1;n<=5;n++){
    const frac = Math.max(0, Math.min(1, value-(n-1)));
    out += `<span class="star-slot">
      <span class="star-base">★</span>
      <span class="star-fill" style="width:${Math.round(frac*100)}%">★</span>
      <span class="star-hit star-hit-q1" data-action="pick-complete-rating" data-val="${n-0.75}"></span>
      <span class="star-hit star-hit-q2" data-action="pick-complete-rating" data-val="${n-0.5}"></span>
      <span class="star-hit star-hit-q3" data-action="pick-complete-rating" data-val="${n-0.25}"></span>
      <span class="star-hit star-hit-q4" data-action="pick-complete-rating" data-val="${n}"></span>
    </span>`;
  }
  return out + `</span>`;
}

// Mirrors index.html's own moveWishFormHTML()/Audiobooks' move-wish modal — same
// fields, same defaults — except Format defaults to Digital instead of Physical,
// since a book opened from here is (presumably) about to be read as an ebook.
function renderMoveWishModal(wishId){
  const w = tstate.wishlist.find(x => x.id === wishId);
  if (!w) return '';
  return `<div class="tm-overlay" data-action="modal-backdrop">
    <div class="tm-card">
      <div class="tm-head">
        <h3>Move to Currently Reading</h3>
        <button class="tm-close" data-action="close-tracker-modal">×</button>
      </div>
      <div class="tm-body">
        <div style="font-size:12.5px;color:var(--sub);margin-bottom:16px;line-height:1.5;">
          Moving <strong style="color:var(--text);">${esc(w.title)}</strong> to Currently Reading. A few more details:
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
          <label class="tm-field"><div class="lbl">Source</div><select id="mw-source" class="tm-input">${tmSelectOptions(TM_SOURCES,'Purchased')}</select></label>
          <label class="tm-field"><div class="lbl">Format</div><select id="mw-format" class="tm-input">${tmSelectOptions(TM_FORMATS,'Digital')}</select></label>
          <label class="tm-field"><div class="lbl">Language</div><select id="mw-language" class="tm-input">${tmSelectOptions(TM_LANGUAGES,'English')}</select></label>
          <label class="tm-field"><div class="lbl">Recommended by</div><input id="mw-recby" class="tm-input" placeholder="Optional"></label>
        </div>
        <label class="tm-field" style="margin-bottom:4px;">
          <div class="lbl">Notes / thoughts</div>
          <textarea id="mw-notes" class="tm-input" placeholder="Quotes, annotations, anything to remember" style="min-height:70px;resize:vertical;font-family:inherit;"></textarea>
        </label>
        <div class="tm-actions">
          <button class="tm-cancel" data-action="close-tracker-modal">Cancel</button>
          <button class="tm-confirm" data-action="confirm-move-wish" data-id="${esc(w.id)}">Add to Currently Reading</button>
        </div>
      </div>
    </div>
  </div>`;
}
function openMoveWishModal(wishId){
  const w = tstate.wishlist.find(x => x.id === wishId);
  if (!w) return;
  tstate.modal = { kind:'move-wish', id: wishId };
  renderTrackerModal();
}
// Mirrors index.html's completeMoveWish() / Audiobooks' confirmMoveWish() field-for-
// field: same new-book shape and defaults, and the same two writes (books AND
// wishlist) to BOOKS_DOC — the very doc the tracker itself reads and writes — so a
// book moved from here shows up on the tracker's Currently Reading list exactly as
// if "Read" had been clicked there.
function confirmMoveWish(wishId){
  const w = tstate.wishlist.find(x => x.id === wishId);
  if (!w) return;
  const source = (document.getElementById('mw-source')||{}).value || 'Purchased';
  const format = (document.getElementById('mw-format')||{}).value || 'Digital';
  const language = (document.getElementById('mw-language')||{}).value || 'English';
  const recommendedBy = ((document.getElementById('mw-recby')||{}).value || '').trim();
  const notes = ((document.getElementById('mw-notes')||{}).value || '').trim();
  const todayISO = new Date().toISOString().slice(0,10);
  const addDaysISO = (iso, days) => { const d = new Date((iso||todayISO)+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); };
  const newBook = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    title: w.title, author: w.author, genre: w.genre||'', subGenre: w.subGenre||'',
    format, source, status: 'reading', priority: 'Interested', rating: 0, dateFinished: '',
    language, pagesHours: w.pagesHours||'', review: '', notes, recommendedBy, coverUrl: w.coverUrl||'',
    seriesName: w.seriesName||'', seriesNumber: w.seriesNumber||'', rereads: [],
    isExample: false, progressPercent: 0, progressMode: 'percent', progressPage: '',
    dueDate: source === 'Borrowed' ? addDaysISO(todayISO, 14) : '',
  };
  const newWishlist = tstate.wishlist.filter(x => x.id !== wishId);
  tstate.wishlist = newWishlist;
  if (format !== 'Audio') tstate.books = [...tstate.books, newBook]; // optimistic — this view only shows non-Audio books
  tstate.modal = null;
  renderGallery();

  BOOKS_DOC.get({ source: 'server' }).then(snap => {
    const data = snap.exists ? snap.data() : {};
    const fullBooks = Array.isArray(data.books) ? data.books : [];
    const mergedFullBooks = [...fullBooks, newBook];
    tstate.allBooks = mergedFullBooks;
    return BOOKS_DOC.set({ books: mergedFullBooks, wishlist: newWishlist }, { merge: true });
  }).then(() => toast(`${w.title} moved to Currently Reading.`))
    .catch(err => { console.error('Failed to move wishlist item:', err); toast('Could not sync — try again.'); });
}

// Mirrors the tracker's own "Complete book" modal (date finished + required
// rating) and Audiobooks' saveCompleteBook() exactly: same fields, same
// required-rating check, same write straight to BOOKS_DOC.
function renderCompleteModal(itemId){
  const item = findTrackerItem(itemId);
  if (!item) return '';
  const raw = item.raw || {};
  const draft = tstate.modal.draft || (tstate.modal.draft = {
    dateFinished: new Date().toISOString().slice(0,10),
    rating: Number(raw.rating)||0,
  });
  return `<div class="tm-overlay" data-action="modal-backdrop">
    <div class="tm-card" style="width:380px;">
      <div class="tm-head">
        <h3>Complete book</h3>
        <button class="tm-close" data-action="close-tracker-modal">×</button>
      </div>
      <div class="tm-body">
        <div class="lbl" style="margin-bottom:6px;">Date finished</div>
        <input type="date" id="complete-date-input" class="tm-input" value="${esc(draft.dateFinished)}" style="margin-bottom:16px;">
        <div class="lbl" style="margin-bottom:8px;">Rating <span style="color:#b0563f;">*</span></div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          ${starsPickerHTML(draft.rating)}
          <span style="font-size:12.5px;color:var(--sub);">${draft.rating ? String(draft.rating) : 'Tap to rate'}</span>
        </div>
        <div class="tm-actions">
          <button class="tm-cancel" data-action="close-tracker-modal">Cancel</button>
          <button class="tm-confirm" data-action="save-complete-book" data-id="${esc(item.id)}">Complete Book</button>
        </div>
      </div>
    </div>
  </div>`;
}
function openCompleteModal(itemId){
  const item = findTrackerItem(itemId);
  if (!item) return;
  tstate.modal = { kind:'complete', id: itemId, draft: {
    dateFinished: new Date().toISOString().slice(0,10),
    rating: Number((item.raw||{}).rating) || 0,
  }};
  renderTrackerModal();
}
function saveCompleteBook(itemId){
  const draft = (tstate.modal && tstate.modal.kind === 'complete' && tstate.modal.draft) || {};
  const dateInput = document.getElementById('complete-date-input');
  const dateFinished = dateInput ? dateInput.value : (draft.dateFinished || new Date().toISOString().slice(0,10));
  const rating = Number(draft.rating) || 0;
  if (rating <= 0){ toast('Add a rating before completing.'); return; }
  const writePromise = saveBookPatch(itemId, {
    status: 'done', dateFinished, rating, priority: '', dueDate: '',
  });
  tstate.modal = null;
  renderGallery();
  updateReaderRatingRow();
  writePromise
    .then(() => toast('Marked as complete.'))
    .catch(err => { console.error('Failed to mark complete:', err); toast('Could not sync completion — try again.'); });
}

function renderTrackerModal(){
  if (!trackerModalRootEl) return;
  trackerModalRootEl.innerHTML = tstate.modal
    ? (tstate.modal.kind === 'complete' ? renderCompleteModal(tstate.modal.id) : renderMoveWishModal(tstate.modal.id))
    : '';
}

/* ---------------- Gallery + tracker-modal event delegation ---------------- */
document.addEventListener('click', async (e)=>{
  if (e.target.dataset && e.target.dataset.action === 'modal-backdrop'){
    tstate.modal = null; renderTrackerModal(); return;
  }
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;

  if (action === 'noop') return;
  if (action === 'open-book'){
    const item = findTrackerItem(id);
    if (item) await openTrackerBook(item);
    return;
  }
  if (action === 'add-file'){
    const item = findTrackerItem(id);
    if (item) await addFileForItem(item);
    return;
  }
  if (action === 'close-tracker-modal'){ tstate.modal = null; renderTrackerModal(); return; }
  if (action === 'confirm-move-wish'){ return confirmMoveWish(id); }
  if (action === 'save-complete-book'){ return saveCompleteBook(id); }
  if (action === 'pick-complete-rating'){
    if (tstate.modal && tstate.modal.kind === 'complete'){
      tstate.modal.draft = tstate.modal.draft || {};
      tstate.modal.draft.rating = parseFloat(t.dataset.val);
      renderTrackerModal();
    }
    return;
  }
});

// Rating is set only via double-tap/double-click (typed exact number) — see
// below. Single taps on the stars no longer change the rating.
document.addEventListener('dblclick', (e)=>{
  const wrap = e.target.closest('[data-rating-for]');
  if (!wrap) return;
  e.preventDefault();
  const bookId = wrap.dataset.ratingFor;
  const bk = tstate.books.find(b => b.id === bookId);
  if (!bk) return;
  showModal({
    title: 'Rating (0–5)', showInput: true, inputValue: String(Number(bk.rating)||''),
    confirmLabel: 'Save', cancelLabel: 'Cancel'
  }).then(result => {
    if (result === null) return;
    const val = parseFloat(result);
    if (!isNaN(val)) setRating(bookId, val);
  });
});

/* ============================================================
   Utils
   ============================================================ */
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ============================================================
   Init
   ============================================================ */
showLibrary();
loadTrackerBooks();
loadReadingProgress();
booksReadyPromise.then(refreshMatches);

})();
</script>
