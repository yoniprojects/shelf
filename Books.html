<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Books — Shelf & Spine</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/htlhPe9.png?v=2" />
<link rel="apple-touch-icon" href="https://i.imgur.com/htlhPe9.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Books" />
<script>
  // Resume where I left off: mark this page as the last one visited.
  // (Redirecting elsewhere doesn't belong here — only index.html, the hub
  // page, does that. This page is a destination, so it just records itself,
  // the same way audiobooks.html and the other sub-pages do.)
  try{ localStorage.setItem('shelf:lastPage','Books.html'); }catch(e){}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Slab:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gap: 14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family: system-ui, -apple-system, 'Noto Sans Hebrew', sans-serif;
  overflow:hidden;
  background:#111;
  color:#eee;
}

/* ---------- Themes ---------- */
body[data-theme="dark"]{
  --bg:#1E1C19; --bg2:#28251F; --text:#E9E3D6; --sub:#a89f8d; --border:rgba(233,227,214,.12);
  --accent:#d8a25a; --ruler: rgba(216,162,90,.22); --shadow: rgba(0,0,0,.4);
}
body[data-theme="paper"]{
  --bg:#E9E2D2; --bg2:#E1D8C4; --text:#2E2A20; --sub:#726b58; --border:rgba(46,42,32,.16);
  --accent:#5f6f4e; --ruler: rgba(95,111,78,.22); --shadow: rgba(0,0,0,.15);
  --paper-texture: url("https://i.imgur.com/LT7cU3b.png");
}
/* the app shell (#app) sits opaque on top of <body>, so the texture is painted there
   instead of on body — otherwise it would never be visible */
body[data-theme="paper"] #app{
  background-color: var(--bg);
  background-image: var(--paper-texture);
  background-size: 700px 700px;
  background-blend-mode: multiply;
}

#app{position:fixed;inset:0;background:var(--bg);color:var(--text);}

/* ---------- Library ---------- */
#library{position:absolute;inset:0;overflow-y:auto;display:none;}
#library.active{display:block;}
.lib-header{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 8px;}
.lib-header h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px;}
.back-link{font-size:12.5px;color:var(--sub);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px;}
.back-link:hover{color:var(--text);}
.add-btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
}
.add-btn:active{opacity:.8;}
.lib-empty{padding:60px 24px;text-align:center;color:var(--sub);font-size:15px;line-height:1.6;}
.shelf{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:20px;padding:16px 20px 40px;
}
.book-card{cursor:pointer;text-align:left;}
.book-cover{
  width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
  background:var(--bg2);box-shadow:0 3px 10px var(--shadow);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.book-cover .fallback{padding:10px;font-size:12px;text-align:center;color:var(--sub);font-weight:600;line-height:1.3;}
.book-cover .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.15);}
.book-cover .prog i{display:block;height:100%;background:var(--accent);}
.book-title{margin-top:7px;font-size:13px;font-weight:600;line-height:1.3;}
.book-author{font-size:11.5px;color:var(--sub);margin-top:1px;}
.book-card .stale{font-size:10.5px;color:#b0563f;margin-top:2px;}

/* ---------- Gallery (tracker-backed: Currently Reading / To Be Read / Finished) ---------- */
.section-label{font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.5px;margin:0 0 12px;text-transform:uppercase;}
.gallery-section{margin:0 20px 30px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px;}
.feature-row{display:flex;flex-direction:column;gap:12px;}
.feature-card{display:flex;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 3px 10px var(--shadow);}
.feature-cover-wrap{position:relative;flex-shrink:0;}
.feature-cover{width:66px;height:99px;border-radius:6px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 12px var(--shadow);position:relative;background:var(--bg2);display:flex;align-items:center;justify-content:center;}
.feature-cover img{width:100%;height:100%;object-fit:cover;}
.feature-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.feature-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.feature-title{font-weight:700;font-size:14.5px;line-height:1.3;}
.feature-author{font-size:12px;color:var(--sub);}
.feature-sub-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.feature-due{font-size:10.5px;color:#b0563f;font-weight:700;}
.feature-progress-row{display:flex;align-items:center;gap:9px;margin-top:4px;}
.prog-bar{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:999px;}
.prog-pct{font-size:11px;font-weight:700;color:var(--accent);min-width:32px;text-align:right;}
.feature-meta{font-size:11px;color:var(--sub);margin-top:2px;}
.feature-meta.link-hint{color:var(--accent);font-weight:600;}

.cover-ring{position:absolute;left:-8px;bottom:-8px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 5px var(--shadow));}
.cover-ring svg{display:block;}
.cover-ring .ring-pct{position:absolute;font-size:8.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}

.mini-stars{display:inline-flex;line-height:1;}
.mini-stars .star-slot{position:relative;display:inline-block;width:1em;height:1em;}
.mini-stars .star-slot .star-base,.mini-stars .star-slot .star-fill{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;}
.mini-stars .star-slot .star-base{color:var(--border);}
.mini-stars .star-slot .star-fill{color:var(--accent);overflow:hidden;width:0%;}
.mini-stars.editable{gap:2px;}
.mini-stars.editable .star-slot{cursor:pointer;}
.mini-stars.editable .star-hit{position:absolute;top:-3px;bottom:-3px;width:25%;z-index:2;}
.mini-stars.editable .star-hit-q1{left:0;} .mini-stars.editable .star-hit-q2{left:25%;}
.mini-stars.editable .star-hit-q3{left:50%;} .mini-stars.editable .star-hit-q4{left:75%;}

.cover-card{cursor:pointer;}
.cover-card .cover{border-radius:6px;aspect-ratio:2/3;margin-bottom:7px;overflow:hidden;position:relative;box-shadow:0 3px 10px var(--shadow);background:var(--bg2);display:flex;align-items:center;justify-content:center;}
.cover-card .cover img{width:100%;height:100%;object-fit:cover;}
.cover-card .cover .ph{font-size:12px;font-weight:600;text-align:center;padding:8px;color:var(--sub);}
.cover-card .cover .badge{position:absolute;top:5px;right:5px;}
.cover-card .title{font-size:12.5px;font-weight:700;line-height:1.28;}
.cover-card .author{font-size:11px;color:var(--sub);margin:2px 0 4px;}
.cover-card .mini-pct{font-size:10.5px;color:var(--accent);font-weight:700;}
.cover-card .mini-pill{font-size:10px;color:var(--sub);}
.pill{background:var(--border);color:var(--sub);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.pill.on{background:var(--accent);color:#fff;}
.pill.off{background:var(--border);color:var(--sub);}

.gallery-empty{text-align:center;padding:50px 24px;color:var(--sub);font-size:14px;line-height:1.6;}

/* per-book connection state, shown inline on a Currently Reading feature card */
.conn-line{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--sub);}
.conn-line.warn{color:#b0563f;font-weight:600;}
.conn-line .conn-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:4px 10px;font-size:10.5px;font-weight:700;cursor:pointer;}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg2);color:var(--text);padding:10px 18px;border-radius:14px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px var(--shadow);z-index:60;border:1px solid var(--border);max-width:min(92vw,420px);white-space:normal;word-break:break-word;text-align:center;line-height:1.4;}

/* ---------- tracker modals (move-to-reading / complete) ---------- */
#trackerModalRoot{position:absolute;inset:0;z-index:45;pointer-events:none;}
.tm-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;}
.tm-card{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:420px;max-width:94vw;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px var(--shadow);}
.tm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;}
.tm-head h3{font-size:16px;font-weight:700;margin:0;}
.tm-close{border:none;background:none;font-size:19px;cursor:pointer;color:var(--sub);}
.tm-body{padding:16px 20px 20px;}
.tm-field{display:block;}
.tm-field .lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;}
.tm-input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--bg2);color:var(--text);outline:none;}
.tm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.tm-actions button{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
.tm-actions .tm-cancel{background:var(--bg2);color:var(--text);}
.tm-actions .tm-confirm{background:var(--accent);color:#fff;}

/* ---------- Reader ---------- */
#reader{position:absolute;inset:0;display:none;flex-direction:column;}
#reader.active{display:flex;}
.top-bar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.icon-btn{
  background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.icon-btn:active{background:var(--bg2);}
.icon-btn svg{display:block;}
.top-title-wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;}
.top-title{min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-title-rating{flex:0 0 auto;display:inline-flex;}
.top-title-rating .mini-stars{vertical-align:-2px;}

.content-wrap{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;}

/* scroll mode */
#scrollPane{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}

/* page mode */
#pagePane{position:absolute;inset:0;overflow:hidden;}
#pageViewport{position:absolute;inset:0;overflow:hidden;}
.tap-zone{position:absolute;top:0;bottom:0;width:22%;z-index:5;}
.tap-zone.left{left:0;}
.tap-zone.right{right:0;}
/* top/bottom tap-layout variant: same edge strips, split into a small
   back zone up top and a larger forward zone below (display toggled by JS) */
.tap-zone.top{bottom:auto;height:30%;display:none;}
.tap-zone.bottom{top:auto;height:70%;display:none;}

/* ruler */
#ruler{
  position:absolute;left:0;right:0;height:34px;pointer-events:none;
  background:var(--ruler);border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);
  opacity:0;transition:opacity .15s;z-index:8;
}
#ruler.on{opacity:1;pointer-events:auto;cursor:grab;}
#ruler.on:active{cursor:grabbing;}
#ruler .handle{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;
}

.bottom-bar{
  display:flex;align-items:stretch;justify-content:space-between;
  padding:0 6px;flex:0 0 auto;font-size:12px;color:var(--sub);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.status-left{
  cursor:pointer;user-select:none;flex:1;min-width:0;
  display:flex;align-items:center;
  padding:15px 10px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.status-right{
  cursor:pointer;user-select:none;font-weight:600;border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;
  padding:15px 16px;
}
.status-left:active,.status-right:active{background:var(--bg2);}
.status-right.hidden-pct{opacity:0;}

/* settings panel */
#settingsSheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px var(--shadow);
  transform:translateY(100%);transition:transform .25s ease;z-index:20;
  max-height:82%;overflow-y:auto;padding:14px 18px 30px;
}
#settingsSheet.open{transform:translateY(0);}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:19;}
#scrim.open{opacity:1;pointer-events:auto;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.setting-group{margin-bottom:20px;}
.setting-group h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.row label{font-size:14px;}
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:3px;gap:3px;}
.seg button{
  flex:1;border:none;background:none;padding:8px 6px;font-size:12.5px;border-radius:7px;color:var(--text);cursor:pointer;font-weight:600;
}
.seg button.active{background:var(--accent);color:#fff;}
.theme-swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:44px;height:44px;border-radius:10px;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background-size:cover;background-position:center;position:relative;}
.swatch.active{border-color:var(--accent);}
.swatch .swatch-del{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--bg2);color:var(--text);border:1px solid var(--border);
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700;
}

/* ---------- Custom modal (replaces unreliable native confirm/prompt in embedded webviews) ---------- */
#modalScrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:29;}
#modalScrim.open{opacity:1;pointer-events:auto;}
#customModal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(320px,86%);
  background:var(--bg);border-radius:14px;box-shadow:0 10px 34px var(--shadow);
  padding:18px 18px 16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#customModal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.custom-modal-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.custom-modal-msg{font-size:13.5px;color:var(--sub);line-height:1.5;margin-bottom:10px;}
.modal-input{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:15px;margin-bottom:14px;
}
.custom-modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.custom-modal-actions button{border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;}
.custom-modal-actions .modal-cancel{background:var(--bg2);color:var(--text);}
.custom-modal-actions .modal-confirm{background:var(--accent);color:#fff;}
.font-list{display:flex;flex-direction:column;gap:6px;}
.font-opt{
  padding:10px 12px;border-radius:9px;background:var(--bg2);cursor:pointer;font-size:15px;
  display:flex;justify-content:space-between;align-items:center;
}
.font-opt.active{outline:2px solid var(--accent);}
input[type=range]{width:100%;accent-color:var(--accent);}
input[type=color]{width:44px;height:34px;border:none;border-radius:8px;padding:0;background:none;cursor:pointer;flex:0 0 auto;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.switch{width:44px;height:26px;border-radius:13px;background:var(--bg2);position:relative;cursor:pointer;flex:0 0 auto;}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--sub);transition:all .18s;}
.switch.on{background:var(--accent);}
.switch.on i{left:20px;background:#fff;}
.small-btn{background:var(--bg2);border:none;color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
.small-btn:disabled{opacity:.5;cursor:default;}
.small-btn.danger{color:#b0563f;}
.goal-current{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.5;}
.goal-current strong{color:var(--text);}
.goal-select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;margin:0;}
.goal-hint{font-size:11.5px;color:var(--sub);margin-top:6px;}
.search-result{padding:10px 12px;border-radius:9px;background:var(--bg2);cursor:pointer;margin-bottom:6px;}
.search-result-chapter{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin-bottom:3px;}
.search-result-excerpt{font-size:14px;line-height:1.4;}
.search-result-excerpt mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px;}

/* toc */
#tocSheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--bg);z-index:21;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;}
#tocSheet.open{transform:translateX(0);}
.toc-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.toc-list{overflow-y:auto;flex:1;padding:6px 0;}
.toc-item{padding:13px 20px;font-size:14.5px;border-bottom:1px solid var(--border);cursor:pointer;}
.toc-item.current{color:var(--accent);font-weight:700;}

.center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center;color:var(--sub);font-size:14px;}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hint-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body data-theme="paper">
<div id="app">

  <!-- LIBRARY (gallery pulled live from the Shelf & Spine tracker) -->
  <div id="library" class="active">
    <div class="lib-header">
      <h1>My Books</h1>
      <a class="back-link" href="index.html?home=1">Back to Shelf ›</a>
    </div>
    <div id="galleryRoot"></div>
    <input type="file" id="fileInput" accept=".epub,application/epub+zip" style="display:none;">
  </div>
  <div id="trackerModalRoot"></div>

  <!-- READER -->
  <div id="reader">
    <div class="top-bar">
      <button class="icon-btn" id="backBtn" title="Library">‹</button>
      <div class="top-title-wrap" id="topTitleWrap">
        <div class="top-title" id="topTitle"></div>
        <span class="top-title-rating" id="topTitleRating"></span>
      </div>
      <button class="icon-btn" id="tocBtn" title="Chapters">☰</button>

<script>
(function(){
"use strict";

/* ============================================================
   Storage helpers
   ============================================================ */
const LS_SETTINGS = 'reader.settings.v1';
const LS_PROG = 'reader.progress.v2'; // bookId -> {cfi, percent, updatedAt} — local mirror of PROGRESS_DOC
const LS_LOCATIONS = 'reader.locations.v1'; // bookId -> epub.js locations save() blob (device-local only, never synced)
const LS_CUSTOM_THEMES = 'reader.customThemes.v1';
const LS_GOALS = 'reader.goals.v1'; // bookId -> {type:'chapter'|'page', chapterIndex, chapterLabel, target}

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

const DEFAULT_SETTINGS = {
  theme:'paper', font:'literata', fontSize:18, lineHeight:1.7, letterSpacing:0, paraSpacing:1,
  viewMode:'page', percentVisible:true, statusMode:1, rulerOn:false, rulerPos:0.42, wpm:230, tapLayout:'sides',
  custom:{ image:null, color:'#1a1a1a', opacity:0.35, textColor:'#2a241c' },
  activeCustomThemeId:null
};
let settings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(LS_SETTINGS, {}));
// progressMap is this device's local mirror of exact reading position, keyed by the
// tracker's own book id (not a file hash — see the identity note further down). It's
// written to instantly for a snappy resume, and also synced up to PROGRESS_DOC below
// so another device picks up the same spot. locationsMap is kept separate and never
// synced: epub.js's location index is just a per-device pagination cache, regenerating
// it fresh on another device is fine and cheap-ish, and it can be too large to want in
// every Firestore read.
let progressMap = loadJSON(LS_PROG, {}); // bookId -> {cfi, percent, updatedAt}
let locationsMap = loadJSON(LS_LOCATIONS, {}); // bookId -> locations blob
let customThemes = loadJSON(LS_CUSTOM_THEMES, []); // [{id,name,image,color,opacity,textColor}]
let goalsMap = loadJSON(LS_GOALS, {}); // bookId -> goal object (see LS_GOALS comment) or absent if none set

function persistSettings(){ saveJSON(LS_SETTINGS, settings); }
function persistLocalProgress(){ saveJSON(LS_PROG, progressMap); }
function persistLocations(){ saveJSON(LS_LOCATIONS, locationsMap); }
function persistCustomThemes(){ saveJSON(LS_CUSTOM_THEMES, customThemes); }
function persistGoals(){ saveJSON(LS_GOALS, goalsMap); }
function currentGoal(){ return (book && goalsMap[book.id]) || null; }

/* ============================================================
   FIREBASE — same Shelf & Spine project as index.html and audiobooks.html.
   This app READS the "shelf-spine" collection (tracker books/wishlist) and
   WRITES to its own "books-app" collection (exact reading position). It
   only ever writes progressPercent/progressPercentUpdatedAt, rating, and
   status/dateFinished/priority/dueDate back into "shelf-spine" — the same
   fields the main tracker and Audiobooks itself write, and never anything
   that could clobber another format's data.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBqOuK-l7h5Do9sAk1y4MBxwYkFFu2pusY",
  authDomain: "readingtracker-73e78.firebaseapp.com",
  projectId: "readingtracker-73e78",
  storageBucket: "readingtracker-73e78.firebasestorage.app",
  messagingSenderId: "391536984056",
  appId: "1:391536984056:web:ec841e6e42dbfd51e8e00d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.enablePersistence().catch(()=>{});

function lsGet(key){ try{ return localStorage.getItem(key); } catch(e){ return null; } }
function lsSet(key, val){ try{ localStorage.setItem(key, val); return true; } catch(e){ return false; } }
function getCurrentUserId(){ return lsGet('shelf:currentUser') || 'shared'; }
const BOOKS_DOC = db.collection("shelf-spine").doc(getCurrentUserId());
const PROGRESS_DOC = db.collection("books-app").doc(getCurrentUserId());

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, ms){
  ms = ms || 2600;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
const SPINE_COLORS = ["#4A7A4C","#C08A4E","#7FB59A","#C29A2E","#8A9C5E","#B5794A","#5E8F87","#A0703F","#6E8A4E","#9C8248"];
function spineColor(title){ return SPINE_COLORS[hashStr(title||"x")%SPINE_COLORS.length]; }

/* ============================================================
   TRACKER STATE — books/wishlist as read from BOOKS_DOC, filtered to
   non-Audio formats (Physical/Digital). This is the library's real source
   of truth now; the per-device file cache below only ever supplies the
   actual bytes for a Digital book that's already listed here.
   ============================================================ */
let tstate = {
  loaded: false,
  allBooks: [],   // EVERY book from the tracker doc, all formats — never filtered when writing back
  books: [],      // format !== 'Audio' tracker books (this app's own view)
  wishlist: [],   // full wishlist; filtered to text/either wants in allBookItems()
  progress: {},   // bookId -> {cfi, percent, updatedAt} — Firestore's copy, merged into progressMap
  matches: {},    // bookId -> true once a file is cached in IndexedDB on this device
  modal: null,
};

function allBookItems(){
  const fromBooks = tstate.books.map(b => ({
    id: b.id, title: b.title, author: b.author, coverUrl: b.coverUrl,
    section: b.status === 'reading' ? 'reading' : (b.status === 'done' ? 'finished' : 'dnf'),
    source: 'book', raw: b,
  }));
  const fromWishlist = tstate.wishlist
    .filter(w => w.wantFormat === 'book' || !w.wantFormat) // only "Physical/Digital" or "Either" wants — skip audio-only
    .map(w => ({
      id: 'wish:'+w.id, title: w.title, author: w.author, coverUrl: w.coverUrl,
      section: 'toberead', source: 'wishlist', raw: w,
    }));
  return [...fromBooks, ...fromWishlist];
}
function findTrackerItem(id){ return allBookItems().find(i => i.id === id) || null; }

let booksReadyResolve, progressReadyResolve;
const booksReadyPromise = new Promise(res => { booksReadyResolve = res; });
const progressReadyPromise = new Promise(res => { progressReadyResolve = res; });

function loadTrackerBooks(){
  BOOKS_DOC.onSnapshot((snap) => {
    const data = snap.exists ? snap.data() : {};
    const incomingBooks = Array.isArray(data.books) ? data.books : [];
    const wishlist = Array.isArray(data.wishlist) ? data.wishlist : [];
    // Guard against a stale cached snapshot undoing a percent this device just
    // wrote — same fix, same reasoning, as Audiobooks' loadBooks(). Every other
    // field (rating, status, due date, etc.) still comes straight from the snapshot.
    const prevById = new Map(tstate.allBooks.map(b => [b.id, b]));
    const books = incomingBooks.map(b => {
      const prev = prevById.get(b.id);
      if (prev && (prev.progressPercentUpdatedAt||0) > (b.progressPercentUpdatedAt||0)){
        return { ...b, progressPercent: prev.progressPercent, progressPercentUpdatedAt: prev.progressPercentUpdatedAt };
      }
      return b;
    });
    tstate.allBooks = books;
    tstate.books = books.filter(b => b.format !== 'Audio');
    tstate.wishlist = wishlist;
    tstate.loaded = true;
    if (booksReadyResolve) { booksReadyResolve(); booksReadyResolve = null; }
    renderGallery();
  }, (err) => {
    console.error('Firestore sync error:', err);
    tstate.loaded = true;
    if (booksReadyResolve) { booksReadyResolve(); booksReadyResolve = null; }
    renderGallery();
  });
}

function loadReadingProgress(){
  PROGRESS_DOC.onSnapshot((snap) => {
    const data = snap.exists ? snap.data() : {};
    tstate.progress = (data && typeof data.progress === 'object' && data.progress) || {};
    // Merge into the local mirror: whichever side has the newer updatedAt wins,
    // same stale-snapshot guard idea used for progressPercent above.
    Object.keys(tstate.progress).forEach(bookId => {
      const remote = tstate.progress[bookId];
      const local = progressMap[bookId];
      if (!local || (remote.updatedAt||0) >= (local.updatedAt||0)){
        progressMap[bookId] = { ...local, ...remote };
      }
    });
    persistLocalProgress();
    if (progressReadyResolve) { progressReadyResolve(); progressReadyResolve = null; }
    renderGallery();
  }, (err) => {
    console.error('Progress sync error:', err);
    if (progressReadyResolve) { progressReadyResolve(); progressReadyResolve = null; }
  });
}

let progressSaveDebounce = null;
function persistProgressCloud(bookId, patch){
  progressMap[bookId] = { ...(progressMap[bookId]||{}), ...patch, updatedAt: Date.now() };
  persistLocalProgress();
  clearTimeout(progressSaveDebounce);
  progressSaveDebounce = setTimeout(() => {
    PROGRESS_DOC.set({ progress: { [bookId]: progressMap[bookId] } }, { merge: true })
      .catch(err => console.error('Failed to save reading position:', err));
  }, 900);
}
function persistProgressCloudNow(bookId, patch){
  progressMap[bookId] = { ...(progressMap[bookId]||{}), ...patch, updatedAt: Date.now() };
  persistLocalProgress();
  PROGRESS_DOC.set({ progress: { [bookId]: progressMap[bookId] } }, { merge: true })
    .catch(err => console.error('Failed to save reading position:', err));
}

// Applies `patch` to one tracker book and writes the FULL book list back to
// Firestore — see Audiobooks' saveBookPatch for why this always re-fetches
// from the server first rather than building the write from cached state.
let bookPatchChain = Promise.resolve();
function saveBookPatch(itemId, patch){
  const optimisticAllBooks = tstate.allBooks.map(b => b.id === itemId ? { ...b, ...patch } : b);
  tstate.allBooks = optimisticAllBooks;
  tstate.books = optimisticAllBooks.filter(b => b.format !== 'Audio');

  const run = () => BOOKS_DOC.get({ source: 'server' }).then(snap => {
    const data = snap.exists ? snap.data() : {};
    const freshBooks = Array.isArray(data.books) ? data.books : [];
    const newAllBooks = freshBooks.map(b => b.id === itemId ? { ...b, ...patch } : b);
    tstate.allBooks = newAllBooks;
    tstate.books = newAllBooks.filter(b => b.format !== 'Audio');
    renderGallery();
    return BOOKS_DOC.set({ books: newAllBooks }, { merge: true });
  });

  const outcome = bookPatchChain.then(run, run);
  bookPatchChain = outcome.catch(() => {});
  return outcome;
}

function setRating(bookId, value){
  value = Math.max(0, Math.min(5, Math.round(Number(value)*4)/4 || 0));
  const bk = tstate.books.find(b => b.id === bookId);
  if (!bk) return;
  if ((Number(bk.rating)||0) === value) return;
  const writePromise = saveBookPatch(bookId, { rating: value });
  renderGallery();
  updateReaderRatingRow();
  writePromise.catch(err => console.error('Failed to sync rating:', err));
}

// Pushes % done back into the tracker's own book record, so the "Currently
// Reading" card on the main site reflects reading progress too — same
// debounced-but-capped pattern as Audiobooks' syncPercentToMainSite, so a
// long uninterrupted reading session still flushes periodically (~20s)
// instead of only updating once you stop.
let bookSyncDebounce = null;
let bookSyncFirstPendingAt = 0;
const BOOK_SYNC_MAX_WAIT_MS = 20000;
function writeBookPercent(bookId, pct){
  saveBookPatch(bookId, { progressPercent: pct, progressPercentUpdatedAt: Date.now() })
    .catch(err => console.error('Failed to sync % to main site:', err));
}
function syncPercentToMainSite(bookId, pct){
  const bk = tstate.books.find(b => b.id === bookId);
  if (!bk || bk.status !== 'reading' || Math.round(Number(bk.progressPercent)||0) === pct) return;
  const now = Date.now();
  if (!bookSyncFirstPendingAt) bookSyncFirstPendingAt = now;
  clearTimeout(bookSyncDebounce);
  const wait = Math.max(0, Math.min(1500, BOOK_SYNC_MAX_WAIT_MS - (now - bookSyncFirstPendingAt)));
  bookSyncDebounce = setTimeout(() => {
    bookSyncFirstPendingAt = 0;
    writeBookPercent(bookId, pct);
  }, wait);
}
function syncPercentToMainSiteNow(bookId, pct){
  const bk = tstate.books.find(b => b.id === bookId);
  if (!bk || bk.status !== 'reading' || Math.round(Number(bk.progressPercent)||0) === pct) return;
  clearTimeout(bookSyncDebounce);
  bookSyncFirstPendingAt = 0;
  writeBookPercent(bookId, pct);
}

function formatDueDate(iso){
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return getCurrentUserId()==='tom' ? `${m}/${d}` : `${d}/${m}`;
}

/* IndexedDB: 'handles' holds FileSystemFileHandle objects (desktop-only, optional
   enhancement); 'files' holds the actual EPUB bytes (as the original File/Blob) so a book
   never has to be re-selected once it's been added, even on browsers/webviews without
   File System Access support (which is most mobile browsers, including this app's own
   embedded view). Both stores are keyed directly by the tracker's own book id now —
   the file cache is just "does this tracker book have bytes on this device yet", the
   same relationship Audiobooks has between its match cache and BOOKS_DOC. */
const HAS_FS_ACCESS = 'showOpenFilePicker' in window;
let idb = null;
function openIDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('reader-handles-db', 2);
    req.onupgradeneeded = ()=>{
      const d = req.result;
      if(!d.objectStoreNames.contains('handles')) d.createObjectStore('handles');
      if(!d.objectStoreNames.contains('files')) d.createObjectStore('files');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPut(store, id, val){
  if(!idb) idb = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = idb.transaction(store,'readwrite');
    tx.objectStore(store).put(val, id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(store, id){
  if(!idb) idb = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = idb.transaction(store,'readonly');
    const r = tx.objectStore(store).get(id);
    r.onsuccess = ()=>resolve(r.result || null);
    r.onerror = ()=>reject(r.error);
  });
}
async function idbDelete(store, id){
  if(!idb) idb = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = idb.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

/* ---------- Custom theme helpers ---------- */
function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function customOverlayRgba(c){
  c = c || {};
  const rgb = hexToRgb(c.color || '#000000');
  const a = (c.opacity != null ? c.opacity : 0.35);
  return `rgba(${rgb.r},${rgb.g},${rgb.b},${a})`;
}
// approximate flattened solid color (overlay tint blended over white) — used
// wherever a plain background color is needed (chrome that isn't the image itself)
function customBlendOverWhite(c, extra){
  c = c || {};
  const rgb = hexToRgb(c.color || '#000000');
  const a = Math.min(1, (c.opacity != null ? c.opacity : 0.35) + (extra||0));
  const r = Math.round(rgb.r*a + 255*(1-a));
  const g = Math.round(rgb.g*a + 255*(1-a));
  const b = Math.round(rgb.b*a + 255*(1-a));
  return `rgb(${r},${g},${b})`;
}
function getThemeColors(){
  if(settings.theme === 'custom'){
    const c = settings.custom || {};
    return { bg: customBlendOverWhite(c), text: c.textColor || '#222222', accent: c.textColor || '#222222' };
  }
  return THEME_COLORS[settings.theme] || THEME_COLORS.paper;
}
// keeps #app (and, via CSS vars, all the chrome — library, settings sheet, bars)

    styleEl = document.createElement('style');

// Refreshes tstate.matches for every currently-reading Digital book, by checking

/* ---------------- Opening a tracker book ---------------- */
async function openTrackerBook(item){
  if (item.source === 'wishlist') return openMoveWishModal(item.raw.id);
  if (item.raw && item.raw.format === 'Physical'){ toast('This is your physical copy — nothing to open here.'); return; }
  loadingMsg.style.display = 'flex';
  permMsg.style.display = 'none';
  showReader();

  // 1) Fast path: bytes already cached in IndexedDB on this device.
  let file = null;
  try{ file = await idbGet('files', item.id); }catch(e){ console.warn(e); }
  if (file){ await openTrackerBookFile(file, item); return; }

  // 2) Legacy/desktop fallback: a stored FileSystemFileHandle.
  if (HAS_FS_ACCESS){
    try{
      const handle = await idbGet('handles', item.id);
      if (handle){
        let perm = await handle.queryPermission({mode:'read'});
        if (perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
        if (perm === 'granted') file = await handle.getFile();
      }
    }catch(e){ console.warn(e); }
    if (file){
      await idbPut('files', item.id, file).catch(()=>{});
      tstate.matches[item.id] = true;
      await openTrackerBookFile(file, item);
      return;
    }
  }

  // 3) Nothing cached at all — same "tap to add file" prompt as the gallery card.
  loadingMsg.style.display = 'none';
  permMsg.querySelector('div').textContent = 'Add this book\'s EPUB file to open it.';
  permMsg.style.display = 'flex';
  $('#grantPermBtn').textContent = 'Add file…';
  $('#grantPermBtn').onclick = ()=> addFileForItem(item);
}

async function openTrackerBookFile(file, item){
  try{
    const epubBook = await openEpubFromFile(file);
    const metadata = await epubBook.loaded.metadata;
    const navigation = await epubBook.loaded.navigation;
    const dir = detectDirection(metadata);

    // Wait for this device's synced reading position to actually arrive before
    // deciding where to open — mounting immediately (before Firestore/local cache
    // is known) is exactly the class of bug Audiobooks' "resets to 0" note
    // describes: opening from a stale/empty position and then saving right over
    // a real one. This resolves fast in practice (Firestore's local persistence
    // usually already has it cached).
    await progressReadyPromise;

    book = {
      id: item.id, title: item.title || metadata.title || file.name, author: item.author || metadata.creator || '',
      dir, epubBook, rendition: null,
      navToc: buildNavToc(epubBook, navigation.toc),
      currentCfi: null, currentEndCfi: null, currentHref: null, currentIndex: 0, currentDisplayed: null,
      atStart:false, atEnd:false,
      savedCfi: null,
      wordCounts: null, locationsReady: false,
      trackerItem: item, // the tracker book/wishlist item this reader session is linked to
    };
    const prog = progressMap[item.id];
    if(prog && prog.cfi) book.savedCfi = prog.cfi;

    topTitle.textContent = book.title;
    $('#grantPermBtn').textContent = 'Add file…';
    loadingMsg.style.display = 'none';
    initReaderView();
    updateReaderRatingRow();

    // background: word counts (for time estimates) + locations (for percent/page-of-book)
    computeWordCounts(epubBook).then(res=>{ if(book && book.epubBook===epubBook){ book.wordCounts = res; updateBottomBar(); } }).catch(()=>{});
    const savedLocs = locationsMap[item.id];
    (savedLocs ? Promise.resolve(epubBook.locations.load(savedLocs)) : epubBook.locations.generate(1600))
      .then(()=>{
        if(!book || book.epubBook!==epubBook) return;
        book.locationsReady = true;
        updateBottomBar();
        try{
          locationsMap[item.id] = epubBook.locations.save();
          persistLocations();
        }catch(e){}
      }).catch(()=>{});
  }catch(err){
    console.error('openTrackerBookFile failed for', file.name, file.size, 'bytes:', err);
    loadingMsg.style.display = 'none';
    toast('Could not open this EPUB file.');
    showLibrary();
  }
}

    topTitleRatingEl.innerHTML = '';
    return;
  }

function detectDirection(metadata){
  const language = (metadata.language||'').toLowerCase();
  const metaDir = (metadata.direction||'').toLowerCase();
  if(metaDir==='rtl') return 'rtl';
  if(metaDir==='ltr') return 'ltr';
  return /^he|^iw|^ar|^fa|^ur/.test(language) ? 'rtl' : 'ltr';
}

function buildNavToc(epubBook, items, depth){
  depth = depth || 0;
  let out = [];
  (items||[]).forEach(item=>{
    let idx = null;
    try{ const s = epubBook.spine.get(item.href); idx = s ? s.index : null; }catch(e){}
    out.push({ label: (depth>0?'  '.repeat(depth):'') + (item.label||'').trim(), href: item.href, index: idx });
    if(item.subitems && item.subitems.length) out = out.concat(buildNavToc(epubBook, item.subitems, depth+1));
  });
  return out;
}

/* ============================================================
   Robust EPUB opening
   ------------------------------------------------------------
   Earlier attempts here called `ePub()` with no arguments and then
   `.open(buf, 'binary')` separately, wrapped in retry logic. That
   turned out to be the actual bug: constructing the Book and opening
   it in two steps left it failing the *first* time a given file was
   opened in a session and then succeeding on a subsequent attempt
   (which is exactly what re-picking the same file worked around).
   Going back to the single-step `ePub(buf)` form — which is what the
   known-good earlier version of this file used — avoids that
   altogether. A light retry is kept around the raw file read only,
   since a freshly-picked file's bytes can occasionally be reported
   before they're fully available.
   ============================================================ */
function looksLikeZip(buf){
  if(!buf || buf.byteLength < 4) return false;
  const b = new Uint8Array(buf, 0, 4);
  return b[0]===0x50 && b[1]===0x4B; // 'P','K'
}

async function readFileBuffer(file, attempt){
  const buf = await file.arrayBuffer();
  if(buf.byteLength && buf.byteLength === file.size && looksLikeZip(buf)) return buf;
  if(attempt >= 4){
    console.warn('EPUB read looks truncated/invalid after retries:', {got: buf.byteLength, expected: file.size});
    return buf; // give up and hand back whatever we have; let epub.js's own error surface
  }
  await new Promise(r=>setTimeout(r, 250*attempt));
  return readFileBuffer(file, attempt+1);
}

async function openEpubFromFile(file){
  const buf = await readFileBuffer(file, 1);
  const epubBook = ePub(buf);
  await epubBook.ready;
  return epubBook;
}

/* ============================================================
   EPUB metadata-only extraction (for library cards)
   ============================================================ */
async function extractEpubMeta(file){
  const epubBook = await openEpubFromFile(file);
  const metadata = await epubBook.loaded.metadata;
  let coverDataUrl = null;
  try{
    const coverUrl = await epubBook.coverUrl();
    if(coverUrl){
      const resp = await fetch(coverUrl);
      const blob = await resp.blob();
      coverDataUrl = await blobToDataUrl(blob);
      URL.revokeObjectURL(coverUrl);
    }
  }catch(e){ console.warn('cover extraction failed', e); }
  const result = {
    title: (metadata.title||'').trim(),
    author: (metadata.creator||'').trim(),
    coverDataUrl,
    dir: detectDirection(metadata)
  };
  try{ epubBook.destroy(); }catch(e){}
  return result;
}

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/* ============================================================
   Word counts (background, powers the time-remaining status modes)
   ============================================================ */
async function computeWordCounts(epubBook){
  const counts = [];
  let total = 0;
  for(const item of epubBook.spine.spineItems){
    try{
      await item.load(epubBook.load.bind(epubBook));
      const text = (item.document && item.document.body) ? item.document.body.textContent : '';
      const wc = (text.trim().match(/\S+/g)||[]).length;
      counts.push(wc); total += wc;
      item.unload();
    }catch(e){ counts.push(0); }
  }
  return {counts, total};
}

/* ============================================================
   Reader view: rendering via epub.js
   ============================================================ */
function applyTypography(){
  document.body.setAttribute('data-theme', settings.theme);
}

const GOOGLE_FONTS_URL = "https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Slab:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&family=Noto+Serif+Hebrew:wght@400;700&display=swap";

function injectDynamicStyle(contents){
  if(!contents || !contents.document) return;
  const doc = contents.document;
  // book content renders inside its own iframe document, so custom
  // webfonts need to be loaded there too (they don't inherit from the parent page)
  try{ contents.addStylesheet(GOOGLE_FONTS_URL); }catch(e){}
  const theme = getThemeColors();
  const stack = fontStack(settings.font);
  let paperBg;
  if(settings.theme==='paper' || settings.theme==='custom'){
    // The texture/image is painted once on the persistent #app shell behind the
    // reader (see body[data-theme] #app rules / updateCustomThemeCSS), which is
    // fixed to the viewport and never repainted. Each book page/section renders
    // in its own iframe, so if we painted the image here too it would be
    // re-sized ("cover") and re-positioned per section, making it look like it
    // zoomed and shifted on every page turn. Leaving the iframe transparent
    // lets the stable #app background show through unchanged on every page,
    // in both paginated and endless-scroll modes.
    paperBg = `background:transparent !important;`;
  } else {
    paperBg = `background:${theme.bg} !important;`;
  }
  const css = `
    html, body{ ${paperBg} color:${theme.text} !important; margin:0; }
    body, p, div, span, li, td{
      font-family:${stack} !important;
      font-size:${settings.fontSize}px !important;
      line-height:${settings.lineHeight} !important;
      letter-spacing:${settings.letterSpacing}px !important;
    }
    p{ margin:0 0 ${settings.paraSpacing}em !important; text-align:justify; text-wrap:pretty; orphans:2; widows:2; }
    h1,h2,h3{ line-height:1.3; margin:.6em 0 .5em; }
    hr{ border:none; border-top:1px solid ${theme.text}22; margin:2em 0; }
    a{ color:${theme.accent}; }
    img, svg{ max-width:100%; height:auto; }
  `;
  let styleEl = doc.getElementById('reader-dyn-style');
  if(!styleEl){
    styleEl = doc.createElement('style');
    styleEl.id = 'reader-dyn-style';
    doc.head.appendChild(styleEl);
  }
  styleEl.textContent = css;
}

function initReaderView(){
  applyTypography();
  updateViewModeUI();
  updateRulerPosition();
  mountRendition();
  updateBottomBar();
  saveProgressDebounced();
}

function createRendition(container, mode){
  const opts = mode==='page'
    ? { width:'100%', height:'100%', manager:'default', flow:'paginated', spread:'none', minSpreadWidth:9999, allowScriptedContent:false }
    : { width:'100%', height:'100%', manager:'continuous', flow:'scrolled', allowScriptedContent:false };
  const rendition = book.epubBook.renderTo(container, opts);
  rendition.hooks.content.register(injectDynamicStyle);
  rendition.hooks.content.register(attachContentTouch);
  rendition.on('relocated', onRelocated);
  return rendition;
}

function normText(s){ return (s||'').replace(/\s+/g,' ').trim(); }

// Collects the document's text nodes in order, skipping script/style/empty
// ones — used to build a searchable, position-mapped version of the page.
function getReadableTextNodes(doc){
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(p && (p.tagName==='SCRIPT'||p.tagName==='STYLE')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let n;
  while((n = walker.nextNode())) nodes.push(n);
  return nodes;
}

// Concatenates those text nodes into one string, remembering which node each
// character came from, so a match found in the combined string can be traced
// back to an exact (node, offset) — not just "somewhere in this block".
function buildCombinedText(nodes){
  let text = '';
  const starts = [];
  for(const node of nodes){
    starts.push({startIndex: text.length, node});
    text += node.nodeValue;
  }
  return {text, starts};
}

function resolvePosition(starts, index){
  for(let i=starts.length-1;i>=0;i--){
    if(index >= starts[i].startIndex){
      return {node: starts[i].node, offset: index - starts[i].startIndex};
    }
  }
  return null;
}

// Collapses whitespace runs to single spaces while keeping a map back to the
// original (unnormalized) string index for every character kept, so a match
// against the normalized text can still be located precisely in the source.
function normalizeWithMap(raw){
  let out = '';
  const idx = [];
  let lastWasSpace = true;
  for(let i=0;i<raw.length;i++){
    const ch = raw[i];
    if(/\s/.test(ch)){
      if(!lastWasSpace){ out += ' '; idx.push(i); lastWasSpace = true; }
    } else {
      out += ch; idx.push(i); lastWasSpace = false;
    }
  }
  if(out.endsWith(' ')){ out = out.slice(0,-1); idx.pop(); }
  return {norm: out, idx};
}

// Grabs a short snippet starting at the exact character under the top-left
// of the content area right now, from the *currently mounted* rendition
// If the user has manually selected text, that's the most reliable possible
// anchor — no guessing about which words are "at the top" or which iframe is
// actually the one on screen, since a selection can only exist in the frame
// the user is looking at. Prefer this whenever it's available.
function captureSelectionAnchor(){
  if(!book || !book.rendition) return null;
  try{
    const contentsArr = book.rendition.getContents();
    for(const contents of contentsArr){
      const doc = contents.document;
      if(!doc || !doc.getSelection) continue;
      const sel = doc.getSelection();
      if(sel && sel.rangeCount>0 && !sel.isCollapsed){
        const text = normText(sel.getRangeAt(0).toString());
        if(text.length >= 3){
          return { text: text.split(' ').slice(0,10).join(' ') };
        }
      }
    }
  }catch(e){}
  return null;
}

// Fallback when nothing's selected: grabs a snippet starting at the exact
// character under the top-left of the visible content area, from the
// *currently mounted* rendition (call this before tearing it down to switch
// modes). Two things matter here: (1) point-based hit testing rather than
// "which block intersects the viewport", because a single paragraph here
// often spans more than one screen — a block-level check would grab words
// from the start of the paragraph, not the words actually at the top of the
// visible screen; and (2) the continuous/scroll manager preloads neighboring
// sections into extra offscreen iframes for smooth scrolling, so we have to
// check which iframe's bounding box actually contains the point on screen
// right now, rather than just trying contents in array order — otherwise
// this can silently sample a buffered iframe that isn't what's visible.
function captureWordAnchor(){
  if(!book || !book.rendition) return null;
  try{
    const contentsArr = book.rendition.getContents();
    if(!contentsArr || !contentsArr.length) return null;
    const outerContainer = settings.viewMode==='scroll' ? scrollPane : pageViewport;
    const containerRect = outerContainer.getBoundingClientRect();
    for(let dy=6; dy<=100; dy+=6){
      for(let dx=6; dx<=48; dx+=14){
        const px = containerRect.left + dx;
        const py = containerRect.top + dy;
        for(const contents of contentsArr){
          const doc = contents.document;
          if(!doc || !doc.body || !doc.caretRangeFromPoint) continue;
          const win = doc.defaultView;
          const frameEl = win && win.frameElement;
          if(!frameEl) continue;
          const frameRect = frameEl.getBoundingClientRect();
          // Skip iframes that aren't actually under this on-screen point —
          // e.g. preloaded neighboring sections sitting off-screen.
          if(px < frameRect.left || px >= frameRect.right || py < frameRect.top || py >= frameRect.bottom) continue;
          const r = doc.caretRangeFromPoint(px - frameRect.left, py - frameRect.top);
          if(!(r && r.startContainer && r.startContainer.nodeType===3 &&
               doc.body.contains(r.startContainer) && normText(r.startContainer.nodeValue).length)) continue;
          const nodes = getReadableTextNodes(doc);
          const combined = buildCombinedText(nodes);
          let baseIndex = null;
          for(const s of combined.starts){
            if(s.node === r.startContainer){ baseIndex = s.startIndex + r.startOffset; break; }
          }
          if(baseIndex==null) continue;
          let snippet = normText(combined.text.slice(baseIndex, baseIndex+90));
          snippet = snippet.split(' ').slice(0,10).join(' ');
          if(snippet.length >= 8) return { text: snippet };
        }
      }
    }
  }catch(e){}
  return null;
}

// Searches the newly-mounted rendition's content for the exact text position
// where the snippet starts (not just which block contains it), and returns a
// Range spanning it.
function findAnchorRange(contentsArr, snippet){
  if(!snippet) return null;
  for(const contents of contentsArr){
    const doc = contents.document;
    if(!doc || !doc.body) continue;
    const nodes = getReadableTextNodes(doc);
    const combined = buildCombinedText(nodes);
    const { norm, idx } = normalizeWithMap(combined.text);
    const pos = norm.indexOf(snippet);
    if(pos < 0) continue;
    const rawStart = idx[pos];
    const rawEnd = idx[Math.min(pos + snippet.length - 1, idx.length-1)];
    const startPos = resolvePosition(combined.starts, rawStart);
    const endPos = resolvePosition(combined.starts, rawEnd);
    if(!startPos || !endPos) continue;
    try{
      const range = doc.createRange();
      range.setStart(startPos.node, startPos.offset);
      range.setEnd(endPos.node, Math.min(endPos.offset+1, endPos.node.nodeValue.length));
      return { contents, range };
    }catch(e){}
  }
  return null;
}

// In scroll mode, rendition.display(cfi) only guarantees the target is
// *somewhere* on screen, not that it's centered. This scrolls the actual
// container directly so the matched range lands in the middle of the
// viewport, bypassing epub.js's scroll-positioning for this step.
function scrollRangeToCenter(contents, range){
  try{
    const frameEl = contents.document.defaultView.frameElement;
    if(!frameEl) return false;
    const rects = range.getClientRects();
    const rect = rects && rects.length ? rects[0] : range.getBoundingClientRect();
    if(!rect) return false;
    const frameRect = frameEl.getBoundingClientRect();
    const paneRect = scrollPane.getBoundingClientRect();
    const rangeTop = scrollPane.scrollTop + (frameRect.top - paneRect.top) + rect.top;
    const rangeHeight = rect.height || 0;
    const targetTop = rangeTop - (paneRect.height / 2) + (rangeHeight / 2);
    scrollPane.scrollTop = Math.max(0, targetTop);
    return true;
  }catch(e){ return false; }
}

function cfiForRange(contents, range){
  try{ return contents.cfiFromRange(range); }catch(e){ return null; }
}

// startAtOverride lets a caller (e.g. the view-mode switch) land on a specific
// cfi instead of the book's normal remembered position — see switchViewMode.
// wordAnchor, if provided, is a snippet captured from the *previous* mode via
// captureWordAnchor(); once the new mode's initial display settles, we search
// its content for those words and snap onto them for a precise hand-off.
function mountRendition(startAtOverride, wordAnchor){
  if(book.rendition){ try{ book.rendition.destroy(); }catch(e){} book.rendition = null; }
  scrollPane.style.display = settings.viewMode==='scroll' ? 'block':'none';
  pagePane.style.display = settings.viewMode==='page' ? 'block':'none';
  const containerEl = settings.viewMode==='scroll' ? scrollPane : pageViewport;
  containerEl.innerHTML = '';
  book.rendition = createRendition(containerEl, settings.viewMode);
  const startAt = startAtOverride || book.currentCfi || book.savedCfi || undefined;
  const displayPromise = book.rendition.display(startAt);
  if(wordAnchor && wordAnchor.text){
    displayPromise.then(()=>{
      // Small delay so the manager (especially continuous/scrolled) finishes
      // laying out before we go searching its content.
      setTimeout(()=>{
        if(!book.rendition) return;
        try{
          const contentsArr = book.rendition.getContents();
          const found = findAnchorRange(contentsArr, wordAnchor.text);
          if(!found) return;
          if(settings.viewMode==='scroll'){
            if(!scrollRangeToCenter(found.contents, found.range)){
              const cfi = cfiForRange(found.contents, found.range);
              if(cfi) book.rendition.display(cfi);
            }
          } else {
            const cfi = cfiForRange(found.contents, found.range);
            if(cfi) book.rendition.display(cfi);
          }
        }catch(e){}
      }, 60);
    }).catch(()=>{});
  }
  return displayPromise;
}

function onRelocated(location){
  if(!book) return;
  book.currentCfi = location.start.cfi;
  book.currentHref = location.start.href;
  book.currentIndex = location.start.index;
  book.currentDisplayed = location.start.displayed || null;
  // The end of the currently visible range — roughly "the last word on screen".
  // Used as the hand-off point when switching between scroll and page view, so
  // the switch continues from what was last read rather than re-displaying
  // from the top of the visible range (which reads as a jump backwards).
  book.currentEndCfi = (location.end && location.end.cfi) || null;
  book.atStart = !!location.atStart;
  book.atEnd = !!location.atEnd;
  updateBottomBar();
  saveProgressDebounced();
  if(tocSheet.classList.contains('open')) renderTOC();
}

function reflowCurrent(){
  if(!book || !book.rendition) return;
  const r = book.rendition;
  r.getContents().forEach(injectDynamicStyle);
  if(settings.viewMode==='page' && book.currentCfi){
    r.display(book.currentCfi);
  }
}

/* ---------- Page navigation (tap zones + swipe, works anywhere on the page) ---------- */
function isRTL(){ return !!(book && book.dir==='rtl'); }

// turnPageAbs takes an absolute forward(true)/back(false) direction in reading order.
function turnPageAbs(goNext){
  if(!book || !book.rendition) return;
  if(goNext && book.atEnd) return;
  if(!goNext && book.atStart) return;
  if(goNext) book.rendition.next(); else book.rendition.prev();
}

// visualDir is the physical/on-screen direction the gesture implies ('left' or 'right'),
// independent of reading direction — RTL vs LTR only changes which epub.js call it maps to,
// so a left swipe/tap always *looks* like a left-moving turn, in either language.
function turnPage(visualDir){
  if(!book || !book.rendition) return;
  turnPageAbs((visualDir==='left') ? !isRTL() : isRTL());
}

let suppressTapClick = false;
// "sides" layout: left edge = back, right edge = forward (mirrored under RTL by turnPage)
$('#tapLeft').addEventListener('click', ()=>{ if(!suppressTapClick) turnPage('right'); });
$('#tapRight').addEventListener('click', ()=>{ if(!suppressTapClick) turnPage('left'); });
// "top/bottom" layout: on either edge strip, the bottom 70% turns forward and the
// top 30% goes back — direction is absolute (not affected by RTL), since it's driven
// by vertical position rather than which side of the screen was tapped.
$('#tapLeftBottom').addEventListener('click', ()=>{ if(!suppressTapClick) turnPageAbs(true); });
$('#tapRightBottom').addEventListener('click', ()=>{ if(!suppressTapClick) turnPageAbs(true); });
$('#tapLeftTop').addEventListener('click', ()=>{ if(!suppressTapClick) turnPageAbs(false); });
$('#tapRightTop').addEventListener('click', ()=>{ if(!suppressTapClick) turnPageAbs(false); });

function updateTapZoneLayout(){
  // note: .tap-zone.top / .tap-zone.bottom carry "display:none" in the stylesheet,
  // so showing them needs an explicit 'block' — setting '' just removes the inline
  // override and falls back to that CSS rule, which stays none and swallows taps.
  const topBottom = settings.tapLayout === 'topBottom';
  $('#tapLeft').style.display = topBottom ? 'none' : '';
  $('#tapRight').style.display = topBottom ? 'none' : '';
  $('#tapLeftTop').style.display = topBottom ? 'block' : 'none';
  $('#tapLeftBottom').style.display = topBottom ? 'block' : 'none';
  $('#tapRightTop').style.display = topBottom ? 'block' : 'none';
  $('#tapRightBottom').style.display = topBottom ? 'block' : 'none';
}

// Shared touch handlers, attached both to the outer pane (for the tap-zone strips and any
// blank chrome) and, via the epub.js content hook below, directly onto each chapter's iframe
// document — otherwise touches that start over the actual book text never bubble out of the
// iframe and swiping only worked at the very edges of the screen. Direction always follows
// the swipe itself (left-moving swipe = forward, right-moving = back) no matter where on the
// page it started or ended — including over the tap-zone strips, where we briefly suppress
// the strip's own click so a swipe there isn't immediately re-triggered as a fixed-direction tap.
let touchStartX = null, touchStartY = null;
function onContentTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}
function onContentTouchEnd(e){
  if(touchStartX===null || settings.viewMode!=='page' || !book || !book.rendition) { touchStartX=null; return; }
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - (touchStartY||0);
  touchStartX = null;
  if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return; // require a clearly horizontal swipe
  suppressTapClick = true;
  turnPage(dx < 0 ? 'left' : 'right');
  setTimeout(()=>{ suppressTapClick = false; }, 400);
}
pagePane.addEventListener('touchstart', onContentTouchStart, {passive:true});
pagePane.addEventListener('touchend', onContentTouchEnd, {passive:true});

function attachContentTouch(contents){
  if(!contents || !contents.document) return;
  const doc = contents.document;
  doc.addEventListener('touchstart', onContentTouchStart, {passive:true});
  doc.addEventListener('touchend', onContentTouchEnd, {passive:true});
}

window.addEventListener('resize', debounce(()=>{
  updateRulerPosition();
}, 200));

/* ---------- View mode switching ---------- */
function updateViewModeUI(){
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.v===settings.viewMode));
}
$('#viewSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  const newMode = btn.dataset.v;
  if(newMode === settings.viewMode) return;
  // Anchor the switch on the book's overall reading percentage rather than a
  // raw CFI. A raw CFI is inherently viewport-shaped (it means "top of this
  // particular page" or "top of this particular scroll screenful"), so
  // handing it straight to the other mode's display() still let the jump
  // size vary with font size / images / screen height. Percentage is
  // mode-agnostic — it's the same "35% through the book" regardless of how
  // that gets chunked into pages or scroll-screens — so converting through
  // it gives a small, consistent handoff instead of one that drifts.
  let anchor;
  if(book && book.locationsReady && book.currentCfi){
    try{
      const pct = book.epubBook.locations.percentageFromCfi(book.currentCfi);
      anchor = book.epubBook.locations.cfiFromPercentage(pct);
    }catch(e){ anchor = book.currentCfi; }
  } else {
    anchor = book ? (book.currentCfi || book.savedCfi || undefined) : undefined;
  }
  // Grab the actual words visible right now, before we tear this rendition
  // down — this is the real anchor; the CFI/percentage above is just the
  // coarse landing spot the new mode initially opens to while we search for
  // these words in it. A manual selection (if the user made one) is the most
  // reliable version of this — prefer it over the auto-detected guess.
  const wordAnchor = captureSelectionAnchor() || captureWordAnchor();
  settings.viewMode = newMode;
  persistSettings();
  updateViewModeUI();
  if(!book) return;
  mountRendition(anchor, wordAnchor);
});

/* ============================================================
   Bottom bar: percent + status cycle
   ============================================================ */
const STATUS_MODES = [
  'none','pageInBook','pageInChapter','timeInBook','timeInChapter','flipsInBook','flipsInChapter','goalTime','goalFlips'
];
const GOAL_MODES = ['goalTime','goalFlips'];

function currentPercent(){
  if(!book) return 0;
  if(book.locationsReady && book.currentCfi){
    try{ return book.epubBook.locations.percentageFromCfi(book.currentCfi); }catch(e){}
  }
  const total = (book.epubBook.spine && book.epubBook.spine.length) || 1;
  let frac = (book.currentIndex||0)/total;
  if(book.currentDisplayed && book.currentDisplayed.total){
    frac += (1/total) * ((book.currentDisplayed.page-1)/book.currentDisplayed.total);
  }
  return Math.max(0, Math.min(1, frac));
}

// Resolves the current reading goal (if any) to a fraction (0-1) of the way
// through the book — a chapter goal is expressed as the fraction of total
// words that precede that chapter's start; a page goal is expressed as the
// fraction of total locations (epub.js's pseudo-page index) up to the target.
// Returns null if there's no goal, or if the data needed to place it isn't
// ready yet (word counts / locations are computed in the background).
function goalTargetFraction(){
  const goal = currentGoal();
  if(!book || !goal) return null;
  if(goal.type === 'chapter'){
    if(book.wordCounts && book.wordCounts.counts && book.wordCounts.total){
      const counts = book.wordCounts.counts;
      let cum = 0;
      for(let i=0;i<goal.chapterIndex && i<counts.length;i++) cum += counts[i];
      return Math.max(0, Math.min(1, cum/book.wordCounts.total));
    }
    const total = (book.epubBook.spine && book.epubBook.spine.length) || 1;
    return Math.max(0, Math.min(1, goal.chapterIndex/total));
  }
  if(goal.type === 'page'){
    if(book.locationsReady && book.epubBook.locations.total){
      return Math.max(0, Math.min(1, goal.target/book.epubBook.locations.total));
    }
    return null;
  }
  return null;
}
// Fraction of the book still left to read before the goal is hit. 0 (or less,
// clamped to 0) once the goal has been reached or passed.
function goalRemainingFraction(){
  const tgt = goalTargetFraction();
  if(tgt==null) return null;
  return Math.max(0, tgt-currentPercent());
}

function wordsRemainingInChapter(){
  if(!book || !book.wordCounts) return null;
  const idx = book.currentIndex||0;
  let curFrac = 1;
  if(book.currentDisplayed && book.currentDisplayed.total){
    curFrac = 1 - (book.currentDisplayed.page/book.currentDisplayed.total);
  }
  return Math.round((book.wordCounts.counts[idx]||0) * curFrac);
}
function wordsRemainingInBook(){
  if(!book || !book.wordCounts) return null;
  const idx = book.currentIndex||0;
  let rem = wordsRemainingInChapter() || 0;
  for(let i=idx+1;i<book.wordCounts.counts.length;i++) rem += book.wordCounts.counts[i];
  return rem;
}
function fmtTime(words){
  if(words==null) return null;
  const mins = words / settings.wpm;
  if(mins < 1) return '<1 min';
  if(mins < 60) return Math.round(mins)+' min';
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h+'h '+(m>0? m+'m':'');
}

function updateBottomBar(){
  if(!book) return;
  const pct = Math.round(currentPercent()*100);
  statusRight.textContent = pct+'%';
  statusRight.classList.toggle('hidden-pct', !settings.percentVisible);

  const mode = STATUS_MODES[settings.statusMode];
  let text = '';
  switch(mode){
    case 'none': text=''; break;
    case 'pageInBook':
      if(book.locationsReady && book.currentCfi){
        const loc = book.epubBook.locations.locationFromCfi(book.currentCfi);
        text = `Page ${loc+1} of ${book.epubBook.locations.total}`;
      } else text = 'Calculating…';
      break;
    case 'pageInChapter':
      if(settings.viewMode==='page' && book.currentDisplayed){
        text = `Page ${book.currentDisplayed.page} of ${book.currentDisplayed.total} (chapter)`;
      } else text = 'Page view only';
      break;
    case 'timeInBook': {
      const t = fmtTime(wordsRemainingInBook());
      text = t ? (t+' left in book') : 'Calculating…';
      break;
    }
    case 'timeInChapter': {
      const t = fmtTime(wordsRemainingInChapter());
      text = t ? (t+' left in chapter') : 'Calculating…';
      break;
    }
    case 'flipsInBook':
      if(book.locationsReady && book.currentCfi){
        const loc = book.epubBook.locations.locationFromCfi(book.currentCfi);
        text = (book.epubBook.locations.total-loc-1)+' pages left in book';
      } else text = 'Calculating…';
      break;
    case 'flipsInChapter':
      if(settings.viewMode==='page' && book.currentDisplayed){
        text = (book.currentDisplayed.total-book.currentDisplayed.page)+' flips left in chapter';
      } else text = 'Switch to page view';
      break;
    case 'goalTime': {
      const goal = currentGoal();
      if(!goal){ text=''; break; }
      const rem = goalRemainingFraction();
      if(rem==null){ text = 'Calculating…'; break; }
      if(rem<=0){ text=''; break; } // goal reached — nothing to show
      if(!book.wordCounts || !book.wordCounts.total){ text = 'Calculating…'; break; }
      const t = fmtTime(rem * book.wordCounts.total);
      text = t ? (t+' left to goal') : '';
      break;
    }
    case 'goalFlips': {
      const goal = currentGoal();
      if(!goal){ text=''; break; }
      const rem = goalRemainingFraction();
      if(rem==null){ text = 'Calculating…'; break; }
      if(rem<=0){ text=''; break; } // goal reached — nothing to show
      if(!book.locationsReady || !book.epubBook.locations.total){ text = 'Calculating…'; break; }
      const flips = Math.round(rem * book.epubBook.locations.total);
      text = flips>0 ? (flips+' flips left to goal') : '';
      break;
    }
  }
  statusLeft.textContent = text;
}

statusRight.addEventListener('click', ()=>{
  settings.percentVisible = !settings.percentVisible;
  persistSettings();
  updateBottomBar();
});
statusLeft.addEventListener('click', ()=>{
  let next = settings.statusMode;
  for(let i=0;i<STATUS_MODES.length;i++){
    next = (next+1) % STATUS_MODES.length;
    if(GOAL_MODES.includes(STATUS_MODES[next]) && !currentGoal()) continue; // nothing to cycle to
    break;
  }

  persistSettings();
  updateBottomBar();
});

function updateRulerPosition(){
  const wrap = $('#contentWrap');
  const h = wrap.clientHeight;
  const lh = settings.fontSize * settings.lineHeight;
  rulerEl.style.height = Math.max(28, lh+6)+'px';
  const top = settings.rulerPos * (h - rulerEl.offsetHeight);
  rulerEl.style.top = top+'px';
  rulerEl.classList.toggle('on', settings.rulerOn);
}

(function setupRulerDrag(){
  let dragging=false, startY=0, startTop=0;
  function down(y){
    dragging=true; startY=y; startTop=parseFloat(rulerEl.style.top||0);
  }
  function move(y){
    if(!dragging) return;
    const wrap = $('#contentWrap');
    const h = wrap.clientHeight;
    let top = startTop + (y-startY);
    top = Math.max(0, Math.min(top, h-rulerEl.offsetHeight));
    rulerEl.style.top = top+'px';
    settings.rulerPos = top / (h-rulerEl.offsetHeight || 1);
  }
  function up(){ if(dragging){ dragging=false; persistSettings(); } }
  rulerEl.addEventListener('mousedown', e=>down(e.clientY));
  window.addEventListener('mousemove', e=>move(e.clientY));
  window.addEventListener('mouseup', up);
  rulerEl.addEventListener('touchstart', e=>down(e.touches[0].clientY), {passive:true});
  rulerEl.addEventListener('touchmove', e=>{ move(e.touches[0].clientY); }, {passive:true});
  rulerEl.addEventListener('touchend', up);
})();

/* ============================================================
   Custom modal (confirm/prompt replacement)
   ------------------------------------------------------------
   window.confirm()/prompt() are unreliable (often no-op or throw)
   inside embedded webviews like this app's own, so anything that
   needs a yes/no or a short text answer goes through this instead.
   Resolves to: null if cancelled/dismissed; true if confirmed with
   no input field; the trimmed input string if confirmed with one.
   ============================================================ */
let modalResolve = null;
function showModal(opts){
  opts = opts || {};
  return new Promise(resolve=>{
    modalResolve = resolve;
    modalTitle.textContent = opts.title || '';
    modalMsg.textContent = opts.message || '';
    modalMsg.style.display = opts.message ? '' : 'none';
    modalInput.style.display = opts.showInput ? 'block' : 'none';
    modalInput.value = opts.inputValue || '';
    modalInput.placeholder = opts.placeholder || '';
    modalConfirmBtn.textContent = opts.confirmLabel || 'OK';
    modalCancelBtn.textContent = opts.cancelLabel || 'Cancel';
    modalScrim.classList.add('open');
    customModal.classList.add('open');
    if(opts.showInput) setTimeout(()=>{ modalInput.focus(); modalInput.select(); }, 60);
  });
}
function closeModal(result){
  modalScrim.classList.remove('open');
  customModal.classList.remove('open');
  const resolve = modalResolve;
  modalResolve = null;
  if(resolve) resolve(result);
}
modalCancelBtn.addEventListener('click', ()=> closeModal(null));
modalScrim.addEventListener('click', ()=> closeModal(null));
modalConfirmBtn.addEventListener('click', ()=>{
  if(modalInput.style.display !== 'none') closeModal(modalInput.value.trim());
  else closeModal(true);
});
modalInput.addEventListener('keydown', e=>{
  if(e.key==='Enter') modalConfirmBtn.click();
  if(e.key==='Escape') closeModal(null);
});
